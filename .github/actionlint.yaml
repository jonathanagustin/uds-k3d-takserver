# GitHub added these permission scopes before actionlint knew about them.
# The shared Scorecard workflow requests them through `permissions: read-all`.
paths:
  .github/workflows/scorecard-analysis.yaml:
    ignore:
      - 'unknown permission scope "(code-quality|drives|vulnerability-alerts)"'
  .github/workflows/scorecard.yaml:
    ignore:
      - 'unknown permission scope "(code-quality|drives|vulnerability-alerts)"'
  # GitHub supports FIFO queues; pinned actionlint 1.7.12 does not know this
  # single key yet. tests/test_image_producers.py validates these sections.
  .github/workflows/test.yaml:
    ignore:
      - '^unexpected key "queue" for "concurrency" section\. expected one of "cancel-in-progress", "group"$'
  .github/workflows/cloudtak-image.yaml:
    ignore:
      - '^unexpected key "queue" for "concurrency" section\. expected one of "cancel-in-progress", "group"$'
  .github/workflows/postgis-image.yaml:
    ignore:
      - '^unexpected key "queue" for "concurrency" section\. expected one of "cancel-in-progress", "group"$'
  .github/workflows/atak.yaml:
    ignore:
      - '^unexpected key "queue" for "concurrency" section\. expected one of "cancel-in-progress", "group"$'
  .github/workflows/atak-e2e.yaml:
    ignore:
      - '^unexpected key "queue" for "concurrency" section\. expected one of "cancel-in-progress", "group"$'

# GitHub-hosted native ARM 22 and Ubuntu 26 labels. ARM 22 is official;
# Ubuntu 22 retires 2027-04-17 (actions/runner-images#14254). Ubuntu 26 is GA (actions/runner-images
# #14747), but actionlint 1.7.12 does not list them yet.
self-hosted-runner:
  labels:
    - ubuntu-22.04-arm
    - ubuntu-26.04
    - ubuntu-26.04-arm
