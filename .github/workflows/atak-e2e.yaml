# ATAK test device end to end: UDS Core slim + TAK Server (the normal test
# deploy), then KubeVirt, the Android-x86 VM, the adb driver and the viewer.
# Optional component, amd64 with KVM only. Not part of the default tests.
name: ATAK e2e

on:
  workflow_dispatch:
    inputs:
      uptime_probe:
        description: Add Core monitoring and prove the authenticated viewer probe
        type: boolean
        default: false
  pull_request:
    paths:
      - "atak/**"
      # Only inactive scenario docs are excluded; runtime helpers stay active.
      - "!atak/scenarios/**"
      - "atak/scenarios/android-interoperability.py"
      - "atak/scenarios/observe-peer.py"
      - "atak/scenarios/android-ui.py"
      - "atak/scenarios/radial-details.py"
      - "atak/scenarios/details-icon.json"
      - "takx/mission-package/build_fixture.py"
      - "takx/mission-package/fixtures.lock.json"
      - "takx/mission-package/fixtures/manifest.xml"
      - "takx/mission-package/fixtures/point.cot"
      - "takx/mission-package/fixtures/README.txt"
      - "demo/atak-adb.sh"
      - ".github/workflows/atak-e2e.yaml"
  # Publishes the device images under the ATAK release tag after a merge.
  push:
    branches: [main]
    paths:
      - "atak/**"
      # Only inactive scenario docs are excluded; runtime helpers stay active.
      - "!atak/scenarios/**"
      - "atak/scenarios/android-interoperability.py"
      - "atak/scenarios/observe-peer.py"
      - "atak/scenarios/android-ui.py"
      - "atak/scenarios/radial-details.py"
      - "atak/scenarios/details-icon.json"
      - "takx/mission-package/build_fixture.py"
      - "takx/mission-package/fixtures.lock.json"
      - "takx/mission-package/fixtures/manifest.xml"
      - "takx/mission-package/fixtures/point.cot"
      - "takx/mission-package/fixtures/README.txt"
      - "demo/atak-adb.sh"
      - ".github/workflows/atak-e2e.yaml"

permissions:
  contents: read

env:
  CACHE: ghcr.io/jonathanagustin/uds-takserver/build-cache
  # The tests use local "dev" images. They come from GHCR under a tag made of
  # the ATAK version and a hash of their inputs (atak/ci/device-images.sh);
  # the images job builds and pushes the ones that are not there yet. Only
  # main moves RELEASE_TAG (the atak-civ submodule tag), after the test
  # passes. Fork pull requests cannot push, so they build in the e2e job.
  ATAK_TAG: dev
  RELEASE_TAG: 5.5.1.10
  VM_IMAGE: ghcr.io/jonathanagustin/uds-takserver/atak-civ-vm:dev
  VIEWER_IMAGE: ghcr.io/jonathanagustin/uds-takserver/atak-viewer:dev
  DRIVER_IMAGE: ghcr.io/jonathanagustin/uds-takserver/atak-driver:dev

jobs:
  admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
      packages: read
    outputs:
      reuse: ${{ steps.decide.outputs.reuse }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install UDS CLI
        if: github.event_name == 'push'
        continue-on-error: true
        timeout-minutes: 1
        uses: defenseunicorns/setup-uds@d6add59d4c2ca789ed7c92741e91bd340b4e950b # v1.0.2
        with:
          version: v0.41.0
      - name: Check exact tested push reuse
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == push ]]; then
            UDS_VERSION="$(uds version 2>/dev/null)" || UDS_VERSION=""
            export UDS_VERSION
          fi
          python3 -B atak/ci/push-reuse.py admit

  # Runs beside the e2e job's UDS Core and TAK deploy. With every image
  # already in GHCR it finishes in under a minute.
  images:
    needs: admission
    if: ${{ !cancelled() && (needs.admission.result != 'success' || needs.admission.outputs.reuse != 'true') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    # ATAK's standalone APK job uses this same queue. Different input sets
    # also serialize; each admitted producer rechecks its own immutable tags.
    concurrency:
      group: atak-apk-producer
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Pushes the keyed device images and the GHCR build cache.
      packages: write
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Find the images to build
        id: plan
        run: |
          ./atak/ci/device-images.sh keys | tee -a "${GITHUB_STEP_SUMMARY}"
          todo="$(./atak/ci/device-images.sh missing | tr '\n' ' ')"
          echo "missing: ${todo:-none}"
          echo "missing=${todo}" >> "${GITHUB_OUTPUT}"

      # The APK build needs the disk the preinstalled toolchains take.
      - name: Trim the runner
        if: contains(steps.plan.outputs.missing, 'atak-civ-apk') || contains(steps.plan.outputs.missing, 'atak-driver')
        run: ./.github/scripts/trim-runner.sh

      - name: Build and push the missing images
        if: steps.plan.outputs.missing != ''
        timeout-minutes: 150
        env:
          PUSH: "true"
        run: ./atak/ci/device-images.sh build

  e2e:
    needs: admission
    if: ${{ !cancelled() && (needs.admission.result != 'success' || needs.admission.outputs.reuse != 'true') }}
    # Supersede only consumers. A workflow-level gate would also cancel the
    # immutable image producer while it is warming the shared APK cache.
    concurrency:
      group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.run_id || 'gate' }}-consumer
      cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    # Pinned like the other cluster jobs (#219). On the ubuntu-26.04 image that
    # ubuntu-latest is moving to, virt-handler exits with 'Failed to create an
    # inotify watcher: too many open files', so KubeVirt never becomes Available.
    runs-on: ubuntu-24.04
    permissions:
      # Reads the images job's state while it waits for the images.
      actions: read
      contents: read
      # Pulls the device images; publishes the Zarf package and, on main,
      # the release tags.
      packages: write
    timeout-minutes: 300
    env:
      FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The toolchain deletes run while the CLIs install.
      - name: Start trimming the runner
        run: ./.github/scripts/trim-runner.sh start

      - name: Let the runner use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Docker Compose
        uses: docker/setup-compose-action@54042514f505b273907334ae2b9cdbb9a0213c1a # v2.4.0
        with:
          version: v5.7.0

      - name: Install UDS CLI
        uses: defenseunicorns/setup-uds@d6add59d4c2ca789ed7c92741e91bd340b4e950b # v1.0.2
        with:
          # renovate: datasource=github-tags depName=defenseunicorns/uds-cli versioning=semver
          version: v0.41.0

      - name: Trim the runner
        run: ./.github/scripts/trim-runner.sh finish

      # A fork's token cannot push, so there is no images job: build here,
      # before the cluster needs the disk and memory (the old serial path).
      - name: Build the device images (fork)
        if: env.FORK == 'true'
        timeout-minutes: 150
        run: |
          ./atak/ci/device-images.sh build
          # The APK build leaves many GB of NDK, Conan and Gradle layers in the
          # BuildKit container. Drop the builder before UDS Core and TAK.
          docker buildx rm --all-inactive --force || true
          docker buildx prune -af || true
          docker ps -a --filter name=buildx_buildkit -q | xargs -r docker rm -f
          df -h /
          free -h

      # The checkpoint is 5.5 GB; a restore is faster than the GHCR pull.
      # Only main and manual runs save it, to spare the 10 GB Actions cache.
      - name: Read the UDS Core checkpoint version
        id: slim
        run: echo "version=$(sed -n 's/^slim_core_version=\([0-9.]*\).*/\1/p' .github/scripts/deploy-slim-core.sh)" >> "${GITHUB_OUTPUT}"

      - name: Restore the UDS Core checkpoint
        id: slim-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/k3d-core-slim-dev
          key: k3d-core-slim-dev-${{ runner.arch }}-${{ steps.slim.outputs.version }}

      - name: Environment setup
        run: |
          echo "MARU_AUTH=\"{\"raw.githubusercontent.com\": \"${{ secrets.GITHUB_TOKEN }}\"}\"" >> "$GITHUB_ENV"
          uds run actions:setup-environment \
          --set REGISTRY1_USERNAME="${{ secrets.IRON_BANK_ROBOT_USERNAME }}" \
          --set REGISTRY1_PASSWORD="${{ secrets.IRON_BANK_ROBOT_PASSWORD }}" \
          --set GH_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
          --set RAPIDFORT_USERNAME="${{ secrets.RAPIDFORT_USERNAME }}" \
          --set RAPIDFORT_PASSWORD="${{ secrets.RAPIDFORT_PASSWORD }}" \
          --set CHAINGUARD_IDENTITY="${{ secrets.CHAINGUARD_IDENTITY }}"
        shell: bash

      # PR producers publish immutable keyed tags, not the main-only plain tags.
      - name: Wait for the six TAK images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_IF_MISSING: "false"
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: ./.github/scripts/wait-for-tak-images.sh

      - name: Wait for the CloudTAK image
        run: ./.github/container-and-chart/cloudtak/build.sh --wait

      - name: Wait for the PostGIS image
        run: ./.github/container-and-chart/postgis/build.sh --wait

      - name: Use the selected source's keyed application images
        run: ./.github/scripts/pin-image-tags.sh

      - name: Deploy UDS Core slim and TAK Server
        run: uds run actions:test-deploy --set FLAVOR=upstream --set TYPE=install --set OPTIONS="" --set LICENSE_KEY="${{ secrets.LICENSE_KEY }}"
        shell: bash
        timeout-minutes: 90

      - name: Save the UDS Core checkpoint
        if: success() && github.event_name != 'pull_request' && steps.slim-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/k3d-core-slim-dev
          key: k3d-core-slim-dev-${{ runner.arch }}-${{ steps.slim.outputs.version }}

      # The images job builds what is missing while the deploy above runs.
      # A published Zarf package with the same inputs replaces the package
      # create, and then only the driver image is needed here.
      - name: Get the device images
        id: device
        if: env.FORK != 'true'
        timeout-minutes: 150
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGES_JOB: images
        run: |
          set -euo pipefail
          UDS_VERSION="$(uds version)"
          export UDS_VERSION
          ./atak/ci/device-images.sh keys
          pkg="$(./atak/ci/device-images.sh package-ref)"
          echo "package=${pkg}" >> "${GITHUB_OUTPUT}"
          if [[ -n "${pkg}" ]]; then
            echo "Deploying the published package ${pkg}"
            ONLY=atak-driver ./atak/ci/device-images.sh wait
          else
            ./atak/ci/device-images.sh wait
          fi
          docker image ls | grep atak
          df -h /
        shell: bash

      # Opt-in while the extra monitoring footprint is measured on this KVM
      # runner. Deploy before ATAK so its Package creates a Probe immediately.
      - name: Add monitoring for the ATAK viewer probe
        if: github.event_name == 'workflow_dispatch' && inputs.uptime_probe
        timeout-minutes: 25
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/atak-monitoring"
          uds create atak/ci/monitoring --architecture amd64 \
            --output "${RUNNER_TEMP}/atak-monitoring" --confirm
          uds deploy "${RUNNER_TEMP}/atak-monitoring/uds-bundle-atak-uptime-monitoring-amd64-dev.tar.zst" --confirm
          uds zarf tools kubectl get crd probes.monitoring.coreos.com
          uds zarf tools kubectl describe node | sed -n '/Allocated resources:/,/Events:/p'
          free -h

      - name: ATAK device end to end
        env:
          ATAK_INTEROP_SCENARIO: "true"
          ATAK_PACKAGE: ${{ steps.device.outputs.package }}
          PKG_DIR: ${{ runner.temp }}/atak-package
        run: |
          # Playwright from atak/ci/package-lock.json.
          npm ci --prefix atak/ci --no-audit --no-fund >/dev/null
          NODE_PATH="${PWD}/atak/ci/node_modules" OUT=out ./atak/ci/e2e.sh
        timeout-minutes: 90

      - name: Record the tested checkout and scenario
        if: github.event_name == 'pull_request' && env.FORK != 'true'
        run: |
          UDS_VERSION="$(uds version)"
          export UDS_VERSION
          python3 -B atak/ci/push-reuse.py record --output "${RUNNER_TEMP}/tested-checkout.json"

      - name: Upload the tested checkout proof
        if: github.event_name == 'pull_request' && env.FORK != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: atak-tested-checkout-v1
          path: ${{ runner.temp }}/tested-checkout.json
          if-no-files-found: error
          retention-days: 7

      # Off on pull_request and push. tests/test_atak_uptime.py runs this check
      # against Prometheus instant-query semantics, including lookback.
      - name: Prove the authenticated ATAK viewer uptime probe
        if: github.event_name == 'workflow_dispatch' && inputs.uptime_probe
        timeout-minutes: 10
        run: python3 -B atak/ci/uptime-probe.py

      # Keyed by its inputs, so a later run with the same ones deploys it
      # instead of creating it. Not from forks.
      - name: Publish the Zarf package
        if: success() && env.FORK != 'true' && steps.device.outputs.package == ''
        run: |
          UDS_VERSION="$(uds version)"
          export UDS_VERSION
          ./atak/ci/device-images.sh publish-package "${RUNNER_TEMP}/atak-package" \
            || echo "::warning::Could not publish the ATAK Zarf package; the next run creates it again."

      # RELEASE_TAG points at the keyed images and package this run tested.
      # No pull or push: the manifests are already in GHCR. UDS_VERSION is
      # part of the package key, as in the steps above.
      - name: Publish the device images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          UDS_VERSION="$(uds version)"
          export UDS_VERSION
          ./atak/ci/device-images.sh release

      - name: Debug
        if: failure()
        run: |
          uds zarf tools kubectl get pods -A -o wide || true
          uds zarf tools kubectl get vm,vmi -n atak -o yaml || true
          uds zarf tools kubectl get events -n atak --sort-by=.lastTimestamp || true
          uds zarf tools kubectl get events -n kubevirt --sort-by=.lastTimestamp || true
          filter=.github/scripts/redact-then-filter.sh
          uds zarf tools kubectl logs -n pepr-system -l app=pepr-uds-core-admission 2>/dev/null | "${filter}" --ignore-case --grep 'deny|kubevirt|atak' --tail 200 || echo "omitted unsanitizable admission log"
          for p in $(uds zarf tools kubectl get pod -n atak -l kubevirt.io=virt-launcher -o name); do
            uds zarf tools kubectl get -n atak "${p}" -o yaml 2>/dev/null | "${filter}" || echo "omitted unsanitizable launcher"
            uds zarf tools kubectl logs -n atak "${p}" -c compute 2>/dev/null | "${filter}" --tail 300 || echo "omitted unsanitizable compute log"
            uds zarf tools kubectl logs -n atak "${p}" -c guest-console-log 2>/dev/null | "${filter}" --tail 400 || echo "omitted unsanitizable guest log"
          done
          uds zarf tools kubectl logs -n kubevirt ds/virt-handler -c virt-handler 2>/dev/null | "${filter}" --tail 400 || echo "omitted unsanitizable virt-handler log"
          uds zarf tools kubectl logs -n kubevirt -l kubevirt.io=virt-controller --prefix 2>/dev/null | "${filter}" --ignore-case --grep 'atak|error|fail' --tail 200 || echo "omitted unsanitizable virt-controller log"
          uds zarf tools kubectl logs -n kubevirt -l kubevirt.io=virt-api --prefix 2>/dev/null | "${filter}" --ignore-case --grep 'error|fail|denied' --tail 200 || echo "omitted unsanitizable virt-api log"
          uds zarf tools kubectl get networkpolicy -n atak -o wide || true

      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: atak-e2e
          path: out/
          if-no-files-found: warn
