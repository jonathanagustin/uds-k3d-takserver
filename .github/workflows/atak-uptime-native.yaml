# Bounded check of the ATAK viewer freshness queries against Prometheus.
# The ATAK e2e uptime_probe input stays off. This job does not deploy Core,
# Blackbox, or the device, and it does not use a larger runner.
name: ATAK uptime native

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "atak/ci/uptime-probe.py"
      - "tests/test_atak_uptime_native.py"
      - ".github/workflows/atak-uptime-native.yaml"

permissions:
  contents: read

jobs:
  prometheus:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Update the version and the sha256 together. The digest is
      # prometheus-<version>.linux-amd64.tar.gz from that release's sha256sums.txt.
      PROMETHEUS_VERSION: "3.16.0"
      PROMETHEUS_SHA256: 68727009472a2c02e1ff7f062fd5b3e637285bffc8fc2d340c76fb449d6e0f34
      REQUIRE_NATIVE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Prometheus
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/prometheus.tar.gz"
          curl -fsSLo "${archive}" \
            "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz"
          echo "${PROMETHEUS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" -C "${RUNNER_TEMP}"
          bin="${RUNNER_TEMP}/prometheus-${PROMETHEUS_VERSION}.linux-amd64/prometheus"
          test -x "${bin}"
          "${bin}" --version
          echo "PROMETHEUS_BIN=${bin}" >> "${GITHUB_ENV}"

      - name: Query native Prometheus
        run: |
          set -euo pipefail
          mkdir -p out
          python3 -B -m unittest tests.test_atak_uptime_native -v

      - name: Show native Prometheus evidence
        if: always()
        run: |
          set -euo pipefail
          test -f out/atak-uptime-native.json
          cat out/atak-uptime-native.json
          grep -q '"accepted": true' out/atak-uptime-native.json
          grep -q '"accepted": false' out/atak-uptime-native.json
