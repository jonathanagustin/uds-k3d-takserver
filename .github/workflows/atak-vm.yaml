name: ATAK device VM

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "atak/vm/**"
      - "atak/ci/**"
      - "atak/viewer/**"
      - ".github/workflows/atak-vm.yaml"

permissions:
  contents: read

concurrency:
  # A newer pull request push or main push cancels the older run of this
  # workflow on that ref. Schedule and workflow_dispatch each get their own
  # run id: they are not cancelled, and they do not wait behind a push.
  # Release and Demo Video are not in this group. A finished run is kept.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.run_id || 'gate' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  vm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Build cache in GHCR (see atak.yaml).
      packages: write
    timeout-minutes: 60
    env:
      KUBEVIRT_VERSION: v1.9.1
      K3D_VERSION: v5.8.3
      # sha256 of k3d-linux-amd64 for K3D_VERSION, from the release's
      # checksums.txt. Update both together.
      K3D_SHA256: dbaa79a76ace7f4ca230a1ff41dc7d8a5036a8ad0309e9c54f9bf3836dbe853e
      # sha256 of the v1.9.1 release assets. Update these with KUBEVIRT_VERSION
      # and atak/zarf.yaml. The KubeVirt CR is atak/deploy/kubevirt-cr.yaml.
      VIRTCTL_SHA256: c289393c8186a258653594605f5199b4c171a3131e6e409ed204a96b491b782a
      KUBEVIRT_OPERATOR_SHA256: 9ac45a436c49d32e6fc21d542bcb7600b970705297b9e6752f3ef9b0a1d292da
      IMAGE: ghcr.io/jonathanagustin/uds-takserver/atak-civ-vm:dev
      VIEWER_IMAGE: ghcr.io/jonathanagustin/uds-takserver/atak-viewer:dev
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Let the runner use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the containerDisk
        run: |
          start=$(date +%s)
          docker buildx build -f atak/vm/Dockerfile -t "${IMAGE}" --load \
            --cache-from type=registry,ref=ghcr.io/jonathanagustin/uds-takserver/build-cache:atak-vm \
            --cache-to type=registry,ref=ghcr.io/jonathanagustin/uds-takserver/build-cache:atak-vm,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true .
          echo "build seconds: $(( $(date +%s) - start ))"
          docker image ls "${IMAGE}"

      - name: Build the viewer
        run: |
          docker buildx build -f atak/viewer/Dockerfile -t "${VIEWER_IMAGE}" --load \
            --cache-from type=registry,ref=ghcr.io/jonathanagustin/uds-takserver/build-cache:atak-viewer \
            --cache-to type=registry,ref=ghcr.io/jonathanagustin/uds-takserver/build-cache:atak-viewer,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true .
          docker image ls "${VIEWER_IMAGE}"

      - name: k3d and KubeVirt
        run: |
          set -euo pipefail
          curl -fsSLo "${RUNNER_TEMP}/k3d" "https://github.com/k3d-io/k3d/releases/download/${K3D_VERSION}/k3d-linux-amd64"
          echo "${K3D_SHA256}  ${RUNNER_TEMP}/k3d" | sha256sum -c -
          sudo install -m 0755 "${RUNNER_TEMP}/k3d" /usr/local/bin/k3d
          k3d version
          k3d cluster create atak --agents 0 --k3s-arg '--disable=traefik@server:0' --wait
          start=$(date +%s)
          k3d image import -c atak "${IMAGE}" "${VIEWER_IMAGE}"
          echo "import seconds: $(( $(date +%s) - start ))"
          base="https://github.com/kubevirt/kubevirt/releases/download/${KUBEVIRT_VERSION}"
          curl -fsSLo "${RUNNER_TEMP}/kubevirt-operator.yaml" "${base}/kubevirt-operator.yaml"
          echo "${KUBEVIRT_OPERATOR_SHA256}  ${RUNNER_TEMP}/kubevirt-operator.yaml" | sha256sum -c -
          kubectl apply -f "${RUNNER_TEMP}/kubevirt-operator.yaml"
          # The release CR with the ImageVolume and Template gates disabled,
          # the same one the Zarf package applies.
          kubectl apply -f atak/deploy/kubevirt-cr.yaml
          kubectl -n kubevirt wait kv kubevirt --for condition=Available --timeout=15m

      - name: Boot Android and reach it over adb
        run: OUT=out ./atak/ci/vm-smoke.sh

      - name: Phone view in a browser
        run: OUT=out ./atak/ci/viewer-smoke.sh

      - name: Debug
        if: failure()
        run: |
          mkdir -p out
          # A bad virtctl download stops only the screenshot. The logs below still run.
          if curl -fsSL -o "${RUNNER_TEMP}/virtctl" "https://github.com/kubevirt/kubevirt/releases/download/${KUBEVIRT_VERSION}/virtctl-${KUBEVIRT_VERSION}-linux-amd64" \
            && echo "${VIRTCTL_SHA256}  ${RUNNER_TEMP}/virtctl" | sha256sum -c -; then
            sudo install -m 0755 "${RUNNER_TEMP}/virtctl" /usr/local/bin/virtctl
            virtctl vnc screenshot -n atak atak-device --file out/vnc.png || true
          else
            echo "virtctl download did not match ${VIRTCTL_SHA256}" >&2
          fi
          filter=.github/scripts/redact-then-filter.sh
          kubectl get pods -A -o wide 2>/dev/null | "${filter}" || echo "omitted unsanitizable pod list"
          kubectl get vm,vmi -n atak -o yaml 2>/dev/null | "${filter}" || echo "omitted unsanitizable virtual machine"
          kubectl get events -n atak --sort-by=.lastTimestamp 2>/dev/null | "${filter}" || echo "omitted unsanitizable events"
          kubectl describe pod -n atak 2>/dev/null | "${filter}" || echo "omitted unsanitizable pod description"
          kubectl logs -n kubevirt -l kubevirt.io=virt-handler 2>/dev/null | "${filter}" --tail 100 || echo "omitted unsanitizable virt-handler log"
          for p in $(kubectl get pod -n atak -l kubevirt.io=virt-launcher -o name); do
            kubectl logs -n atak "${p}" -c guest-console-log 2>/dev/null | "${filter}" --tail 3000 || echo "omitted unsanitizable guest log"
          done
          pod="$(kubectl get pod -n atak -l kubevirt.io/domain=atak-device -o name | head -1)"
          if [ -n "${pod}" ]; then
            kubectl logs -n atak "${pod}" -c compute 2>/dev/null | "${filter}" --tail 200 || echo "omitted unsanitizable compute log"
          fi

      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: atak-vm-smoke
          path: out/
          if-no-files-found: warn
