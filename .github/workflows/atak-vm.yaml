name: ATAK device VM

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "atak/vm/**"
      - "atak/ci/**"
      - "atak/viewer/**"
      - ".github/workflows/atak-vm.yaml"

permissions:
  contents: read
  # Build cache in GHCR (see atak.yaml).
  packages: write

concurrency:
  group: atak-vm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  vm:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KUBEVIRT_VERSION: v1.6.2
      K3D_VERSION: v5.8.3
      IMAGE: ghcr.io/jonathanagustin/uds-k3d-takserver/atak-civ-vm:dev
      VIEWER_IMAGE: ghcr.io/jonathanagustin/uds-k3d-takserver/atak-viewer:dev
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Let the runner use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the containerDisk
        run: |
          start=$(date +%s)
          docker buildx build -f atak/vm/Dockerfile -t "${IMAGE}" --load \
            --cache-from type=registry,ref=ghcr.io/jonathanagustin/uds-k3d-takserver/build-cache:atak-vm \
            --cache-to type=registry,ref=ghcr.io/jonathanagustin/uds-k3d-takserver/build-cache:atak-vm,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true .
          echo "build seconds: $(( $(date +%s) - start ))"
          docker image ls "${IMAGE}"

      - name: Build the viewer
        run: |
          docker buildx build -f atak/viewer/Dockerfile -t "${VIEWER_IMAGE}" --load \
            --cache-from type=registry,ref=ghcr.io/jonathanagustin/uds-k3d-takserver/build-cache:atak-viewer \
            --cache-to type=registry,ref=ghcr.io/jonathanagustin/uds-k3d-takserver/build-cache:atak-viewer,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true .
          docker image ls "${VIEWER_IMAGE}"

      - name: k3d and KubeVirt
        run: |
          curl -fsSL https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | TAG="${K3D_VERSION}" bash
          k3d cluster create atak --agents 0 --k3s-arg '--disable=traefik@server:0' --wait
          start=$(date +%s)
          k3d image import -c atak "${IMAGE}" "${VIEWER_IMAGE}"
          echo "import seconds: $(( $(date +%s) - start ))"
          kubectl apply -f "https://github.com/kubevirt/kubevirt/releases/download/${KUBEVIRT_VERSION}/kubevirt-operator.yaml"
          kubectl apply -f "https://github.com/kubevirt/kubevirt/releases/download/${KUBEVIRT_VERSION}/kubevirt-cr.yaml"
          kubectl -n kubevirt wait kv kubevirt --for condition=Available --timeout=15m

      - name: Boot Android and reach it over adb
        run: OUT=out ./atak/ci/vm-smoke.sh

      - name: Phone view in a browser
        run: OUT=out ./atak/ci/viewer-smoke.sh

      - name: Debug
        if: failure()
        run: |
          mkdir -p out
          curl -fsSL -o /usr/local/bin/virtctl "https://github.com/kubevirt/kubevirt/releases/download/${KUBEVIRT_VERSION}/virtctl-${KUBEVIRT_VERSION}-linux-amd64" 2>/dev/null \
            || sudo curl -fsSL -o /usr/local/bin/virtctl "https://github.com/kubevirt/kubevirt/releases/download/${KUBEVIRT_VERSION}/virtctl-${KUBEVIRT_VERSION}-linux-amd64"
          sudo chmod +x /usr/local/bin/virtctl || true
          virtctl vnc screenshot -n atak atak-device --file out/vnc.png || true
          kubectl get pods -A -o wide || true
          kubectl get vm,vmi -n atak -o yaml || true
          kubectl get events -n atak --sort-by=.lastTimestamp || true
          kubectl describe pod -n atak || true
          kubectl logs -n kubevirt -l kubevirt.io=virt-handler --tail=100 || true
          for p in $(kubectl get pod -n atak -l kubevirt.io=virt-launcher -o name); do
            kubectl logs -n atak "${p}" -c guest-console-log --tail=3000 || true
          done
          pod="$(kubectl get pod -n atak -l kubevirt.io/domain=atak-device -o name | head -1)"
          [ -n "${pod}" ] && kubectl logs -n atak "${pod}" -c compute --tail=200 || true

      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: atak-vm-smoke
          path: out/
          if-no-files-found: warn
