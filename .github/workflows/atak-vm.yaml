name: ATAK device VM

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "atak/vm/**"
      - "atak/ci/**"
      - "atak/viewer/**"
      - ".github/workflows/atak-vm.yaml"

permissions:
  contents: read

concurrency:
  group: atak-vm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  vm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Build cache in GHCR (see atak.yaml).
      packages: write
    timeout-minutes: 60
    env:
      KUBEVIRT_VERSION: v1.8.4
      K3D_VERSION: v5.8.3
      # sha256 of k3d-linux-amd64 for K3D_VERSION, from the release's
      # checksums.txt. Update both together.
      K3D_SHA256: dbaa79a76ace7f4ca230a1ff41dc7d8a5036a8ad0309e9c54f9bf3836dbe853e
      # sha256 of the v1.8.4 release assets. Update these with KUBEVIRT_VERSION.
      VIRTCTL_SHA256: 7125d69c3b3e9c8185c106d9cdf77a817491e4657ac47f4509fb40d7aea59cca
      KUBEVIRT_OPERATOR_SHA256: d1d8264eec5b802c122bec6c54d8c3b11e119ee2a5c75602aaa8b53ea3857eda
      KUBEVIRT_CR_SHA256: 43106136dbce3312bdbfdeae612aacafc6c12da518d233f90645b4685d84a2af
      IMAGE: ghcr.io/jonathanagustin/uds-k3d-takserver/atak-civ-vm:dev
      VIEWER_IMAGE: ghcr.io/jonathanagustin/uds-k3d-takserver/atak-viewer:dev
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Let the runner use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the containerDisk
        run: |
          start=$(date +%s)
          docker buildx build -f atak/vm/Dockerfile -t "${IMAGE}" --load \
            --cache-from type=registry,ref=ghcr.io/jonathanagustin/uds-k3d-takserver/build-cache:atak-vm \
            --cache-to type=registry,ref=ghcr.io/jonathanagustin/uds-k3d-takserver/build-cache:atak-vm,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true .
          echo "build seconds: $(( $(date +%s) - start ))"
          docker image ls "${IMAGE}"

      - name: Build the viewer
        run: |
          docker buildx build -f atak/viewer/Dockerfile -t "${VIEWER_IMAGE}" --load \
            --cache-from type=registry,ref=ghcr.io/jonathanagustin/uds-k3d-takserver/build-cache:atak-viewer \
            --cache-to type=registry,ref=ghcr.io/jonathanagustin/uds-k3d-takserver/build-cache:atak-viewer,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true .
          docker image ls "${VIEWER_IMAGE}"

      - name: k3d and KubeVirt
        run: |
          set -euo pipefail
          curl -fsSLo "${RUNNER_TEMP}/k3d" "https://github.com/k3d-io/k3d/releases/download/${K3D_VERSION}/k3d-linux-amd64"
          echo "${K3D_SHA256}  ${RUNNER_TEMP}/k3d" | sha256sum -c -
          sudo install -m 0755 "${RUNNER_TEMP}/k3d" /usr/local/bin/k3d
          k3d version
          k3d cluster create atak --agents 0 --k3s-arg '--disable=traefik@server:0' --wait
          start=$(date +%s)
          k3d image import -c atak "${IMAGE}" "${VIEWER_IMAGE}"
          echo "import seconds: $(( $(date +%s) - start ))"
          base="https://github.com/kubevirt/kubevirt/releases/download/${KUBEVIRT_VERSION}"
          curl -fsSLo "${RUNNER_TEMP}/kubevirt-operator.yaml" "${base}/kubevirt-operator.yaml"
          curl -fsSLo "${RUNNER_TEMP}/kubevirt-cr.yaml" "${base}/kubevirt-cr.yaml"
          echo "${KUBEVIRT_OPERATOR_SHA256}  ${RUNNER_TEMP}/kubevirt-operator.yaml" | sha256sum -c -
          echo "${KUBEVIRT_CR_SHA256}  ${RUNNER_TEMP}/kubevirt-cr.yaml" | sha256sum -c -
          kubectl apply -f "${RUNNER_TEMP}/kubevirt-operator.yaml"
          kubectl apply -f "${RUNNER_TEMP}/kubevirt-cr.yaml"
          kubectl -n kubevirt wait kv kubevirt --for condition=Available --timeout=15m

      - name: Boot Android and reach it over adb
        run: OUT=out ./atak/ci/vm-smoke.sh

      - name: Phone view in a browser
        run: OUT=out ./atak/ci/viewer-smoke.sh

      - name: Debug
        if: failure()
        run: |
          mkdir -p out
          # A bad virtctl download stops only the screenshot. The logs below still run.
          if curl -fsSL -o "${RUNNER_TEMP}/virtctl" "https://github.com/kubevirt/kubevirt/releases/download/${KUBEVIRT_VERSION}/virtctl-${KUBEVIRT_VERSION}-linux-amd64" \
            && echo "${VIRTCTL_SHA256}  ${RUNNER_TEMP}/virtctl" | sha256sum -c -; then
            sudo install -m 0755 "${RUNNER_TEMP}/virtctl" /usr/local/bin/virtctl
            virtctl vnc screenshot -n atak atak-device --file out/vnc.png || true
          else
            echo "virtctl download did not match ${VIRTCTL_SHA256}" >&2
          fi
          kubectl get pods -A -o wide || true
          kubectl get vm,vmi -n atak -o yaml || true
          kubectl get events -n atak --sort-by=.lastTimestamp || true
          kubectl describe pod -n atak || true
          kubectl logs -n kubevirt -l kubevirt.io=virt-handler --tail=100 || true
          for p in $(kubectl get pod -n atak -l kubevirt.io=virt-launcher -o name); do
            kubectl logs -n atak "${p}" -c guest-console-log --tail=3000 || true
          done
          pod="$(kubectl get pod -n atak -l kubevirt.io/domain=atak-device -o name | head -1)"
          if [ -n "${pod}" ]; then
            kubectl logs -n atak "${pod}" -c compute --tail=200 || true
          fi

      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: atak-vm-smoke
          path: out/
          if-no-files-found: warn
