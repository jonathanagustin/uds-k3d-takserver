name: ATAK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "atak/apk/**"
      - "atak/ci/build-apk.sh"
      - "upstream/atak-civ"
      - ".gitmodules"
      - ".github/workflows/atak.yaml"

permissions:
  contents: read

jobs:
  apk:
    # Share the heavy APK producer with ATAK e2e. Recheck the immutable image
    # and stage cache after admission, so another workflow's work is reused.
    concurrency:
      group: atak-apk-producer
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Build cache in GHCR. The Actions cache limit is 10 GB, and these
      # layers do not fit beside the other entries.
      packages: write
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out the ATAK submodule and its LFS files
        run: ./atak/ci/fetch-source.sh

      - name: Free runner disk
        run: ./.github/scripts/free-runner-disk.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The ATAK e2e workflow publishes the APK as a scratch image tagged with
      # the ATAK version and a hash of its inputs (atak/ci/device-images.sh).
      # When that tag exists, the APK is copied out of it instead of rebuilt.
      - name: Build the APK
        env:
          CACHE: ghcr.io/jonathanagustin/uds-takserver/build-cache
        run: |
          set -euo pipefail
          ref="$(./atak/ci/device-images.sh keys | sed -n 's/^APK_IMAGE_KEYED=//p')"
          if docker buildx imagetools inspect "${ref}" >/dev/null 2>&1; then
            echo "Using ${ref}"
            docker pull -q "${ref}"
            mkdir -p out
            id="$(docker create "${ref}" /atak-civ.apk)"
            docker cp "${id}:/atak-civ.apk" out/atak-civ.apk
            docker rm "${id}" >/dev/null
            ls -la out
          else
            ./atak/ci/build-apk.sh
          fi
        shell: bash

      - name: Upload the APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: atak-civ-apk
          path: out/atak-civ.apk
          if-no-files-found: error
