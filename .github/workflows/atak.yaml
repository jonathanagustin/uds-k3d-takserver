name: ATAK

on:
  workflow_dispatch:
  push:
    branches:
      - feat/atak-kubevirt
  pull_request:
    paths:
      - "atak/**"
      - "upstream/atak-civ"
      - ".gitmodules"
      - ".github/workflows/atak.yaml"

permissions:
  contents: read

concurrency:
  group: atak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true

      - name: Pull the LFS files the Android build reads
        working-directory: upstream/atak-civ
        run: |
          git lfs install --local
          git lfs pull --exclude="takthirdparty/distfiles/pdfium/win*,takthirdparty/distfiles/pdfium/mac*,takthirdparty/distfiles/mrsid/win*,takthirdparty/distfiles/mrsid/ios*,takthirdparty/distfiles/mrsid/mac*"
          du -sh .

      - name: Move Docker to the larger disk
        run: |
          ./.github/scripts/free-runner-disk.sh
          sudo systemctl stop docker docker.socket
          sudo mkdir -p /mnt/docker
          echo '{"data-root":"/mnt/docker"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker
          df -h / /mnt

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the APK
        run: |
          start=$(date +%s)
          docker buildx build -f atak/apk/Dockerfile --target apk \
            --cache-from type=gha,scope=atak-apk \
            --cache-to type=gha,scope=atak-apk,mode=max,ignore-error=true \
            --output type=local,dest=out .
          echo "build seconds: $(( $(date +%s) - start ))"
          ls -la out

      - name: Upload the APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: atak-civ-apk
          path: out/atak-civ.apk
          if-no-files-found: error

  vm:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KUBEVIRT_VERSION: v1.9.1
      K3D_VERSION: v5.8.3
      IMAGE: ghcr.io/jonathanagustin/uds-k3d-takserver/atak-civ-vm:dev
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Let the runner use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the containerDisk
        run: |
          start=$(date +%s)
          docker buildx build -f atak/vm/Dockerfile -t "${IMAGE}" --load \
            --cache-from type=gha,scope=atak-vm --cache-to type=gha,scope=atak-vm,mode=max,ignore-error=true .
          echo "build seconds: $(( $(date +%s) - start ))"
          docker image ls "${IMAGE}"

      - name: k3d and KubeVirt
        run: |
          curl -fsSL https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | TAG="${K3D_VERSION}" bash
          k3d cluster create atak --agents 0 --k3s-arg '--disable=traefik@server:0' --wait
          start=$(date +%s)
          k3d image import -c atak "${IMAGE}"
          echo "import seconds: $(( $(date +%s) - start ))"
          kubectl apply -f "https://github.com/kubevirt/kubevirt/releases/download/${KUBEVIRT_VERSION}/kubevirt-operator.yaml"
          kubectl apply -f "https://github.com/kubevirt/kubevirt/releases/download/${KUBEVIRT_VERSION}/kubevirt-cr.yaml"
          kubectl -n kubevirt wait kv kubevirt --for condition=Available --timeout=15m

      - name: Boot Android and reach it over adb
        run: OUT=out ./atak/ci/vm-smoke.sh

      - name: Debug
        if: failure()
        run: |
          kubectl get pods -A -o wide || true
          kubectl describe vmi -n atak atak-device || true
          pod="$(kubectl get pod -n atak -l kubevirt.io/domain=atak-device -o name | head -1)"
          [ -n "${pod}" ] && kubectl logs -n atak "${pod}" -c compute --tail=200 || true

      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: atak-vm-smoke
          path: out/
          if-no-files-found: warn
