name: CloudTAK image

# Builds ghcr.io/jonathanagustin/uds-k3d-takserver/cloudtak from the
# upstream/cloudtak submodule. Pull requests build it in the Test workflow's
# images job, before the package is created.
on:
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even when the published image has the same inputs
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - .gitmodules
      - upstream/cloudtak
      - .github/container-and-chart/cloudtak/**
      - .github/workflows/cloudtak-image.yaml

permissions:
  contents: read

concurrency:
  group: cloudtak-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # fetch-depth 1 makes the submodule fetch shallow too.
          submodules: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        env:
          PUSH_IMAGES: "true"
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
        run: |
          if [ "${FORCE}" = "true" ]; then
            ./.github/container-and-chart/cloudtak/build.sh
          else
            ./.github/container-and-chart/cloudtak/build.sh --if-changed
          fi
