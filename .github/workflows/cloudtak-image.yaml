name: CloudTAK image

# Builds ghcr.io/jonathanagustin/uds-k3d-takserver/cloudtak from the
# upstream/cloudtak submodule. The Test workflow also builds it on pull
# requests, but it skips a pull request that only changes
# .github/container-and-chart. The package and scan workflows wait for the
# image, so a pull request that only changes it needs this build too. Both
# builds use build.sh --if-changed, so whichever runs second finds the tag
# already carries the same inputs.
on:
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even when the published image has the same inputs
        default: false
        type: boolean
  pull_request:
    paths:
      - .gitmodules
      - upstream/cloudtak
      - .github/container-and-chart/cloudtak/**
      - .github/workflows/cloudtak-image.yaml
      - .github/actions/attest-images/**
  push:
    branches:
      - main
    paths:
      - .gitmodules
      - upstream/cloudtak
      - .github/container-and-chart/cloudtak/**
      - .github/workflows/cloudtak-image.yaml
      - .github/actions/attest-images/**

permissions:
  contents: read

concurrency:
  group: cloudtak-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One native runner per architecture, each pushing <version>-<key>-<arch>
  # and, on main, <version>-<arch>. index joins them under <version>, the
  # tag zarf.yaml references.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      # build.sh fetches only upstream/cloudtak, shallow.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        env:
          PUSHED_REFS: ${{ runner.temp }}/pushed-refs.txt
          PUSH_IMAGES: "true"
          ARCH: ${{ matrix.arch }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
        run: |
          if [ "${FORCE}" = "true" ]; then
            ./.github/container-and-chart/cloudtak/build.sh
          else
            ./.github/container-and-chart/cloudtak/build.sh --if-changed
          fi

      - name: Attest the pushed images
        uses: ./.github/actions/attest-images
        with:
          refs-file: ${{ runner.temp }}/pushed-refs.txt

  index:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Write the multi-arch index
        env:
          PUSHED_REFS: ${{ runner.temp }}/pushed-refs.txt
        run: ./.github/container-and-chart/cloudtak/build.sh --merge

      - name: Attest the pushed images
        uses: ./.github/actions/attest-images
        with:
          refs-file: ${{ runner.temp }}/pushed-refs.txt
          include-platforms: "false"
