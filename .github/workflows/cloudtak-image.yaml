name: CloudTAK image

# Builds ghcr.io/jonathanagustin/uds-k3d-takserver/cloudtak from the
# upstream/cloudtak submodule. The Test workflow also builds it on pull
# requests, but it skips a pull request that only changes
# .github/container-and-chart. The package and scan workflows wait for the
# image, so a pull request that only changes it needs this build too. Both
# builds use build.sh --if-changed, so whichever runs second finds the tag
# already carries the same inputs.
on:
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even when the published image has the same inputs
        default: false
        type: boolean
  pull_request:
    paths:
      - .gitmodules
      - upstream/cloudtak
      - .github/container-and-chart/cloudtak/**
      - .github/workflows/cloudtak-image.yaml
  push:
    branches:
      - main
    paths:
      - .gitmodules
      - upstream/cloudtak
      - .github/container-and-chart/cloudtak/**
      - .github/workflows/cloudtak-image.yaml

permissions:
  contents: read

concurrency:
  group: cloudtak-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One native runner per architecture, each pushing v13.111.3-<key>-<arch> and, on main, v13.111.3-<arch>.
  # index joins them under v13.111.3, the tag zarf.yaml references.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      # build.sh fetches only upstream/cloudtak, shallow.
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        env:
          PUSH_IMAGES: "true"
          ARCH: ${{ matrix.arch }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
        run: |
          if [ "${FORCE}" = "true" ]; then
            ./.github/container-and-chart/cloudtak/build.sh
          else
            ./.github/container-and-chart/cloudtak/build.sh --if-changed
          fi

  index:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Write the multi-arch index
        run: ./.github/container-and-chart/cloudtak/build.sh --merge
