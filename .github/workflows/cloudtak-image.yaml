name: CloudTAK image

# Test and this workflow share immutable-key producer queues. The first
# successful producer publishes; later producers recheck and reuse the tag.
on:
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even when the published image has the same inputs
        default: false
        type: boolean
  pull_request:
    paths:
      - .gitmodules
      - upstream/cloudtak
      - .github/container-and-chart/cloudtak/**
      - .github/workflows/cloudtak-image.yaml
      - .github/actions/attest-images/**
  push:
    branches:
      - main
    paths:
      - .gitmodules
      - upstream/cloudtak
      - .github/container-and-chart/cloudtak/**
      - .github/workflows/cloudtak-image.yaml
      - .github/actions/attest-images/**

permissions:
  contents: read

concurrency:
  # A newer pull request push or main push cancels the older run of this
  # workflow on that ref. Schedule and workflow_dispatch each get their own
  # run id: they are not cancelled, and they do not wait behind a push.
  # Release and Demo Video are not in this group. A finished run is kept.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.run_id || 'gate' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  image-keys:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      cloudtak: ${{ steps.keys.outputs.cloudtak }}
      postgis: ${{ steps.keys.outputs.postgis }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve immutable image keys
        id: keys
        run: |
          echo "cloudtak=$(./.github/container-and-chart/cloudtak/build.sh --tag)" >> "$GITHUB_OUTPUT"
          echo "postgis=$(./.github/container-and-chart/postgis/build.sh --tag)" >> "$GITHUB_OUTPUT"

  # One native runner per architecture, each pushing <version>-<key>-<arch>
  # and, on main, <version>-<arch>. index joins them under <version>, the
  # tag zarf.yaml references.
  build:
    needs: image-keys
    # Shared by Test and the dedicated image workflow. Recheck the tag only
    # after this key's previous producer has finished. FIFO retains waiters.
    concurrency:
      group: image-cloudtak-${{ needs.image-keys.outputs.cloudtak }}-${{ matrix.arch }}
      queue: max
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      # build.sh fetches only upstream/cloudtak, shallow.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        env:
          PUSHED_REFS: ${{ runner.temp }}/pushed-refs.txt
          PUSH_IMAGES: "true"
          ARCH: ${{ matrix.arch }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
        run: |
          if [ "${FORCE}" = "true" ]; then
            ./.github/container-and-chart/cloudtak/build.sh
          else
            ./.github/container-and-chart/cloudtak/build.sh --if-changed
          fi

      - name: Attest the pushed images
        uses: ./.github/actions/attest-images
        with:
          refs-file: ${{ runner.temp }}/pushed-refs.txt

  index:
    # Shared by Test and the dedicated image workflow. Recheck the tag only
    # after this key's previous producer has finished. FIFO retains waiters.
    concurrency:
      group: image-cloudtak-${{ needs.image-keys.outputs.cloudtak }}-index
      queue: max
      cancel-in-progress: false
    timeout-minutes: 15
    needs: [image-keys, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Write the multi-arch index
        env:
          PUSHED_REFS: ${{ runner.temp }}/pushed-refs.txt
        run: ./.github/container-and-chart/cloudtak/build.sh --merge

      - name: Attest the pushed images
        uses: ./.github/actions/attest-images
        with:
          refs-file: ${{ runner.temp }}/pushed-refs.txt
          include-platforms: "false"
