# One CodeQL language. codeql-extended.yaml calls this for Python, Java/Kotlin,
# and C/C++. It does not run on its own.

name: CodeQL language

on:
  workflow_call:
    inputs:
      language:
        description: CodeQL language identifier
        required: true
        type: string
      build-mode:
        description: CodeQL build mode
        required: true
        type: string
      config:
        description: CodeQL configuration YAML
        required: true
        type: string

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ inputs.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          languages: ${{ inputs.language }}
          build-mode: ${{ inputs.build-mode }}
          config: ${{ inputs.config }}

      - name: Check whether code scanning is enabled
        id: feature
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/code-scanning.json -w "%{http_code}" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/code-scanning/alerts?per_page=1")"
          echo "Code scanning alerts API returned HTTP ${code}"
          if [ "${code}" = "200" ] || [ "${code}" = "404" ]; then
            echo "upload=true" >> "${GITHUB_OUTPUT}"
          else
            echo "upload=false" >> "${GITHUB_OUTPUT}"
            echo "::notice title=CodeQL results kept local::Code scanning is not enabled on this repository, so the analysis is not uploaded. Enable code scanning under Settings, Code security."
          fi

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          category: "/language:${{ inputs.language }}"
          upload: ${{ steps.feature.outputs.upload }}
