name: Container

on:
  workflow_dispatch:
    inputs:
      push:
        description: Push the tags to GHCR
        default: false
        type: boolean
  pull_request:
    paths:
      - .github/container-and-chart/**
      - .github/workflows/container.yaml
      - .github/scripts/merge-image-manifests.sh
      - .gitmodules
      - upstream/takserver
  push:
    branches:
      - takserver-scaffold
      - main
      - develop
    paths:
      - .github/container-and-chart/**
      - .github/workflows/container.yaml
      - .github/scripts/merge-image-manifests.sh
      - .gitmodules
      - upstream/takserver

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

env:
  PUSH_IMAGES: ${{ github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.push) }}
  IMAGE_TAG: 5.7-RELEASE-14
  IMAGE_REPO: ghcr.io/jonathanagustin/uds-k3d-takserver

jobs:
  # One decision for both architectures, so the two builds and the manifest
  # merge always agree on whether this run publishes anything.
  plan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      actions: write
    outputs:
      build: ${{ steps.image.outputs.build }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Log in to GHCR
        if: env.PUSH_IMAGES == 'true'
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A pull request retriggers this workflow for the whole diff. A later
      # commit can cancel a build of an earlier Docker change, so skip only
      # when a successful run already published this Docker tree for both
      # architectures (wait-for-tak-images.sh checks the platforms).
      - name: Decide whether to build
        id: image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHECK_ONCE: "true"
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          git fetch --depth=2 origin "${HEAD_SHA}"
          if ! git diff --quiet "${HEAD_SHA}~1" "${HEAD_SHA}" -- .github/container-and-chart/docker upstream/takserver; then
            echo "build=true" >> "${GITHUB_OUTPUT}"
            echo "Docker inputs changed."
            exit 0
          fi

          # The Docker directory tree plus the pinned TAK source commit.
          inputs() {
            printf '%s %s\n' \
              "$(git rev-parse "$1:.github/container-and-chart/docker")" \
              "$(git rev-parse "$1:upstream/takserver" 2>/dev/null || echo none)"
          }
          tree="$(inputs "${HEAD_SHA}")"
          branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          published_json="$(gh run list \
            --workflow container.yaml \
            --branch "${branch}" \
            --status success \
            --limit 10 \
            --json headSha)"
          mapfile -t published < <(python3 -c 'import json,sys; [print(run["headSha"]) for run in json.load(sys.stdin)]' <<< "${published_json}")

          matched=""
          for sha in "${published[@]}"; do
            if [ -z "${sha}" ]; then
              continue
            fi
            git fetch --depth=1 origin "${sha}" || continue
            if [ "$(inputs "${sha}")" = "${tree}" ]; then
              matched="${sha}"
              break
            fi
          done

          if [ -n "${matched}" ] && ./.github/scripts/wait-for-tak-images.sh; then
            echo "build=false" >> "${GITHUB_OUTPUT}"
            echo "Docker inputs match the images built at ${matched}."
            exit 0
          fi
          echo "build=true" >> "${GITHUB_OUTPUT}"
          echo "No published images match the current Docker inputs."

  # Each architecture compiles on its own native runner. QEMU emulation of
  # the Gradle and Node build is many times slower than a native compile.
  # Each job pushes <tag>-<arch>; the manifest job joins them under <tag>.
  build:
    needs: plan
    permissions:
      contents: read
      packages: write
      actions: write
    if: needs.plan.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    env:
      PLATFORMS: linux/${{ matrix.arch }}
      ARCH_TAG: 5.7-RELEASE-14-${{ matrix.arch }}
      CACHE_SCOPE: takserver-${{ matrix.arch }}
    steps:
      # The TAK source is the upstream/takserver submodule. fetch-depth 1
      # also makes the submodule fetch shallow: one commit, no history.
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true

      - name: Free disk
        run: ./.github/scripts/free-runner-disk.sh
        env:
          PRUNE_DOCKER: "true"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: env.PUSH_IMAGES == 'true'
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read the pinned TAK source commit
        id: src
        run: echo "sha=$(git rev-parse HEAD:upstream/takserver)" >> "${GITHUB_OUTPUT}"

      - name: Restore the Gradle cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .cache/gradle-user-home
          key: gradle-user-home-${{ runner.os }}-${{ runner.arch }}-${{ steps.src.outputs.sha }}

      - name: Build images
        env:
          IMAGE_TAG: ${{ env.ARCH_TAG }}
        run: ./.github/container-and-chart/docker/build.sh

      - name: Scan the local images
        env:
          IMAGE_TAG: ${{ env.ARCH_TAG }}
          GRYPE_IMAGE: anchore/grype:v0.120.1@sha256:e4a44ef45d285b829ce6efe2642980329661bd2d18eab5fc539138d4adaebbbe
        run: ./.github/scripts/scan-local-images.sh

      - name: Generate SBOMs from the local images
        if: env.PUSH_IMAGES == 'true'
        env:
          IMAGE_TAG: ${{ env.ARCH_TAG }}
          SYFT_IMAGE: anchore/syft:v1.54.1@sha256:3eb5379ba7b409c3f4069b686110527af0c47df993fa5c10d13e7cf34f49b1aa
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/sbom
          for name in takserver-api takserver-config takserver-messaging takserver-plugins takserver-database-setup takserver-ignite; do
            docker image inspect "${IMAGE_REPO}/${name}:${IMAGE_TAG}" >/dev/null
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "${PWD}/build/sbom:/out" \
              "${SYFT_IMAGE}" \
              "docker:${IMAGE_REPO}/${name}:${IMAGE_TAG}" \
              -o "spdx-json=/out/${name}.spdx.json"
          done

      - name: Upload SBOMs
        if: env.PUSH_IMAGES == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: takserver-sbom-${{ matrix.arch }}
          path: build/sbom/**
          if-no-files-found: error

  # Join the two per-architecture tags into one multi-arch index under the
  # tag that zarf.yaml and the chart values reference.
  manifest:
    needs: [plan, build]
    permissions:
      contents: read
      packages: write
      actions: write
    if: needs.plan.outputs.build == 'true' && (github.event_name != 'workflow_dispatch' || inputs.push)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the multi-arch manifests
        env:
          ARCHES: amd64 arm64
        run: ./.github/scripts/merge-image-manifests.sh
