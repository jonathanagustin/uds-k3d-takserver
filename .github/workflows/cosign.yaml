# @lulaStart 16058a8d-cbfb-5553-b1aa-6b2ab45ebe17
name: Cosign

# Optional hardening. Keyless signing stays off unless someone starts this
# workflow and sets sign to true. It is not part of release or pull requests.
on:
  workflow_dispatch:
    inputs:
      sign:
        description: Sign the published TAK images with keyless Cosign
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  sign:
    timeout-minutes: 30
    if: ${{ inputs.sign }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          # renovate: datasource=github-releases depName=sigstore/cosign versioning=semver
          cosign-release: v3.1.4

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign images
        shell: bash
        run: |
          set -euo pipefail
          tag="5.7-RELEASE-14"
          repo="ghcr.io/jonathanagustin/uds-takserver"
          for name in takserver-api takserver-messaging takserver-config takserver-plugins takserver-database-setup takserver-ignite; do
            # --recursive also signs each per-architecture manifest in the index.
            cosign sign --yes --recursive "${repo}/${name}:${tag}"
          done
          cosign sign --yes --recursive "${repo}/postgis:18-3.6"
# @lulaEnd 16058a8d-cbfb-5553-b1aa-6b2ab45ebe17
