name: Cosign

# Optional hardening. Keyless signing stays off unless someone starts this
# workflow and sets sign to true. It is not part of release or pull requests.
on:
  workflow_dispatch:
    inputs:
      sign:
        description: Sign the published TAK images with keyless Cosign
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  sign:
    if: ${{ inputs.sign }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # renovate: datasource=github-releases depName=sigstore/cosign versioning=semver
          cosign-release: v3.1.3

      - name: Log in to GHCR
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign images
        shell: bash
        run: |
          set -euo pipefail
          tag="5.7-RELEASE-14"
          repo="ghcr.io/jonathanagustin/uds-k3d-takserver"
          for name in takserver-api takserver-messaging takserver-config takserver-plugins takserver-database-setup takserver-ignite; do
            # --recursive also signs each per-architecture manifest in the index.
            cosign sign --yes --recursive "${repo}/${name}:${tag}"
          done
          cosign sign --yes --recursive "${repo}/postgis:15-3.4"
