# Deploys the bundle on k3d, then records a short demo video: terminal
# chapters with VHS, the Keycloak SSO and TAK web UI walkthrough in a real
# Chrome window (Playwright on an Xvfb display, captured with x11grab),
# joined with ffmpeg. The MP4 is uploaded as the demo-video
# artifact.
name: Demo Video

on:
  workflow_dispatch:
    inputs:
      app_ref:
        description: Branch or SHA to deploy. The demo scripts always come from the workflow's own commit.
        required: false
        default: ""
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/demo.yaml"
      - "demo/**"
      - "tests/demo/**"
      - "tests/playwright.demo.config.ts"

permissions:
  contents: read

concurrency:
  group: demo-${{ github.ref }}
  cancel-in-progress: true

env:
  VHS_VERSION: 0.12.1
  VHS_SHA256: eb33787a5b1cebf91fe0b18bd231e2d71d36c1ff4babd99ddac1a6ab411efd10

jobs:
  record:
    runs-on: ${{ vars.TEST_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
    env:
      APP_REF: ${{ inputs.app_ref }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Lets the demo record a branch that is not on main yet. Everything
      # outside the demo files comes from APP_REF.
      - name: Use the requested app ref
        if: env.APP_REF != ''
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "${APP_REF}"
          git checkout FETCH_HEAD -- . \
            ':!demo' ':!tests/demo' ':!tests/playwright.demo.config.ts' \
            ':!tasks.yaml' ':!.gitignore' ':!.github/workflows/demo.yaml'
          echo "Deploying $(git rev-parse --short FETCH_HEAD) from ${APP_REF}"

      - name: Install Docker Compose
        uses: docker/setup-compose-action@54042514f505b273907334ae2b9cdbb9a0213c1a # v2.4.0
        with:
          version: v5.6.0

      - name: Install UDS CLI
        uses: defenseunicorns/setup-uds@d6add59d4c2ca789ed7c92741e91bd340b4e950b # v1.0.2
        with:
          version: v0.39.0

      - name: Trim the runner
        if: vars.TEST_RUNNER == '' || vars.TEST_RUNNER == 'ubuntu-latest'
        run: ./.github/scripts/trim-runner.sh

      - name: Restore the slim core package
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .cache/k3d-core-slim-dev
          key: k3d-core-slim-dev-1.15.0-${{ runner.os }}-${{ runner.arch }}

      - name: Restore the Zarf cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .cache/zarf-cache
          key: zarf-cache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('zarf.yaml', 'common/zarf.yaml', 'values/**/*.yaml', 'bundle/**/*.yaml') }}
          restore-keys: |
            zarf-cache-${{ runner.os }}-${{ runner.arch }}-

      - name: Point Zarf at the restored cache
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/.cache/zarf-cache"
          rm -rf "${HOME}/.zarf-cache"
          ln -s "${GITHUB_WORKSPACE}/.cache/zarf-cache" "${HOME}/.zarf-cache"

      - name: Environment setup
        run: |
          echo "MARU_AUTH=\"{\"raw.githubusercontent.com\": \"${{ secrets.GITHUB_TOKEN }}\"}\"" >> "$GITHUB_ENV"
          uds run actions:setup-environment \
          --set REGISTRY1_USERNAME="${{ secrets.IRON_BANK_ROBOT_USERNAME }}" \
          --set REGISTRY1_PASSWORD="${{ secrets.IRON_BANK_ROBOT_PASSWORD }}" \
          --set GH_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
          --set RAPIDFORT_USERNAME="${{ secrets.RAPIDFORT_USERNAME }}" \
          --set RAPIDFORT_PASSWORD="${{ secrets.RAPIDFORT_PASSWORD }}" \
          --set CHAINGUARD_IDENTITY="${{ secrets.CHAINGUARD_IDENTITY }}"
        shell: bash

      - name: Deploy UDS Core and TAK
        run: |
          set -o pipefail
          uds run demo-deploy --set FLAVOR=upstream --no-progress 2>&1 | tee /tmp/demo-deploy.log
        shell: bash
        timeout-minutes: 90

      - name: Install recording tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg ttyd fonts-jetbrains-mono fonts-dejavu-core \
            xvfb libnss3-tools
          google-chrome --version
          # Chrome keeps its sandbox on (no unsupported-flag bar). Ubuntu 24.04
          # blocks the unprivileged user namespaces that sandbox uses.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          tarball="vhs_${VHS_VERSION}_Linux_x86_64.tar.gz"
          curl -fsSL -o "/tmp/${tarball}" "https://github.com/charmbracelet/vhs/releases/download/v${VHS_VERSION}/${tarball}"
          echo "${VHS_SHA256}  /tmp/${tarball}" | sha256sum -c -
          tar -xzf "/tmp/${tarball}" -C /tmp
          sudo install -m 0755 "/tmp/vhs_${VHS_VERSION}_Linux_x86_64/vhs" /usr/local/bin/vhs
          vhs --version
        shell: bash

      - name: Record the terminal chapters
        run: ./demo/record-terminal.sh
        shell: bash

      - name: Record the web walkthrough
        run: ./demo/record-web.sh
        shell: bash

      - name: Build demo.mp4
        run: ./demo/assemble.sh
        shell: bash

      - name: Upload the demo video
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-video
          path: |
            demo/out/demo.mp4
            demo/out/poster.png
            demo/out/preview.gif
          if-no-files-found: error
          retention-days: 30

      - name: Upload the separate segments
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-segments
          path: |
            demo/out/0*.mp4
            demo/out/06-web.mp4
            demo/out/06-web-events.json
            demo/out/browser-06-web/screen.mkv
            demo/out/browser-06-web/ffmpeg.log
            tests/.playwright/demo/**/*.png
            /tmp/demo-deploy.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Debug Output
        if: failure()
        run: uds run actions:debug-output
        shell: bash
