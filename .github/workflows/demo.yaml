# PRs run short recorder/media checks. Manual runs deploy the bundle on k3d
# and record a demo video: terminal
# chapters with VHS, the Keycloak SSO and TAK web UI walkthrough in a real
# Chrome window (Playwright on an Xvfb display, captured with x11grab),
# joined with ffmpeg. The MP4 is uploaded as the demo-video
# artifact, with one short clip per chapter for the doc pages and the stills
# the docs use. A manual main recording signs an artifact-only candidate.
# A separate explicit dispatch publishes that exact candidate immutably. demo/sync-assets.py then copies a
# run's posters, stills and chapter times into the docs.
name: Demo Video

on:
  workflow_dispatch:
    inputs:
      app_ref:
        description: Branch or SHA to deploy. The demo scripts always come from the workflow's own commit.
        required: false
        default: ""
      atak:
        description: Also deploy the ATAK test device (KVM, amd64) and record its chapter.
        type: boolean
        required: false
        default: false
      upgrade:
        description: Record the upgrade chapter last (demo/upgrade.sh, a new cluster, about 40 minutes).
        type: boolean
        required: false
        default: true
      sign_only:
        description: Retired unsafe mode; true is rejected without touching historical assets.
        type: boolean
        required: false
        default: false
      publish_run_id:
        description: Publish an existing signed candidate from this completed main Demo run; never record again.
        required: false
        default: ""
      publish_attempt:
        description: Signing attempt of that candidate (capture attempt remains separately recorded).
        required: false
        default: ""
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/demo.yaml"
      - "demo/**"
      # Editing recorded footage or its instructions does not need a cluster.
      - "!demo/ui-reel/**"
      - "!demo/README.md"
      - "tests/demo/**"
      - "tests/playwright.demo.config.ts"

permissions:
  contents: read

concurrency:
  group: demo-${{ github.ref }}
  cancel-in-progress: true

env:
  VHS_VERSION: 0.12.1
  TTYD_VERSION: 1.7.7
  TTYD_SHA256: 8a217c968aba172e0dbf3f34447218dc015bc4d5e59bf51db2f2cd12b7be4f55
  AGG_VERSION: 1.9.0
  AGG_SHA256: ddcbf6ca044c8ac3a434dcb9ee89fb9e3be87209982b7c2adb55f782e8f0f390
  # Inter for titles and captions (demo/style.py), from the upstream release.
  INTER_VERSION: "4.1"
  INTER_SHA256: 9883fdd4a49d4fb66bd8177ba6625ef9a64aa45899767dde3d36aa425756b11e
  VHS_SHA256: eb33787a5b1cebf91fe0b18bd231e2d71d36c1ff4babd99ddac1a6ab411efd10

jobs:
  mode:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - name: Checkout trusted publication policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate recording or publication mode
        id: mode
        env:
          PUBLISH_RUN_ID: ${{ inputs.publish_run_id }}
          PUBLISH_ATTEMPT: ${{ inputs.publish_attempt }}
          LEGACY_SIGN_ONLY: ${{ inputs.sign_only && 'true' || 'false' }}
        run: python3 demo/publication.py mode

  record:
    needs: mode
    if: github.event_name == 'workflow_dispatch' && needs.mode.outputs.mode == 'record'
    outputs:
      capture-attempt: ${{ steps.capture.outputs.capture-attempt }}
    # Match Test's temporary hosted-kernel mitigation (#300); explicit overrides remain available.
    runs-on: ${{ vars.TEST_RUNNER || 'ubuntu-22.04' }}
    timeout-minutes: 240
    permissions:
      actions: read
      attestations: read
      contents: read
      packages: read
    env:
      APP_REF: ${{ inputs.app_ref }}
      ATAK: ${{ inputs.atak && 'true' || 'false' }}
      # Keep the optional second cluster out of automatic PR recordings.
      UPGRADE: ${{ github.event_name == 'workflow_dispatch' && inputs.upgrade && 'true' || 'false' }}
      CACHE: ghcr.io/jonathanagustin/uds-takserver/build-cache
      ATAK_TAG: dev
      DRIVER_IMAGE: ghcr.io/jonathanagustin/uds-takserver/atak-driver:dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # APP_REF moves HEAD so immutable image keys describe the selected app.
      # Only the existing recorder/task paths are restored from this workflow.
      - name: Select the application source
        id: app-source
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: ./.github/scripts/select-demo-app-ref.sh

      - name: Trim the runner
        if: vars.TEST_RUNNER == '' || vars.TEST_RUNNER == 'ubuntu-22.04' || vars.TEST_RUNNER == 'ubuntu-24.04'
        run: ./.github/scripts/trim-runner.sh

      # Same steps as the ATAK e2e workflow: the registry build cache keeps
      # the APK build warm.
      - name: Check out the ATAK submodule and its LFS files
        if: env.ATAK == 'true'
        run: ./atak/ci/fetch-source.sh

      - name: Let the runner use KVM
        if: env.ATAK == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Set up Docker Buildx
        if: env.ATAK == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: env.ATAK == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the ATAK device images
        if: env.ATAK == 'true'
        timeout-minutes: 120
        run: |
          set -euo pipefail
          # Pulls the images the ATAK e2e workflow published for these inputs
          # (atak/ci/device-images.sh) and builds only the ones it has not.
          ./atak/ci/device-images.sh build
          docker buildx rm --all-inactive --force || true
          docker buildx prune -af || true
          docker ps -a --filter name=buildx_buildkit -q | xargs -r docker rm -f
          df -h /

      - name: Install recording tools
        # Before the deploy, while the runner is idle: after it, apt has
        # hung here twice.
        timeout-minutes: 30
        run: |
          set -euo pipefail
          sudo python3 .github/scripts/ci-apt.py update
          sudo python3 .github/scripts/ci-apt.py install ffmpeg fonts-jetbrains-mono fonts-dejavu-core \
            xvfb libnss3-tools python3-pil python3-venv
          curl -fsSL -o /tmp/inter.zip "https://github.com/rsms/inter/releases/download/v${INTER_VERSION}/Inter-${INTER_VERSION}.zip"
          echo "${INTER_SHA256}  /tmp/inter.zip" | sha256sum -c -
          sudo mkdir -p /usr/local/share/fonts/inter
          sudo unzip -o -j -q /tmp/inter.zip 'extras/ttf/Inter-SemiBold.ttf' 'extras/ttf/Inter-Medium.ttf' -d /usr/local/share/fonts/inter
          sudo fc-cache -f
          python3 demo/style.py fonts
          # The recording browser: no bookmark star or bookmarks bar, no
          # sign-in, and a toolbar in the demo's background colour.
          sudo install -D -m 0644 demo/chrome-policy.json /etc/opt/chrome/policies/managed/demo.json
          google-chrome --version
          # Chrome keeps its sandbox on (no unsupported-flag bar). Ubuntu 24.04
          # blocks the unprivileged user namespaces that sandbox uses.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          tarball="vhs_${VHS_VERSION}_Linux_x86_64.tar.gz"
          curl -fsSL -o "/tmp/${tarball}" "https://github.com/charmbracelet/vhs/releases/download/v${VHS_VERSION}/${tarball}"
          echo "${VHS_SHA256}  /tmp/${tarball}" | sha256sum -c -
          tar -xzf "/tmp/${tarball}" -C /tmp
          sudo install -m 0755 "/tmp/vhs_${VHS_VERSION}_Linux_x86_64/vhs" /usr/local/bin/vhs
          vhs --version
          # Ubuntu 22.04 ships ttyd 1.6.3; VHS 0.12.1 requires at least 1.7.2.
          curl --fail --silent --show-error --location --max-time 30 --max-filesize 1400000 \
            -o "${RUNNER_TEMP}/ttyd" "https://github.com/tsl0922/ttyd/releases/download/${TTYD_VERSION}/ttyd.x86_64"
          echo "${TTYD_SHA256}  ${RUNNER_TEMP}/ttyd" | sha256sum -c -
          sudo install -m 0755 "${RUNNER_TEMP}/ttyd" /usr/local/bin/ttyd
          ttyd --version
        shell: bash

      - name: Install Docker Compose
        uses: docker/setup-compose-action@54042514f505b273907334ae2b9cdbb9a0213c1a # v2.4.0
        with:
          version: v5.7.0

      - name: Install UDS CLI
        uses: defenseunicorns/setup-uds@d6add59d4c2ca789ed7c92741e91bd340b4e950b # v1.0.2
        with:
          # renovate: datasource=github-tags depName=defenseunicorns/uds-cli versioning=semver
          version: v0.41.0

      - name: Environment setup
        run: |
          echo "MARU_AUTH=\"{\"raw.githubusercontent.com\": \"${{ secrets.GITHUB_TOKEN }}\"}\"" >> "$GITHUB_ENV"
          uds run actions:setup-environment \
          --set REGISTRY1_USERNAME="${{ secrets.IRON_BANK_ROBOT_USERNAME }}" \
          --set REGISTRY1_PASSWORD="${{ secrets.IRON_BANK_ROBOT_PASSWORD }}" \
          --set GH_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
          --set RAPIDFORT_USERNAME="${{ secrets.RAPIDFORT_USERNAME }}" \
          --set RAPIDFORT_PASSWORD="${{ secrets.RAPIDFORT_PASSWORD }}" \
          --set CHAINGUARD_IDENTITY="${{ secrets.CHAINGUARD_IDENTITY }}"
        shell: bash

      # PR producers publish immutable keyed tags, not the main-only plain tags.
      - name: Wait for the six TAK images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_IF_MISSING: "false"
          EXPECTED_SHA: ${{ steps.app-source.outputs.expected-sha }}
        run: ./.github/scripts/wait-for-tak-images.sh

      - name: Wait for the CloudTAK image
        run: ./.github/container-and-chart/cloudtak/build.sh --wait

      - name: Wait for the PostGIS image
        run: ./.github/container-and-chart/postgis/build.sh --wait

      - name: Use the selected source's keyed application images
        run: ./.github/scripts/pin-image-tags.sh

      # The video shows the release it was recorded for: the Zarf package and
      # the bundle get the Release Please version, as release.yaml stamps
      # zarf.yaml before it publishes. Without this they are "dev".
      - name: Stamp the release version
        run: |
          set -euo pipefail
          DEMO_VERSION="$(jq -r '."."' .release-please-manifest.json)"
          export DEMO_VERSION
          echo "DEMO_VERSION=${DEMO_VERSION}" >> "${GITHUB_ENV}"
          uds zarf tools yq -i '.metadata.version = strenv(DEMO_VERSION)' zarf.yaml
          uds zarf tools yq -i '
            .metadata.name = "takserver" |
            .metadata.version = strenv(DEMO_VERSION) |
            (.packages[] | select(.name == "takserver") | .ref) = strenv(DEMO_VERSION)
          ' bundle/uds-bundle.yaml
          echo "Recording v${DEMO_VERSION}"
        shell: bash

      # The deployment is recorded as the video's opening chapter: the same
      # commands as `uds run demo-deploy`, printed as they run, captured with
      # asciinema and rendered later by demo/render-cast.py.
      - name: Install and check the pinned terminal recorder
        timeout-minutes: 3
        run: |
          set -euo pipefail
          python3 -m venv "${RUNNER_TEMP}/asciinema"
          "${RUNNER_TEMP}/asciinema/bin/python" -m pip --isolated install \
            --disable-pip-version-check --no-deps --only-binary=:all: --require-hashes \
            --timeout 30 --retries 2 -r demo/tools/asciinema-requirements.txt
          python3 demo/tools/check-asciinema.py \
            --recorder "${RUNNER_TEMP}/asciinema/bin/asciinema" \
            --output "${RUNNER_TEMP}/asciinema-cli-check"
          # Export only the recorder; keep media Python and its system Pillow.
          mkdir -p "${RUNNER_TEMP}/recorder-bin"
          ln -s "${RUNNER_TEMP}/asciinema/bin/asciinema" "${RUNNER_TEMP}/recorder-bin/asciinema"
          echo "${RUNNER_TEMP}/recorder-bin" >> "${GITHUB_PATH}"
        shell: bash

      - name: Check the pinned media pipeline before deployment
        timeout-minutes: 3
        run: |
          set -euo pipefail
          # The GNU 1.9.0 binary needs GLIBC_2.38; the static MUSL build supports Ubuntu 22.
          curl --fail --silent --show-error --location --max-time 30 --max-filesize 17000000 \
            -o "${RUNNER_TEMP}/agg" "https://github.com/asciinema/agg/releases/download/v${AGG_VERSION}/agg-x86_64-unknown-linux-musl"
          echo "${AGG_SHA256}  ${RUNNER_TEMP}/agg" | sha256sum -c -
          sudo install -m 0755 "${RUNNER_TEMP}/agg" /usr/local/bin/agg
          python3 demo/tools/check-media.py --output "${RUNNER_TEMP}/demo-media-check"
        shell: bash

      - name: Deploy UDS Core and TAK
        run: |
          set -euo pipefail
          mkdir -p demo/out
          TERM=xterm-256color FLAVOR=upstream asciinema rec --overwrite -q --cols 132 --rows 34 \
            -c './demo/deploy.sh; echo $? > demo/out/00-deploy.exit' demo/out/00-deploy.cast < /dev/null
          python3 -c 'import json,sys; [sys.stdout.write(json.loads(l)[2]) for l in open(sys.argv[1]).readlines()[1:] if l.strip()]' \
            demo/out/00-deploy.cast | tee /tmp/demo-deploy.log | tail -n 200
          test "$(cat demo/out/00-deploy.exit)" = 0
          uds run demo-setup --no-progress
        shell: bash
        timeout-minutes: 90

      - name: Render the recorded deployment
        run: |
          set -euo pipefail
          # Long steps are sped up, then each holds on its last lines for
          # CAST_HOLD seconds so the result can be read.
          CAST_HOLD=5 python3 demo/render-cast.py demo/out/00-deploy.cast demo/out/00-deploy \
            "1. UDS Core (slim) on a new k3d cluster::10" \
            "2. Build the Zarf package: upstream chart, images by full name::10" \
            "3. Bundle the package with UDS Core::7" \
            "4. Deploy the bundle: UDS Core, then TAK Server::14"
        shell: bash

      - name: Record the terminal chapters
        run: ./demo/record-terminal.sh
        env:
          # gh attestation verify in the "Secure by default" chapter.
          GH_TOKEN: ${{ github.token }}
        shell: bash

      - name: Record the web walkthrough
        run: ./demo/record-web.sh
        shell: bash

      # Only when the CloudTAK chart lets /CloudTAK/Users sign in. A failed
      # take is left out of the video rather than failing the run.
      - name: Record CloudTAK for a regular user
        run: |
          if ! grep -q '/CloudTAK/Users' charts/cloudtak/values.yaml; then
            echo "This ref has no /CloudTAK/Users group; the chapter is left out"
            exit 0
          fi
          if ! DEMO_KEYCLOAK_USER=mapdemo DEMO_KEYCLOAK_GROUPS="/CloudTAK/Users,/TAK/Operators_READ" \
            ./demo/record-web.sh 07-user cloudtak-user.demo.ts "map.uds.dev sso.uds.dev takserver.uds.dev"; then
            rm -f demo/out/07-user.mp4
            echo "::warning::The CloudTAK regular user chapter failed and is left out"
          fi
        shell: bash

      - name: Deploy and connect the ATAK device
        if: env.ATAK == 'true'
        run: |
          set -euo pipefail
          # Playwright from atak/ci/package-lock.json.
          npm ci --prefix atak/ci --no-audit --no-fund >/dev/null
          NODE_PATH="${PWD}/atak/ci/node_modules" OUT=demo/out/atak ./atak/ci/e2e.sh
        shell: bash
        timeout-minutes: 90

      # The phone is also recorded on the device itself (screenrecord), and
      # demo/filters.py lays that over the browser's view of it, which only
      # updates a few times a second. Without a device recording the browser
      # view is used.
      - name: Record the ATAK walkthrough
        if: env.ATAK == 'true'
        run: |
          set -euo pipefail
          ./demo/atak-adb.sh start
          ./demo/atak-adb.sh prep
          ./demo/atak-adb.sh record-start 08-atak
          status=0
          ./demo/record-web.sh 08-atak atak.demo.ts "atak.uds.dev map.uds.dev sso.uds.dev" || status=$?
          ./demo/atak-adb.sh record-stop 08-atak || true
          exit "${status}"
        shell: bash

      - name: Record CloudTAK and ATAK in sync
        if: env.ATAK == 'true'
        # A failed take is left out of the video rather than failing the run.
        run: |
          if ./demo/atak-adb.sh start; then
            ./demo/atak-adb.sh record-start 09-sync || true
          fi
          if ! DEMO_DEVICE_RECORDING=1 ./demo/record-web.sh 09-sync atak-sync.demo.ts "atak.uds.dev map.uds.dev sso.uds.dev takserver.uds.dev"; then
            rm -f demo/out/09-sync.mp4
            echo "::warning::The CloudTAK and ATAK sync chapter failed and is left out"
          fi
          ./demo/atak-adb.sh record-stop 09-sync || true
          ./demo/atak-adb.sh stop || true
        shell: bash

      # Footprint and self-healing, recorded like the deployment and rendered
      # with the same speed-up and real elapsed times.
      - name: Record footprint and self-healing
        if: env.ATAK == 'true'
        run: |
          set -euo pipefail
          TERM=xterm-256color asciinema rec --overwrite -q --cols 132 --rows 34 \
            -c './demo/after-atak.sh; echo $? > demo/out/10-operate.exit' demo/out/10-operate.cast < /dev/null
          python3 -c 'import json,sys; [sys.stdout.write(json.loads(l)[2]) for l in open(sys.argv[1]).readlines()[1:] if l.strip()]' \
            demo/out/10-operate.cast | tail -n 80
          if [[ "$(cat demo/out/10-operate.exit)" != 0 ]]; then
            echo "::warning::The footprint and self-healing chapter failed and is left out"
            exit 0
          fi
          CAST_FONT_SIZE=26 CAST_COLS=104 CAST_ROWS=16 CAST_HOLD=4.5 \
            python3 demo/render-cast.py demo/out/10-operate.cast demo/out/10-operate \
            "Live CPU and memory of TAK's pods::6" \
            "The ATAK test device, connected with its own client certificate::4" \
            "Delete TAK's messaging pod: Kubernetes brings it back::8" \
            "ATAK reconnects by itself::6"
        shell: bash

      # Last, because it replaces the demo cluster with a new one: the
      # previous release, then an upgrade to this run's bundle. A failed take
      # is left out of the video rather than failing the run.
      - name: Record the upgrade from the last signed release
        if: env.UPGRADE == 'true'
        timeout-minutes: 75
        run: |
          set -uo pipefail
          if ! ./demo/upgrade.sh prepare > /tmp/demo-upgrade-prepare.log 2>&1; then
            tail -n 120 /tmp/demo-upgrade-prepare.log
            echo "::warning::The upgrade chapter could not be prepared and is left out"
            exit 0
          fi
          tail -n 20 /tmp/demo-upgrade-prepare.log
          TERM=xterm-256color asciinema rec --overwrite -q --cols 132 --rows 34 \
            -c './demo/upgrade.sh record; echo $? > demo/out/11-upgrade.exit' demo/out/11-upgrade.cast < /dev/null
          python3 -c 'import json,sys; [sys.stdout.write(json.loads(l)[2]) for l in open(sys.argv[1]).readlines()[1:] if l.strip()]' \
            demo/out/11-upgrade.cast | tail -n 120
          if [[ "$(cat demo/out/11-upgrade.exit)" != 0 ]]; then
            echo "::warning::The upgrade chapter failed and is left out"
            exit 0
          fi
          CAST_FONT_SIZE=26 CAST_COLS=120 CAST_ROWS=24 CAST_HOLD=5 \
            python3 demo/render-cast.py demo/out/11-upgrade.cast demo/out/11-upgrade \
            "The last release's package verifies against its signature::5" \
            "Deploy the last signed release::10" \
            "Before: TAK's CA, keystore, a database row and its volume::6" \
            "Upgrade in place to this release::12" \
            "After: the same CA, keystore, row and volume::7"
        shell: bash

      - name: Build demo.mp4
        run: ./demo/assemble.sh
        shell: bash

      - name: Bind the actual capture source and attempt
        id: capture
        env:
          CAPTURE_APP_SHA: ${{ steps.app-source.outputs.expected-sha }}
        run: |
          python3 demo/publication.py capture --directory demo/out --app-source "${CAPTURE_APP_SHA}"
          echo "capture-attempt=${GITHUB_RUN_ATTEMPT}" >> "${GITHUB_OUTPUT}"

      - name: Upload the demo video
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-video-attempt-${{ github.run_attempt }}
          path: |
            demo/out/capture.json
            demo/out/demo.mp4
            demo/out/demo-operate.mp4
            demo/out/*-chapters.txt
            demo/out/poster.png
            demo/out/preview.gif
            demo/out/demo-deploy.jpg
            demo/out/demo-operate-and-trust.jpg
            demo/out/clips/demo-clip-deploy.mp4
            demo/out/clips/demo-clip-deploy.jpg
            demo/out/clips/demo-clip-package-ready.mp4
            demo/out/clips/demo-clip-package-ready.jpg
            demo/out/clips/demo-clip-sso.mp4
            demo/out/clips/demo-clip-sso.jpg
            demo/out/clips/demo-clip-cloudtak-user.mp4
            demo/out/clips/demo-clip-cloudtak-user.jpg
            demo/out/clips/demo-clip-atak-device.mp4
            demo/out/clips/demo-clip-atak-device.jpg
            demo/out/clips/demo-clip-airgap.mp4
            demo/out/clips/demo-clip-airgap.jpg
            demo/out/clips/demo-clip-policy.mp4
            demo/out/clips/demo-clip-policy.jpg
            demo/out/clips/demo-clip-sync.mp4
            demo/out/clips/demo-clip-sync.jpg
            demo/out/clips/demo-clip-secure.mp4
            demo/out/clips/demo-clip-secure.jpg
            demo/out/clips/demo-clip-upgrade.mp4
            demo/out/clips/demo-clip-upgrade.jpg
            demo/out/clips/demo-clip-self-healing.mp4
            demo/out/clips/demo-clip-self-healing.jpg
            demo/out/shots/*.webp
          if-no-files-found: error
          retention-days: 30

      - name: Capture failed TAK startup diagnostics
        id: startup-diagnostics
        if: failure() && !cancelled()
        timeout-minutes: 5
        run: ./.github/scripts/demo-failure-diagnostics.sh "${RUNNER_TEMP}/demo-failure-sanitized"
        shell: bash

      - name: Retain sanitized startup diagnostics
        timeout-minutes: 3
        if: failure() && !cancelled() && steps.startup-diagnostics.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-startup-diagnostics
          path: ${{ runner.temp }}/demo-failure-sanitized/tak-startup.log
          if-no-files-found: error
          retention-days: 7

      - name: Upload the separate segments
        timeout-minutes: 10
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-segments
          path: |
            demo/out/0*.mp4
            demo/out/0*-events.json
            demo/out/10-operate-*
            demo/out/tapes/*.tape
            demo/out/06-web.mp4
            demo/out/06-web-events.json
            demo/out/browser-06-web/screen.mkv
            demo/out/browser-06-web/ffmpeg.log
            demo/out/08-atak-events.json
            demo/out/09-sync-events.json
            demo/out/browser-09-sync/screen.mkv
            demo/out/*.cast
            demo/out/browser-08-atak/screen.mkv
            demo/out/browser-08-atak/ffmpeg.log
            demo/out/07-user-events.json
            demo/out/11-upgrade*
            demo/out/shots/*.png
            /tmp/demo-upgrade-prepare.log
            demo/out/atak/*.png
            demo/out/atak/*.txt
            demo/out/atak/*-device.*
            tests/.playwright/demo/**/*.png
            /tmp/demo-deploy.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Debug Output
        if: failure() && !cancelled()
        run: |
          if command -v uds >/dev/null 2>&1; then
            uds run actions:debug-output
          else
            echo "UDS CLI setup was not reached; package-acquisition diagnostics identify the earlier failure"
          fi
        shell: bash

  # PRs check the actual recorder/media tools without deploying or publishing.
  preflight:
    if: github.event_name == 'pull_request'
    runs-on: ${{ vars.TEST_RUNNER || 'ubuntu-22.04' }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install recording tools
        # Before the deploy, while the runner is idle: after it, apt has
        # hung here twice.
        timeout-minutes: 30
        run: |
          set -euo pipefail
          sudo python3 .github/scripts/ci-apt.py update
          sudo python3 .github/scripts/ci-apt.py install ffmpeg fonts-jetbrains-mono fonts-dejavu-core \
            xvfb libnss3-tools python3-pil python3-venv
          curl -fsSL -o /tmp/inter.zip "https://github.com/rsms/inter/releases/download/v${INTER_VERSION}/Inter-${INTER_VERSION}.zip"
          echo "${INTER_SHA256}  /tmp/inter.zip" | sha256sum -c -
          sudo mkdir -p /usr/local/share/fonts/inter
          sudo unzip -o -j -q /tmp/inter.zip 'extras/ttf/Inter-SemiBold.ttf' 'extras/ttf/Inter-Medium.ttf' -d /usr/local/share/fonts/inter
          sudo fc-cache -f
          python3 demo/style.py fonts
          # The recording browser: no bookmark star or bookmarks bar, no
          # sign-in, and a toolbar in the demo's background colour.
          sudo install -D -m 0644 demo/chrome-policy.json /etc/opt/chrome/policies/managed/demo.json
          google-chrome --version
          # Chrome keeps its sandbox on (no unsupported-flag bar). Ubuntu 24.04
          # blocks the unprivileged user namespaces that sandbox uses.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          tarball="vhs_${VHS_VERSION}_Linux_x86_64.tar.gz"
          curl -fsSL -o "/tmp/${tarball}" "https://github.com/charmbracelet/vhs/releases/download/v${VHS_VERSION}/${tarball}"
          echo "${VHS_SHA256}  /tmp/${tarball}" | sha256sum -c -
          tar -xzf "/tmp/${tarball}" -C /tmp
          sudo install -m 0755 "/tmp/vhs_${VHS_VERSION}_Linux_x86_64/vhs" /usr/local/bin/vhs
          vhs --version
          # Ubuntu 22.04 ships ttyd 1.6.3; VHS 0.12.1 requires at least 1.7.2.
          curl --fail --silent --show-error --location --max-time 30 --max-filesize 1400000 \
            -o "${RUNNER_TEMP}/ttyd" "https://github.com/tsl0922/ttyd/releases/download/${TTYD_VERSION}/ttyd.x86_64"
          echo "${TTYD_SHA256}  ${RUNNER_TEMP}/ttyd" | sha256sum -c -
          sudo install -m 0755 "${RUNNER_TEMP}/ttyd" /usr/local/bin/ttyd
          ttyd --version
        shell: bash

      - name: Install and check the pinned terminal recorder
        timeout-minutes: 3
        run: |
          set -euo pipefail
          python3 -m venv "${RUNNER_TEMP}/asciinema"
          "${RUNNER_TEMP}/asciinema/bin/python" -m pip --isolated install \
            --disable-pip-version-check --no-deps --only-binary=:all: --require-hashes \
            --timeout 30 --retries 2 -r demo/tools/asciinema-requirements.txt
          python3 demo/tools/check-asciinema.py \
            --recorder "${RUNNER_TEMP}/asciinema/bin/asciinema" \
            --output "${RUNNER_TEMP}/asciinema-cli-check"
          # Export only the recorder; keep media Python and its system Pillow.
          mkdir -p "${RUNNER_TEMP}/recorder-bin"
          ln -s "${RUNNER_TEMP}/asciinema/bin/asciinema" "${RUNNER_TEMP}/recorder-bin/asciinema"
          echo "${RUNNER_TEMP}/recorder-bin" >> "${GITHUB_PATH}"
        shell: bash

      - name: Check the pinned media pipeline before deployment
        timeout-minutes: 3
        run: |
          set -euo pipefail
          # The GNU 1.9.0 binary needs GLIBC_2.38; the static MUSL build supports Ubuntu 22.
          curl --fail --silent --show-error --location --max-time 30 --max-filesize 17000000 \
            -o "${RUNNER_TEMP}/agg" "https://github.com/asciinema/agg/releases/download/v${AGG_VERSION}/agg-x86_64-unknown-linux-musl"
          echo "${AGG_SHA256}  ${RUNNER_TEMP}/agg" | sha256sum -c -
          sudo install -m 0755 "${RUNNER_TEMP}/agg" /usr/local/bin/agg
          python3 demo/tools/check-media.py --output "${RUNNER_TEMP}/demo-media-check"
        shell: bash


  # Main-only signing writes a candidate artifact, never a release or historical asset.
  sign:
    needs: [mode, record]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && needs.mode.outputs.mode == 'record'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout trusted publication policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the verified publication GitHub CLI
        env:
          GH_VERSION: 2.103.3
          GH_ARCHIVE_SHA256: 4c806978ffce1cec70853302a56d70ac6da4f19bae7adca4e1a8ab00633dd91d
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}"
          archive="gh_${GH_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --max-time 120 \
            "https://github.com/cli/cli/releases/download/v${GH_VERSION}/${archive}" -o "${archive}"
          echo "${GH_ARCHIVE_SHA256}  ${archive}" | sha256sum --check --status
          tar -xzf "${archive}"
          echo "${RUNNER_TEMP}/gh_${GH_VERSION}_linux_amd64/bin" >> "${GITHUB_PATH}"
      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          # renovate: datasource=github-releases depName=sigstore/cosign versioning=semver
          cosign-release: v3.1.4
      - name: Validate and stage the existing capture
        env:
          CAPTURE_ATTEMPT: ${{ needs.record.outputs.capture-attempt }}
        run: python3 demo/publication.py prepare-sign --directory videos
      - name: Sign each original video
        run: |
          set -euo pipefail
          for video in videos/*.mp4; do
            cosign sign-blob --yes --bundle "${video}.sigstore.json" "${video}"
          done
      - name: Attest videos and the capture manifest
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            videos/*.mp4
            videos/demo-manifest.json
      - name: Retain original signed provenance bytes
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "${BUNDLE_PATH}" videos/demo-attestation.sigstore.json
          jq -ce 'select(.dsseEnvelope.payloadType == "application/vnd.in-toto+json") | .dsseEnvelope' \
            "${BUNDLE_PATH}" > videos/demo-videos.intoto.jsonl
      - name: Verify the complete candidate before retention
        run: python3 demo/publication.py verify --directory videos
      - name: Retain the signed candidate for explicit review and publication
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-signed-attempt-${{ github.run_attempt }}
          path: videos/
          if-no-files-found: error
          retention-days: 30

  # Explicit publication reuses signed bytes; it never renders or signs again.
  publish:
    needs: mode
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && needs.mode.outputs.mode == 'publish'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: immutable-demo-publication
      queue: max
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      PUBLISH_RUN_ID: ${{ inputs.publish_run_id }}
      PUBLISH_ATTEMPT: ${{ inputs.publish_attempt }}
    steps:
      - name: Checkout trusted publication policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the verified publication GitHub CLI
        env:
          GH_VERSION: 2.103.3
          GH_ARCHIVE_SHA256: 4c806978ffce1cec70853302a56d70ac6da4f19bae7adca4e1a8ab00633dd91d
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}"
          archive="gh_${GH_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --max-time 120 \
            "https://github.com/cli/cli/releases/download/v${GH_VERSION}/${archive}" -o "${archive}"
          echo "${GH_ARCHIVE_SHA256}  ${archive}" | sha256sum --check --status
          tar -xzf "${archive}"
          echo "${RUNNER_TEMP}/gh_${GH_VERSION}_linux_amd64/bin" >> "${GITHUB_PATH}"
      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          # renovate: datasource=github-releases depName=sigstore/cosign versioning=semver
          cosign-release: v3.1.4
      - name: Publish only the reviewed immutable candidate
        run: python3 demo/publication.py publish
