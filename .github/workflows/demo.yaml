# SPDX-License-Identifier: GPL-3.0-only

# Deploys the bundle on k3d, then records a short demo video: terminal
# chapters with VHS, the Keycloak SSO and TAK web UI walkthrough in a real
# Chrome window (Playwright on an Xvfb display, captured with x11grab),
# joined with ffmpeg. The MP4 is uploaded as the demo-video
# artifact. A manual run from main publishes the videos to the demo release
# and signs them there.
name: Demo Video

on:
  workflow_dispatch:
    inputs:
      app_ref:
        description: Branch or SHA to deploy. The demo scripts always come from the workflow's own commit.
        required: false
        default: ""
      atak:
        description: Also deploy the ATAK test device (KVM, amd64) and record its chapter.
        type: boolean
        required: false
        default: false
      sign_only:
        description: Skip the recording and only sign the videos already on the demo release (main only).
        type: boolean
        required: false
        default: false
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/demo.yaml"
      - "demo/**"
      - "tests/demo/**"
      - "tests/playwright.demo.config.ts"

permissions:
  contents: read

concurrency:
  group: demo-${{ github.ref }}
  cancel-in-progress: true

env:
  VHS_VERSION: 0.12.1
  AGG_VERSION: 1.9.0
  AGG_SHA256: f111e315cd71056b116302342553dd765b7297579ed511f111d0cedb442aeda6
  VHS_SHA256: eb33787a5b1cebf91fe0b18bd231e2d71d36c1ff4babd99ddac1a6ab411efd10

jobs:
  record:
    if: ${{ !inputs.sign_only }}
    runs-on: ${{ vars.TEST_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 240
    permissions:
      attestations: read
      contents: read
      packages: read
    env:
      APP_REF: ${{ inputs.app_ref }}
      ATAK: ${{ inputs.atak && 'true' || 'false' }}
      CACHE: ghcr.io/jonathanagustin/uds-k3d-takserver/build-cache
      ATAK_TAG: dev
      DRIVER_IMAGE: ghcr.io/jonathanagustin/uds-k3d-takserver/atak-driver:dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Lets the demo record a branch that is not on main yet. Everything
      # outside the demo files comes from APP_REF.
      - name: Use the requested app ref
        if: env.APP_REF != ''
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "${APP_REF}"
          git checkout FETCH_HEAD -- . \
            ':!demo' ':!tests/demo' ':!tests/playwright.demo.config.ts' \
            ':!tasks.yaml' ':!.gitignore' ':!.github/workflows/demo.yaml'
          echo "Deploying $(git rev-parse --short FETCH_HEAD) from ${APP_REF}"

      - name: Trim the runner
        if: vars.TEST_RUNNER == '' || vars.TEST_RUNNER == 'ubuntu-latest'
        run: ./.github/scripts/trim-runner.sh

      # Same steps as the ATAK e2e workflow: the registry build cache keeps
      # the APK build warm.
      - name: Check out the ATAK submodule and its LFS files
        if: env.ATAK == 'true'
        run: ./atak/ci/fetch-source.sh

      - name: Let the runner use KVM
        if: env.ATAK == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Set up Docker Buildx
        if: env.ATAK == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: env.ATAK == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the ATAK device images
        if: env.ATAK == 'true'
        timeout-minutes: 120
        run: |
          set -euo pipefail
          ./atak/ci/build-apk.sh
          docker buildx build -f atak/apk/Dockerfile --target driver -t "${DRIVER_IMAGE}" --load \
            --cache-from "type=registry,ref=${CACHE}:atak-apk-apk" .
          docker buildx build -f atak/vm/Dockerfile -t ghcr.io/jonathanagustin/uds-k3d-takserver/atak-civ-vm:dev --load \
            --cache-from "type=registry,ref=${CACHE}:atak-vm" .
          docker buildx build -f atak/viewer/Dockerfile -t ghcr.io/jonathanagustin/uds-k3d-takserver/atak-viewer:dev --load \
            --cache-from "type=registry,ref=${CACHE}:atak-viewer" .
          docker buildx rm --all-inactive --force || true
          docker buildx prune -af || true
          docker ps -a --filter name=buildx_buildkit -q | xargs -r docker rm -f
          df -h /

      - name: Install recording tools
        # Before the deploy, while the runner is idle: after it, apt has
        # hung here twice.
        timeout-minutes: 30
        run: |
          set -euo pipefail
          apt_opts=(-o DPkg::Lock::Timeout=120 -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          # The Ubuntu mirror serves some runners at a trickle (a 9 MB package
          # took two minutes), so the install is slow, not hung. Packages
          # already downloaded are kept between attempts, so each bounded
          # attempt resumes where the last stopped. sudo resets the
          # environment, so the non-interactive frontend is passed through
          # env: otherwise a debconf question waits on input that never comes.
          apt_try() {
            local attempt
            for attempt in 1 2 3 4 5; do
              if sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a \
                timeout --kill-after=10 240 apt-get "${apt_opts[@]}" "$@"; then
                return 0
              fi
              echo "::warning::apt-get $1 failed or stalled (attempt ${attempt} of 5)"
              pgrep -af '^(/usr/bin/|/usr/lib/apt/)?(apt|apt-get|dpkg|debconf|needrestart|unattended)' | cut -c1-200 || true
              sleep 5
            done
            return 1
          }
          apt_try update
          apt_try install -y -o Dpkg::Use-Pty=0 --no-install-recommends ffmpeg ttyd fonts-jetbrains-mono fonts-dejavu-core \
            xvfb libnss3-tools
          google-chrome --version
          # Chrome keeps its sandbox on (no unsupported-flag bar). Ubuntu 24.04
          # blocks the unprivileged user namespaces that sandbox uses.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          tarball="vhs_${VHS_VERSION}_Linux_x86_64.tar.gz"
          curl -fsSL -o "/tmp/${tarball}" "https://github.com/charmbracelet/vhs/releases/download/v${VHS_VERSION}/${tarball}"
          echo "${VHS_SHA256}  /tmp/${tarball}" | sha256sum -c -
          tar -xzf "/tmp/${tarball}" -C /tmp
          sudo install -m 0755 "/tmp/vhs_${VHS_VERSION}_Linux_x86_64/vhs" /usr/local/bin/vhs
          vhs --version
        shell: bash

      - name: Install Docker Compose
        uses: docker/setup-compose-action@54042514f505b273907334ae2b9cdbb9a0213c1a # v2.4.0
        with:
          version: v5.6.1

      - name: Install UDS CLI
        uses: defenseunicorns/setup-uds@d6add59d4c2ca789ed7c92741e91bd340b4e950b # v1.0.2
        with:
          # renovate: datasource=github-tags depName=defenseunicorns/uds-cli versioning=semver
          version: v0.40.0

      - name: Restore the Zarf cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache/zarf-cache
          key: zarf-cache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('zarf.yaml', 'common/zarf.yaml', 'values/**/*.yaml', 'bundle/**/*.yaml') }}
          restore-keys: |
            zarf-cache-${{ runner.os }}-${{ runner.arch }}-

      - name: Point Zarf at the restored cache
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/.cache/zarf-cache"
          rm -rf "${HOME}/.zarf-cache"
          ln -s "${GITHUB_WORKSPACE}/.cache/zarf-cache" "${HOME}/.zarf-cache"

      - name: Environment setup
        run: |
          echo "MARU_AUTH=\"{\"raw.githubusercontent.com\": \"${{ secrets.GITHUB_TOKEN }}\"}\"" >> "$GITHUB_ENV"
          uds run actions:setup-environment \
          --set REGISTRY1_USERNAME="${{ secrets.IRON_BANK_ROBOT_USERNAME }}" \
          --set REGISTRY1_PASSWORD="${{ secrets.IRON_BANK_ROBOT_PASSWORD }}" \
          --set GH_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
          --set RAPIDFORT_USERNAME="${{ secrets.RAPIDFORT_USERNAME }}" \
          --set RAPIDFORT_PASSWORD="${{ secrets.RAPIDFORT_PASSWORD }}" \
          --set CHAINGUARD_IDENTITY="${{ secrets.CHAINGUARD_IDENTITY }}"
        shell: bash

      # The deployment is recorded as the video's opening chapter: the same
      # commands as `uds run demo-deploy`, printed as they run, captured with
      # asciinema and rendered later by demo/render-cast.py.
      - name: Deploy UDS Core and TAK
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends asciinema
          mkdir -p demo/out
          TERM=xterm-256color FLAVOR=upstream asciinema rec --overwrite -q --cols 132 --rows 34 \
            -c './demo/deploy.sh; echo $? > demo/out/00-deploy.exit' demo/out/00-deploy.cast < /dev/null
          python3 -c 'import json,sys; [sys.stdout.write(json.loads(l)[2]) for l in open(sys.argv[1]).readlines()[1:] if l.strip()]' \
            demo/out/00-deploy.cast | tee /tmp/demo-deploy.log | tail -n 200
          test "$(cat demo/out/00-deploy.exit)" = 0
          uds run demo-setup --no-progress
        shell: bash
        timeout-minutes: 90

      - name: Render the recorded deployment
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/agg "https://github.com/asciinema/agg/releases/download/v${AGG_VERSION}/agg-x86_64-unknown-linux-gnu"
          echo "${AGG_SHA256}  /tmp/agg" | sha256sum -c -
          sudo install -m 0755 /tmp/agg /usr/local/bin/agg
          python3 demo/render-cast.py demo/out/00-deploy.cast demo/out/00-deploy \
            "1. UDS Core (slim) on a new k3d cluster::7" \
            "2. Build the Zarf package: upstream chart, images by full name::7" \
            "3. Bundle the package with UDS Core::5" \
            "4. Deploy the bundle: UDS Core, then TAK Server::10"
        shell: bash

      - name: Record the terminal chapters
        run: ./demo/record-terminal.sh
        env:
          # gh attestation verify in the "Secure by default" chapter.
          GH_TOKEN: ${{ github.token }}
        shell: bash

      - name: Record the web walkthrough
        run: ./demo/record-web.sh
        shell: bash

      - name: Deploy and connect the ATAK device
        if: env.ATAK == 'true'
        run: |
          set -euo pipefail
          (cd "${RUNNER_TEMP}" && npm init -y >/dev/null && npm install --no-audit --no-fund playwright@1.56.1 >/dev/null)
          NODE_PATH="${RUNNER_TEMP}/node_modules" OUT=demo/out/atak ./atak/ci/e2e.sh
        shell: bash
        timeout-minutes: 90

      - name: Record the ATAK walkthrough
        if: env.ATAK == 'true'
        run: ./demo/record-web.sh 08-atak atak.demo.ts "atak.uds.dev map.uds.dev sso.uds.dev"
        shell: bash

      - name: Record CloudTAK and ATAK in sync
        if: env.ATAK == 'true'
        # A failed take is left out of the video rather than failing the run.
        run: |
          if ! ./demo/record-web.sh 09-sync atak-sync.demo.ts "atak.uds.dev map.uds.dev sso.uds.dev takserver.uds.dev"; then
            rm -f demo/out/09-sync.mp4
            echo "::warning::The CloudTAK and ATAK sync chapter failed and is left out"
          fi
        shell: bash

      # Footprint and self-healing, recorded like the deployment and rendered
      # with the same speed-up and real elapsed times.
      - name: Record footprint and self-healing
        if: env.ATAK == 'true'
        run: |
          set -euo pipefail
          TERM=xterm-256color asciinema rec --overwrite -q --cols 132 --rows 34 \
            -c './demo/after-atak.sh; echo $? > demo/out/10-operate.exit' demo/out/10-operate.cast < /dev/null
          python3 -c 'import json,sys; [sys.stdout.write(json.loads(l)[2]) for l in open(sys.argv[1]).readlines()[1:] if l.strip()]' \
            demo/out/10-operate.cast | tail -n 80
          if [[ "$(cat demo/out/10-operate.exit)" != 0 ]]; then
            echo "::warning::The footprint and self-healing chapter failed and is left out"
            exit 0
          fi
          CAST_FONT_SIZE=26 CAST_COLS=104 CAST_ROWS=16 CAST_HOLD=4.5 \
            python3 demo/render-cast.py demo/out/10-operate.cast demo/out/10-operate \
            "Live CPU and memory of TAK's pods::6" \
            "The whole package for an offline install::4" \
            "The ATAK test device, connected with its own client certificate::4" \
            "Delete TAK's messaging pod: Kubernetes brings it back::8" \
            "ATAK reconnects by itself::6"
        shell: bash

      - name: Build demo.mp4
        run: ./demo/assemble.sh
        shell: bash

      - name: Upload the demo video
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-video
          path: |
            demo/out/demo.mp4
            demo/out/demo-operate.mp4
            demo/out/*-chapters.txt
            demo/out/poster.png
            demo/out/preview.gif
          if-no-files-found: error
          retention-days: 30

      - name: Upload the separate segments
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-segments
          path: |
            demo/out/0*.mp4
            demo/out/0*-events.json
            demo/out/10-operate-*
            demo/out/tapes/*.tape
            demo/out/06-web.mp4
            demo/out/06-web-events.json
            demo/out/browser-06-web/screen.mkv
            demo/out/browser-06-web/ffmpeg.log
            demo/out/08-atak-events.json
            demo/out/09-sync-events.json
            demo/out/browser-09-sync/screen.mkv
            demo/out/*.cast
            demo/out/browser-08-atak/screen.mkv
            demo/out/browser-08-atak/ffmpeg.log
            demo/out/atak/*.png
            demo/out/atak/*.txt
            tests/.playwright/demo/**/*.png
            /tmp/demo-deploy.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Debug Output
        if: failure()
        run: uds run actions:debug-output
        shell: bash

  # A manual run from main puts the two videos on the fixed "demo" release, so
  # the README's download links do not follow the package version. Pull request
  # runs and runs from other branches never publish. The release is a
  # prerelease and not "latest", and its tag is not a version, so Release Please
  # and the upgrade baseline (strict vX.Y.Z tags only) ignore it.
  publish:
    needs: record
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download the demo videos
        run: |
          set -euo pipefail
          gh run download "${GITHUB_RUN_ID}" --name demo-video --dir videos
          # The release assets keep the names the README links to.
          mv videos/demo.mp4 videos/demo-deploy.mp4
          mv videos/demo-operate.mp4 videos/demo-operate-and-trust.mp4
          ls -l videos
        shell: bash

      - name: Publish them to the demo release
        run: |
          set -euo pipefail
          if ! gh release view demo >/dev/null 2>&1; then
            gh release create demo --prerelease --latest=false --target main \
              --title "Demo videos" \
              --notes "The two demo videos the README links to. The Demo workflow replaces them on each manual run from main. Not a package release."
          fi
          gh release upload demo videos/demo-deploy.mp4 videos/demo-operate-and-trust.mp4 --clobber
        shell: bash

  # Signs the videos on the demo release keylessly through Sigstore with this
  # workflow's identity, the same way as the package releases. It downloads
  # the assets from the release, so it signs exactly the bytes the README
  # links to, and it never uploads or changes the videos. Each video gets a
  # Cosign bundle (<video>.sigstore.json), and both get one SLSA provenance
  # attestation (demo-videos.intoto.jsonl). It runs after publish, or alone
  # with sign_only for the videos already there. Verify with:
  #   cosign verify-blob demo-deploy.mp4 --bundle demo-deploy.mp4.sigstore.json \
  #     --certificate-identity https://github.com/jonathanagustin/uds-k3d-takserver/.github/workflows/demo.yaml@refs/heads/main \
  #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
  sign:
    needs: [record, publish]
    if: >-
      always() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
      && (inputs.sign_only || needs.publish.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      VIDEOS: demo-deploy.mp4 demo-operate-and-trust.mp4
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # renovate: datasource=github-releases depName=sigstore/cosign versioning=semver
          cosign-release: v3.1.4

      - name: Download the videos from the demo release
        run: |
          set -euo pipefail
          mkdir videos
          for video in ${VIDEOS}; do
            gh release download demo --pattern "${video}" --dir videos
            digest="$(gh release view demo --json assets --jq ".assets[] | select(.name == \"${video}\") | .digest")"
            echo "${digest#sha256:}  videos/${video}" | sha256sum -c -
            echo "${digest#sha256:}  ${video}" >> digests.txt
          done
          cat digests.txt
        shell: bash

      - name: Sign the videos
        run: |
          set -euo pipefail
          cd videos
          for video in ${VIDEOS}; do
            cosign sign-blob --yes --bundle "${video}.sigstore.json" "${video}"
          done
        shell: bash

      - name: Attest build provenance
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            videos/demo-deploy.mp4
            videos/demo-operate-and-trust.mp4

      - name: Write the provenance as in-toto JSON lines
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          jq -ce 'select(.dsseEnvelope.payloadType == "application/vnd.in-toto+json") | .dsseEnvelope' \
            "${BUNDLE_PATH}" > videos/demo-videos.intoto.jsonl
          jq -re '.payload | @base64d | fromjson | .predicateType' videos/demo-videos.intoto.jsonl \
            | grep -qx 'https://slsa.dev/provenance/v1'
        shell: bash

      - name: Verify the signatures and the provenance
        env:
          IDENTITY: ${{ github.server_url }}/${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          identity="${IDENTITY%@*}@refs/heads/main"
          cd videos
          for video in ${VIDEOS}; do
            cosign verify-blob "${video}" --bundle "${video}.sigstore.json" \
              --certificate-identity "${identity}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
            gh attestation verify "${video}" --owner "${GITHUB_REPOSITORY_OWNER}" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/demo.yaml"
          done
        shell: bash

      - name: Add the signatures and the provenance to the demo release
        run: |
          set -euo pipefail
          cd videos
          gh release upload demo demo-deploy.mp4.sigstore.json demo-operate-and-trust.mp4.sigstore.json \
            demo-videos.intoto.jsonl --clobber
          # The videos on the release must still be the ones that were signed.
          for video in ${VIDEOS}; do
            digest="$(gh release view demo --json assets --jq ".assets[] | select(.name == \"${video}\") | .digest")"
            grep -qx "${digest#sha256:}  ${video}" ../digests.txt
          done
        shell: bash
