name: Docs

on:
  workflow_call:
    inputs:
      release_tag:
        description: Stable tag whose package publication completed
        type: string
        required: true
  release:
    types: [published]
  pull_request:
    paths:
      - "docs-site/**"
      - "docs/**"
      - "adr/**"
      - "README.md"
      - "SECURITY.md"
      - "CONTRIBUTING.md"
      - "CHANGELOG.md"
      - ".github/workflows/docs.yaml"
  push:
    branches:
      - main
    paths:
      - "docs-site/**"
      - "docs/**"
      - "adr/**"
      - "README.md"
      - "SECURITY.md"
      - "CONTRIBUTING.md"
      - "CHANGELOG.md"
      - ".github/workflows/docs.yaml"

permissions:
  contents: read

# A newer pull request push replaces its preview. Main and release builds
# share one publication queue, including calls from Release Please. The caller
# workflow name differs in reusable context and must not split this group.
concurrency:
  group: docs-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Release events build the current renderer against all release tags.
          ref: ${{ (github.event_name == 'release' || inputs.release_tag != '') && 'main' || github.ref }}
          fetch-tags: true

      - name: Verify the published release source
        if: inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}"
          git merge-base --is-ancestor "refs/tags/${RELEASE_TAG}" HEAD

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Astro 7.4 rejects Node 22.23.3. setup-node's "22" still resolves to that.
          node-version: 26.13.0
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install
        working-directory: docs-site
        run: npm ci

      - name: Build
        working-directory: docs-site
        env:
          ASTRO_TELEMETRY_DISABLED: 1
        run: npm run build

      - name: Install the docs browser
        working-directory: docs-site
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        working-directory: docs-site
        env:
          ASTRO_TELEMETRY_DISABLED: 1
        run: npm test

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && (inputs.release_tag != '' || github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs-site/dist

  deploy:
    timeout-minutes: 10
    if: github.event_name != 'pull_request' && (inputs.release_tag != '' || github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
