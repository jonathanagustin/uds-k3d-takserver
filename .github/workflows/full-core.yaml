# Full UDS Core plus TAK. This is its own workflow so a nightly schedule does
# not rerun the per-PR validate-install jobs in test.yaml. No workflow in
# this repo sets a larger GitHub-hosted runner label, so amd64 uses
# vars.TEST_RUNNER when that variable is set and ubuntu-latest otherwise.
# The job then trims the runner disk and adds swap. See
# adr/0015-full-core-is-a-scheduled-gate.md.
name: Full Core

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * *"
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "**.jpg"
      - "**.png"
      - "**.gif"
      - "**.svg"
      - "docs/**"
      - "adr/**"
      - ".gitignore"
      - "LICENSE"
      - "renovate.json"
      - ".release-please-manifest.json"
      - "release-please-config.json"
      - "CODEOWNERS"
      - "SECURITY.md"
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths-ignore:
      - "**.md"
      - "**.jpg"
      - "**.png"
      - "**.gif"
      - "**.svg"
      - "docs/**"
      - "adr/**"
      - ".gitignore"
      - "LICENSE"
      - "renovate.json"
      - ".release-please-manifest.json"
      - "release-please-config.json"
      - "CODEOWNERS"
      - "SECURITY.md"

permissions:
  contents: read
  packages: read
  id-token: write

concurrency:
  group: full-core-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-full-core:
    name: validate-full-core (${{ matrix.arch }})
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-core'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ${{ vars.TEST_RUNNER || 'ubuntu-latest' }}
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # A healthy full-core run finishes in about 30 minutes. This job limit is
    # what stops a step whose own timeout does not, such as actions/upload-artifact.
    timeout-minutes: 75
    permissions:
      actions: write
      contents: read
      packages: read
      id-token: write
    env:
      TEST_FLAVOR: upstream
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Install Docker Compose
        uses: docker/setup-compose-action@54042514f505b273907334ae2b9cdbb9a0213c1a # v2.4.0
        with:
          version: v5.6.1

      - name: Install UDS CLI
        uses: defenseunicorns/setup-uds@d6add59d4c2ca789ed7c92741e91bd340b4e950b # v1.0.2
        with:
          # renovate: datasource=github-tags depName=defenseunicorns/uds-cli versioning=semver
          version: v0.40.0

      - name: Trim the runner
        if: vars.TEST_RUNNER == '' || vars.TEST_RUNNER == 'ubuntu-latest' || runner.arch == 'ARM64'
        run: ./.github/scripts/trim-runner.sh
        env:
          TRIM_SKIP_ABOVE_GB: "60"

      - name: Add swap
        if: vars.TEST_RUNNER == '' || vars.TEST_RUNNER == 'ubuntu-latest' || runner.arch == 'ARM64'
        run: ./.github/scripts/add-runner-swap.sh

      # Restore the cache the Test workflow fills. Do not save it again: a
      # second save of that key fails, and another multi-gigabyte cache entry
      # crowds the repository cache.
      - name: Restore the Zarf cache
        id: zarf-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache/zarf-cache
          key: zarf-cache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('zarf.yaml', 'common/zarf.yaml', 'values/**/*.yaml', 'bundle/**/*.yaml') }}
          restore-keys: |
            zarf-cache-${{ runner.os }}-${{ runner.arch }}-

      - name: Point Zarf at the restored cache
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/.cache/zarf-cache"
          rm -rf "${HOME}/.zarf-cache"
          ln -s "${GITHUB_WORKSPACE}/.cache/zarf-cache" "${HOME}/.zarf-cache"

      - name: Environment setup
        run: |
          echo "MARU_AUTH=\"{\"raw.githubusercontent.com\": \"${{ secrets.GITHUB_TOKEN }}\"}\"" >> "$GITHUB_ENV"
          uds run actions:setup-environment \
          --set REGISTRY1_USERNAME="${{ secrets.IRON_BANK_ROBOT_USERNAME }}" \
          --set REGISTRY1_PASSWORD="${{ secrets.IRON_BANK_ROBOT_PASSWORD }}" \
          --set GH_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
          --set RAPIDFORT_USERNAME="${{ secrets.RAPIDFORT_USERNAME }}" \
          --set RAPIDFORT_PASSWORD="${{ secrets.RAPIDFORT_PASSWORD }}" \
          --set CHAINGUARD_IDENTITY="${{ secrets.CHAINGUARD_IDENTITY }}"
        shell: bash

      - name: Use this commit's TAK, CloudTAK and PostGIS images
        run: ./.github/scripts/pin-image-tags.sh

      - name: Deploy full core and test
        run: uds run test-full-core --set FLAVOR="${{ env.TEST_FLAVOR }}" --no-progress
        shell: bash
        # A normal deploy takes about 30 minutes. This fires before the job
        # limit so the log and dump steps below still run.
        timeout-minutes: 55

      - name: Disk use after the test
        if: always()
        timeout-minutes: 2
        shell: bash
        run: |
          df -h /
          sudo timeout 60 docker system df || true

      - name: Debug Output
        if: always()
        run: uds run actions:debug-output
        shell: bash

      - name: Node memory
        if: failure()
        run: ./.github/scripts/dump-memory.sh

      - name: Save logs
        if: always()
        run: uds run actions:save-logs
        shell: bash
        timeout-minutes: 2

      - name: Generate unique suffix
        id: uniq
        if: always()
        shell: bash
        run: |
          # shellcheck disable=SC3028
          echo "suffix=${RANDOM}" >> "$GITHUB_OUTPUT"

      - name: Upload uptime probe log
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: uptime-probes-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ steps.uniq.outputs.suffix }}
          path: out/uptime-probes.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Grafana and Prometheus rule check
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: grafana-alerts-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ steps.uniq.outputs.suffix }}
          path: |
            out/grafana-search.json
            out/prometheus-tak-rules.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Falco events
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: falco-events-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ steps.uniq.outputs.suffix }}
          path: out/falco-events.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload kubectl top
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kubectl-top-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ steps.uniq.outputs.suffix }}
          path: out/kubectl-top.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload portal screenshots
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portal-tiles-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ steps.uniq.outputs.suffix }}
          path: tests/.playwright/screenshots/portal-*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Upload backup restore log
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backup-restore-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ steps.uniq.outputs.suffix }}
          path: out/backup-restore.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload debug logs
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debug-log-full-core-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ steps.uniq.outputs.suffix }}
          path: |
            /tmp/zarf-*.log
            /tmp/uds-*.log
            /tmp/maru-*.log
            /tmp/debug-*.log
            /tmp/uds-containerd-logs
            /tmp/k3d-uds-*.log
          if-no-files-found: ignore
