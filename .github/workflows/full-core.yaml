# Full UDS Core plus TAK. This is its own workflow so a nightly schedule does
# not rerun the per-PR validate-install jobs in test.yaml. No workflow in
# this repo sets a larger GitHub-hosted runner label, so amd64 uses
# vars.TEST_RUNNER when set, otherwise ubuntu-22.04 as a temporary #300
# label comparison; metadata observes an older 6.8 kernel on 22.
# Changing the image is not proof of a kernel fix. Use native ARM 22 and
# retain disk trimming, swap, and the per-job image/kernel notice.
# See docs/ci.md and adr/0015-full-core-is-a-scheduled-gate.md.
name: Full Core

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * *"
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read
  packages: read
  id-token: write

jobs:
  # Decides whether this event needs Full Core. The nightly run, a manual
  # run, and a pull request with the full-core label always do. A push to
  # main does only when the pushed commits change a Full Core path, same as
  # a pull request. This is a job, not workflow-level paths, so the
  # "full-core" check below always reports and can be required. Concurrency
  # is on the validate job, so a docs push does not cancel a validation that
  # is already running and does not wait behind it.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      # Always check out: the decision script lives in the repository. A pull
      # request diffs its base, and a main push diffs github.event.before.
      # The depths are strings: a bare 0 is falsy, so "&& 0 || 1" always gives 1.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && '0' || '1' }}
          persist-credentials: false

      - name: Decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          LABELED: ${{ contains(github.event.pull_request.labels.*.name, 'full-core') }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: ./.github/scripts/full-core-paths.sh

  validate-full-core:
    name: validate-full-core (${{ matrix.arch }})
    needs: [changes]
    if: needs.changes.outputs.run == 'true'
    # Only a run that is going to validate cancels the previous validation
    # of this architecture. amd64 and arm64 do not cancel each other. A
    # nightly run and a manual run use their own group and are not cancelled.
    # A skipped decision does not take this group.
    concurrency:
      group: ${{ github.workflow }}-${{ github.job }}-${{ matrix.arch }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.run_id || 'gate' }}
      cancel-in-progress: ${{ needs.changes.outputs.run == 'true' && (github.event_name == 'pull_request' || github.event_name == 'push') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ${{ vars.TEST_RUNNER || 'ubuntu-22.04' }}
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    # A healthy full-core run takes about 30 minutes once the images exist.
    # When this commit changes the TAK, CloudTAK or PostGIS images, the wait
    # for them below can take up to about 180 more. The job limit covers both,
    # and still stops a step whose own timeout does not (actions/upload-artifact).
    timeout-minutes: 255
    permissions:
      actions: read
      contents: read
      packages: read
      id-token: write
    env:
      TEST_FLAVOR: upstream
      # Test's package job publishes the dev package for these inputs; pull
      # it instead of creating it (.github/scripts/dev-package.sh).
      DEV_PACKAGE_WAIT_SECONDS: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '900' || '0' }}
      DEV_PACKAGE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up test Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          check-latest: false

      - name: Verify test Python before cluster work
        run: python3 -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version; print(sys.version)'

      - name: Record the runner image
        run: echo "::notice::runner arch=$(uname -m) kernel=$(uname -r) ImageOS=${ImageOS:-unknown} ImageVersion=${ImageVersion:-unknown}"

      # ubuntu-26.04 runners boot with the kernel's inotify limits (128
      # instances) because the image's /etc/sysctl.conf is not applied
      # (actions/runner-images#15108). The k3d node shares those limits, and
      # once they run out istio-cni-node cannot restart ("couldn't initialize
      # inotify: too many open files"), so new pods get no network. These are
      # the values the image means to set.
      - name: Raise inotify limits
        run: |
          sudo sysctl -w fs.inotify.max_user_instances=1280 fs.inotify.max_user_watches=655360

      - name: Install Docker Compose
        uses: docker/setup-compose-action@54042514f505b273907334ae2b9cdbb9a0213c1a # v2.4.0
        with:
          version: v5.7.0

      - name: Install UDS CLI
        uses: defenseunicorns/setup-uds@d6add59d4c2ca789ed7c92741e91bd340b4e950b # v1.0.2
        with:
          # renovate: datasource=github-tags depName=defenseunicorns/uds-cli versioning=semver
          version: v0.41.0

      - name: Trim the runner
        if: vars.TEST_RUNNER == '' || vars.TEST_RUNNER == 'ubuntu-22.04' || vars.TEST_RUNNER == 'ubuntu-24.04' || vars.TEST_RUNNER == 'ubuntu-26.04' || runner.arch == 'ARM64'
        run: ./.github/scripts/trim-runner.sh
        env:
          TRIM_SKIP_ABOVE_GB: "60"

      - name: Add swap
        if: vars.TEST_RUNNER == '' || vars.TEST_RUNNER == 'ubuntu-22.04' || vars.TEST_RUNNER == 'ubuntu-24.04' || vars.TEST_RUNNER == 'ubuntu-26.04' || runner.arch == 'ARM64'
        run: ./.github/scripts/add-runner-swap.sh

      - name: Environment setup
        run: |
          echo "MARU_AUTH=\"{\"raw.githubusercontent.com\": \"${{ secrets.GITHUB_TOKEN }}\"}\"" >> "$GITHUB_ENV"
          uds run actions:setup-environment \
          --set REGISTRY1_USERNAME="${{ secrets.IRON_BANK_ROBOT_USERNAME }}" \
          --set REGISTRY1_PASSWORD="${{ secrets.IRON_BANK_ROBOT_PASSWORD }}" \
          --set GH_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
          --set RAPIDFORT_USERNAME="${{ secrets.RAPIDFORT_USERNAME }}" \
          --set RAPIDFORT_PASSWORD="${{ secrets.RAPIDFORT_PASSWORD }}" \
          --set CHAINGUARD_IDENTITY="${{ secrets.CHAINGUARD_IDENTITY }}"
        shell: bash

      # pin-image-tags.sh points the package at <version>-<key>. Those tags
      # do not exist until Container, CloudTAK and PostGIS publish them.
      # Creating the package first fails with "reference does not exist".
      # A keyed tag that is already published returns immediately.
      - name: Wait for the six TAK images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_IF_MISSING: "false"
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: ./.github/scripts/wait-for-tak-images.sh

      - name: Wait for the CloudTAK image
        run: ./.github/container-and-chart/cloudtak/build.sh --wait

      - name: Wait for the PostGIS image
        run: ./.github/container-and-chart/postgis/build.sh --wait

      - name: Use this commit's TAK, CloudTAK and PostGIS images
        run: ./.github/scripts/pin-image-tags.sh

      - name: Deploy full core and test
        run: uds run test-full-core --set FLAVOR="${{ env.TEST_FLAVOR }}" --no-progress
        shell: bash
        # Passing amd64 run 42180258293 finished in 68m45s, including a
        # completed api-smoke. The 70 minute cap cut later amd64 runs after
        # that smoke had started. api-smoke.sh now stops itself at 10 minutes
        # and SIGKILLs that process group after a short grace period.
        # 80 minutes is 69 minutes (that measured pass, rounded up) plus that
        # enforced 10 minute smoke budget. It is a measured margin plus the
        # cap, not a sum of curl or handshake ceilings. A restore rollout
        # still fails this script at its own 600s.
        timeout-minutes: 80

      # Probe before any diagnostics that call Docker or Kubernetes. A routing
      # timeout skips those calls; local sanitized logs are still printed.
      - name: Check for the runner network wedge
        id: runner-wedge
        if: failure()
        # The script stops itself at 20 seconds and exits 0. This limit only
        # covers that wrapper. A hang here is not the deploy failure.
        timeout-minutes: 2
        run: ./.github/scripts/runner-wedge-probe.sh || true

      - name: Capture agent availability after failed full core
        if: failure() && steps.runner-wedge.outputs.network-stalled != 'true'
        timeout-minutes: 2
        continue-on-error: true
        run: ./tests/upgrade-agent-diagnostics.sh full-core

      # test:full-core writes out/falco-events.txt only when it reaches
      # tests/falco-events.sh, so an earlier failure left the upload below
      # with no file. Collect the events here instead. The script skips when
      # Falco or Loki never came up, and it redacts passwords itself.
      - name: Collect Falco events when the test did not
        if: failure() && steps.runner-wedge.outputs.network-stalled != 'true'
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          if [[ -s out/falco-events.txt ]]; then
            echo "out/falco-events.txt already exists"
            exit 0
          fi
          FALCO_COLLECT_ONLY=1 ./tests/falco-events.sh

      - name: Disk use after the test
        if: always() && steps.runner-wedge.outputs.network-stalled != 'true'
        timeout-minutes: 2
        shell: bash
        run: |
          df -h /
          sudo timeout 60 docker system df || true

      - name: Debug Output
        if: always() && steps.runner-wedge.outputs.network-stalled != 'true'
        run: uds run actions:debug-output
        timeout-minutes: 3
        shell: bash

      - name: Node memory
        if: failure() && steps.runner-wedge.outputs.network-stalled != 'true'
        run: ./.github/scripts/dump-memory.sh
        # A dead API server can hang kubectl; later always() steps still run.
        timeout-minutes: 5

      - name: Save logs
        if: always() && steps.runner-wedge.outputs.network-stalled != 'true'
        run: uds run actions:save-logs
        shell: bash
        timeout-minutes: 2

      - name: Stage sanitized logs
        id: sanitize
        if: ${{ !cancelled() }}
        # Copies into a new directory and redacts there. ok=true only if that
        # script exits 0. A timeout or cancel leaves ok unset, so the uploads
        # below do not run and the raw logs are not published.
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          dest="${RUNNER_TEMP}/sanitized-logs"
          ./.github/scripts/stage-sanitized-logs.sh "${dest}" \
            out \
            /tmp/zarf-*.log /tmp/uds-*.log /tmp/maru-*.log /tmp/debug-*.log \
            /tmp/uds-containerd-logs /tmp/k3d-uds-*.log
          echo "ok=true" >> "${GITHUB_OUTPUT}"
          echo "dir=${dest}" >> "${GITHUB_OUTPUT}"

      - name: Print sanitized logs
        if: ${{ !cancelled() && steps.sanitize.outputs.ok == 'true' }}
        timeout-minutes: 3
        shell: bash
        run: ./.github/scripts/print-logs.sh "${{ steps.sanitize.outputs.dir }}/payload"

      - name: Generate unique suffix
        id: uniq
        if: ${{ !cancelled() && steps.sanitize.outputs.ok == 'true' }}
        shell: bash
        run: |
          # shellcheck disable=SC3028
          echo "suffix=${RANDOM}" >> "$GITHUB_OUTPUT"

      # A failed deploy must not start these uploads. actions/upload-artifact
      # v7.0.2 can ignore timeout-minutes. This job's limit then cancels the
      # job, and GitHub keeps no log of the failure. The print step already
      # wrote the sanitized logs. success() lets that job finish. A sanitizer
      # that did not finish still cannot upload.
      - name: Upload uptime probe log
        if: ${{ success() && !cancelled() && steps.sanitize.outputs.ok == 'true' }}
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: uptime-probes-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ steps.uniq.outputs.suffix }}
          path: ${{ steps.sanitize.outputs.dir }}/payload/out/uptime-probes.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Grafana and Prometheus rule check
        if: ${{ success() && !cancelled() && steps.sanitize.outputs.ok == 'true' }}
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: grafana-alerts-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ steps.uniq.outputs.suffix }}
          path: |
            ${{ steps.sanitize.outputs.dir }}/payload/out/grafana-search.json
            ${{ steps.sanitize.outputs.dir }}/payload/out/prometheus-tak-rules.json
            ${{ steps.sanitize.outputs.dir }}/payload/out/alertmanager-alerts.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Falco events
        if: ${{ success() && !cancelled() && steps.sanitize.outputs.ok == 'true' }}
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: falco-events-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ steps.uniq.outputs.suffix }}
          path: ${{ steps.sanitize.outputs.dir }}/payload/out/falco-events.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload kubectl top
        if: ${{ success() && !cancelled() && steps.sanitize.outputs.ok == 'true' }}
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kubectl-top-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ steps.uniq.outputs.suffix }}
          path: ${{ steps.sanitize.outputs.dir }}/payload/out/kubectl-top.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload backup restore log
        if: ${{ success() && !cancelled() && steps.sanitize.outputs.ok == 'true' }}
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backup-restore-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ steps.uniq.outputs.suffix }}
          path: ${{ steps.sanitize.outputs.dir }}/payload/out/backup-restore.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload debug logs
        if: ${{ success() && !cancelled() && steps.sanitize.outputs.ok == 'true' }}
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debug-log-full-core-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ steps.uniq.outputs.suffix }}
          path: ${{ steps.sanitize.outputs.dir }}/payload/tmp
          if-no-files-found: ignore

  # The one check to require: success when Full Core passed or was not needed.
  # A cancelled validation skips this job. always() would run and fail it,
  # and that failure is what a superseded head leaves behind.
  full-core:
    runs-on: ubuntu-24.04
    needs: [changes, validate-full-core]
    if: ${{ always() && !cancelled() && needs.changes.result != 'cancelled' && needs.validate-full-core.result != 'cancelled' }}
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check the Full Core result
        env:
          CHANGES: ${{ needs.changes.result }}
          RUN: ${{ needs.changes.outputs.run }}
          RESULT: ${{ needs.validate-full-core.result }}
        run: |
          echo "changes=${CHANGES} run=${RUN} validate-full-core=${RESULT}"
          if [ "${CHANGES}" != "success" ]; then
            echo "The path check did not finish."
            exit 1
          fi
          if [ "${RUN}" != "true" ]; then
            echo "Full Core was not needed for this change."
            exit 0
          fi
          test "${RESULT}" = success
