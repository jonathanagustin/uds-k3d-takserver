name: Lint

on:
  pull_request:
    types: [milestoned, opened, reopened, synchronize]
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  hk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: uv
          cache: true

      - name: Install hk tools
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          # Names have to match mise.toml. yamllint and codespell are PyPI tools
          # and need uv installed first. uds-cli is only in the aqua registry.
          install_args: hk shellcheck actionlint helm node pypi:yamllint pypi:codespell aqua:defenseunicorns/uds-cli aqua:gitleaks/gitleaks aqua:hadolint/hadolint aqua:google/osv-scanner
          cache: true

      - name: hk check
        run: hk check --all

  validate:
    uses: defenseunicorns/uds-common/.github/workflows/callable-lint.yaml@9cb4ebfd9f9a5efd1dbc454bf3aae843d0b57b9f # v1.32.2
    secrets: inherit
