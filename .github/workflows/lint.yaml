name: Lint

on:
  pull_request:
    types: [milestoned, opened, reopened, synchronize]
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  hk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install uv
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install_args: uv
          cache: true

      - name: Install hk tools
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          # Names have to match mise.toml. yamllint and codespell are PyPI tools
          # and need uv installed first. uds-cli is only in the aqua registry.
          install_args: hk shellcheck actionlint helm node pypi:yamllint pypi:codespell aqua:defenseunicorns/uds-cli aqua:gitleaks/gitleaks aqua:hadolint/hadolint
          cache: true

      - name: hk check
        run: hk check --all

  validate:
    uses: defenseunicorns/uds-common/.github/workflows/callable-lint.yaml@320e247b590fbdcf25a1f01e9b00db88bdd8a448 # v1.32.1
    secrets: inherit
