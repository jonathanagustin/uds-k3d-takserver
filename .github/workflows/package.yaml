name: Package

on:
  workflow_dispatch:
  # main publishes the package for its inputs too, for the Full Core and
  # Benchmark runs on main. The ignore list matches Test
  # (.github/scripts/runtime-paths.sh). A manual run is not filtered.
  push:
    branches: [main]
    paths-ignore: &ci-ignore
      - "docs/**"
      - "adr/**"
      - "docs-site/**"
      - "assets/**"
      - "atak/**"
      - "bench/**"
      - "demo/**"
      - "upstream/atak-civ"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
      - ".github/test-infra/**"
      - ".github/actionlint.yaml"
      - ".github/workflows/docs.yaml"
      - ".github/workflows/lint.yaml"
      - ".github/workflows/commitlint.yaml"
      - ".github/workflows/codeql.yaml"
      - ".github/workflows/dependency-review.yaml"
      - ".github/workflows/scorecard.yaml"
      - ".github/workflows/scorecard-analysis.yaml"
      - ".github/workflows/release-please.yaml"
      - ".github/workflows/release.yaml"
      - ".github/workflows/cosign.yaml"
      - ".github/workflows/demo.yaml"
      - ".github/workflows/benchmark.yaml"
      - ".github/workflows/full-core.yaml"
      - ".github/workflows/unit-tests.yaml"
      - ".github/workflows/atak.yaml"
      - ".github/workflows/atak-vm.yaml"
      - ".github/workflows/atak-e2e.yaml"
      - ".github/workflows/mirror-checkpoint.yaml"
      - ".github/workflows/test-aks.yaml"
      - ".github/workflows/test-eks.yaml"
      - ".github/workflows/test-rke2.yaml"
      - ".github/workflows/scan.yaml"
      - ".github/scripts/full-core-paths.sh"
      - ".github/scripts/runtime-paths.sh"
      - ".github/scripts/ci-concurrency.sh"
      - ".gitignore"
      - ".gitleaks.toml"
      - ".hadolint.yaml"
      - ".yamllint"
      - ".license_config.yaml"
      - ".codespellrc"
      - ".adr-dir"
      - "LICENSE"
      - "CODEOWNERS"
      - "README.md"
      - "SECURITY.md"
      - "CONTRIBUTING.md"
      - "CHANGELOG.md"
      - "renovate.json"
      - ".release-please-manifest.json"
      - "release-please-config.json"
      - "commitlint.config.js"
      - "hk.pkl"
      - "tests/demo/**"
      - "tests/test_*"
      - "tests/playwright.demo.config.ts"
      - "pepr/capabilities/*.test.ts"
      - "pepr/scripts/coverage-summary.mjs"
  pull_request:
    paths-ignore: *ci-ignore

permissions:
  actions: read
  contents: read
  packages: read

# A newer pull request push or main push cancels the older run of this
# workflow on that ref. The old run would otherwise wait on images the newer
# push has already overwritten. Schedule and workflow_dispatch each get their
# own run id: they are not cancelled, and they do not wait behind a push.
# Release and Demo Video are not in this group. A finished run is kept.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.run_id || 'gate' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  # Zarf packages are per architecture. Each runner creates the package for
  # its own architecture, and Zarf pulls the matching image from each index.
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    name: package (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Record the runner image
        run: echo "::notice::runner arch=$(uname -m) kernel=$(uname -r) ImageOS=${ImageOS:-unknown} ImageVersion=${ImageVersion:-unknown}"

      - name: Free disk
        run: ./.github/scripts/free-runner-disk.sh
        env:
          PRUNE_DOCKER: "true"

      - name: Check whether Docker inputs changed
        id: docker
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set +e
          ./.github/scripts/docker-inputs-changed.sh
          code=$?
          set -e
          if [ "${code}" -eq 0 ]; then
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          elif [ "${code}" -eq 1 ]; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          else
            echo "docker-inputs-changed.sh failed (${code})." >&2
            exit 1
          fi

      - name: Wait for the six TAK images
        if: steps.docker.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_IF_MISSING: "false"
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: ./.github/scripts/wait-for-tak-images.sh

      - name: Confirm the published TAK images
        if: steps.docker.outputs.changed != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHECK_ONCE: "true"
          BUILD_IF_MISSING: "false"
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: ./.github/scripts/wait-for-tak-images.sh

      # The Test workflow builds the CloudTAK image when its inputs change.
      # Wait for that build instead of reading an older image or none.
      - name: Wait for the CloudTAK image
        run: ./.github/container-and-chart/cloudtak/build.sh --wait

      # Same for the PostGIS image.
      - name: Wait for the PostGIS image
        run: ./.github/container-and-chart/postgis/build.sh --wait

      - name: Install UDS CLI
        uses: defenseunicorns/setup-uds@d6add59d4c2ca789ed7c92741e91bd340b4e950b # v1.0.2
        with:
          # renovate: datasource=github-tags depName=defenseunicorns/uds-cli versioning=semver
          version: v0.41.0

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Package the images built from this commit's inputs, not whatever
      # another branch pushed to the shared tags last.
      - name: Use this commit's TAK, CloudTAK and PostGIS images
        run: ./.github/scripts/pin-image-tags.sh

      # A package published for the same inputs (a rerun, or a merge of main
      # that did not touch them) is pulled instead (.github/scripts/dev-package.sh).
      - name: Create the dev package
        run: uds run create-dev-package --no-progress

      - name: Check the package architecture
        env:
          ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          set -euo pipefail
          package="$(ls zarf-package-takserver-"${ARCH}"-*.tar.zst)"
          # The zarf.yaml inside the archive records the build architecture.
          tar --zstd -xOf "${package}" zarf.yaml > "${RUNNER_TEMP}/zarf.yaml"
          built="$(uds zarf tools yq -r '.build.architecture' "${RUNNER_TEMP}/zarf.yaml")"
          echo "${package}: build.architecture=${built}"
          test "${built}" = "${ARCH}"

      # Content-addressed: the tag is the input key and is written once. Test,
      # Full Core and Benchmark pull it instead of creating the package again.
      # Fork pull requests get a read-only token and skip this.
      - name: Publish the package under its input key
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: ./.github/scripts/dev-package.sh publish
