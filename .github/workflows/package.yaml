name: Package

on:
  workflow_dispatch:
  pull_request:

permissions:
  actions: read
  contents: read
  packages: read

jobs:
  # Zarf packages are per architecture. Each runner creates the package for
  # its own architecture, and Zarf pulls the matching image from each index.
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    name: package (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Free disk
        run: ./.github/scripts/free-runner-disk.sh
        env:
          PRUNE_DOCKER: "true"

      - name: Check whether Docker inputs changed
        id: docker
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set +e
          ./.github/scripts/docker-inputs-changed.sh
          code=$?
          set -e
          if [ "${code}" -eq 0 ]; then
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          elif [ "${code}" -eq 1 ]; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          else
            echo "docker-inputs-changed.sh failed (${code})." >&2
            exit 1
          fi

      - name: Wait for the six TAK images
        if: steps.docker.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_IF_MISSING: "false"
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: ./.github/scripts/wait-for-tak-images.sh

      - name: Confirm the published TAK images
        if: steps.docker.outputs.changed != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHECK_ONCE: "true"
          BUILD_IF_MISSING: "false"
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: ./.github/scripts/wait-for-tak-images.sh

      # The Test workflow builds the CloudTAK image when its inputs change.
      # Wait for that build instead of reading an older image or none.
      - name: Wait for the CloudTAK image
        run: ./.github/container-and-chart/cloudtak/build.sh --wait

      # Same for the PostGIS image.
      - name: Wait for the PostGIS image
        run: ./.github/container-and-chart/postgis/build.sh --wait

      - name: Install UDS CLI
        uses: defenseunicorns/setup-uds@d6add59d4c2ca789ed7c92741e91bd340b4e950b # v1.0.2
        with:
          # renovate: datasource=github-tags depName=defenseunicorns/uds-cli versioning=semver
          version: v0.39.0

      - name: Log in to GHCR
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Package the images built from this commit's inputs, not whatever
      # another branch pushed to the shared tags last.
      - name: Use this commit's CloudTAK and PostGIS images
        run: ./.github/scripts/pin-image-tags.sh

      - name: Create the dev package
        run: uds run create-dev-package --no-progress

      - name: Check the package architecture
        env:
          ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          set -euo pipefail
          package="$(ls zarf-package-takserver-"${ARCH}"-*.tar.zst)"
          # The zarf.yaml inside the archive records the build architecture.
          tar --zstd -xOf "${package}" zarf.yaml > "${RUNNER_TEMP}/zarf.yaml"
          built="$(uds zarf tools yq -r '.build.architecture' "${RUNNER_TEMP}/zarf.yaml")"
          echo "${package}: build.architecture=${built}"
          test "${built}" = "${ARCH}"
