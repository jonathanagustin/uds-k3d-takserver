name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-please:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release-created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Open the release pull request
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Releases created with GITHUB_TOKEN do not trigger another release workflow.
  # Call the publisher directly using the tag emitted by Release Please.
  publish:
    needs: release-please
    if: needs.release-please.outputs.release-created == 'true'
    # release.yaml's provenance job needs contents (release upload),
    # id-token and attestations on top of the package write.
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release.yaml
    with:
      tag: ${{ needs.release-please.outputs.tag }}

  # GITHUB_TOKEN-created releases do not emit a new release workflow run.
  # Wait for package publication/provenance, then rebuild with the new tag.
  docs:
    needs: [release-please, publish]
    if: needs.release-please.outputs.release-created == 'true' && needs.publish.result == 'success'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yaml
    with:
      release_tag: ${{ needs.release-please.outputs.tag }}
