name: Release

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      release_id:
        description: Exact draft ID emitted by Release Please (empty for public backfills)
        type: string
        default: ""
      source_sha:
        description: Exact release source SHA emitted by Release Please
        type: string
        default: ""
  # Re-publish an existing Release Please tag, for example after a failed run.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, such as v0.2.0
        required: true
        type: string
      release_id:
        description: Exact trusted draft ID for recovery (empty for public backfills)
        type: string
        default: ""
      source_sha:
        description: Exact trusted draft source SHA for recovery
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: publish-package-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  metadata:
    # GitHub denied draft visibility to the builder's read token despite ample
    # quota. Keep this coarse visibility permission away from application code.
    permissions:
      contents: write
    if: github.event_name != 'release' || (!github.event.release.prerelease && !github.event.release.draft)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      source-sha: ${{ steps.check.outputs.source-sha }}
    steps:
      - name: Checkout trusted readiness checker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          sparse-checkout: .github/test-infra/release-readiness.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Verify release metadata without API writes
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
          RELEASE_ID: ${{ inputs.release_id }}
          RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
          READINESS_MODE: check
        shell: bash
        run: |
          set -euo pipefail
          [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          CHECKED_SOURCE_SHA="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          export CHECKED_SOURCE_SHA
          python3 .github/test-infra/release-readiness.py
          echo "source-sha=${CHECKED_SOURCE_SHA}" >> "${GITHUB_OUTPUT}"

  publish:
    needs: metadata
    permissions:
      contents: read
      packages: write
      # Keyless signing uses the job's OIDC token.
      id-token: write
    if: github.event_name != 'release' || (!github.event.release.prerelease && !github.event.release.draft)
    # One package per architecture, each created on a native runner. Both
    # publish under the same OCI tag, and Zarf keeps one index entry per
    # architecture. max-parallel 1 keeps the two index updates apart.
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    name: publish (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
          fetch-depth: 0

      - name: Verify the Release Please version on main
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
          RELEASE_ID: ${{ inputs.release_id }}
          RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
          VERIFIED_SOURCE_SHA: ${{ needs.metadata.outputs.source-sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^v?([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Expected a stable Release Please tag" >&2
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          # A pre-existing tag must never redirect a new draft's package bytes.
          python3 - <<'PY_CHECK'
          import os, re, subprocess
          actual = subprocess.check_output(['git', 'rev-parse', 'HEAD']).decode().strip()
          verified = os.environ['VERIFIED_SOURCE_SHA']
          if not re.fullmatch(r'[0-9a-f]{40}', verified) or actual != verified:
              raise SystemExit('Verified release metadata source mismatch')
          identity = os.environ['RELEASE_ID']
          source = os.environ['RELEASE_SOURCE_SHA']
          if identity or source:
              valid = (re.fullmatch(r'[1-9][0-9]*', identity)
                       and re.fullmatch(r'[0-9a-f]{40}', source)
                       and actual == source)
              if not valid:
                  raise SystemExit('Release source identity mismatch')
          PY_CHECK
          git merge-base --is-ancestor HEAD origin/main
          manifest="$(python3 -c 'import json; print(json.load(open(".release-please-manifest.json"))["."])')"
          test "${version}" = "${manifest}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Install UDS CLI
        uses: defenseunicorns/setup-uds@d6add59d4c2ca789ed7c92741e91bd340b4e950b # v1.0.2
        with:
          # renovate: datasource=github-tags depName=defenseunicorns/uds-cli versioning=semver
          version: v0.41.0

      - name: Authenticate to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "${GH_TOKEN}" | uds zarf tools registry login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      - name: Free runner disk space
        run: bash .github/scripts/trim-runner.sh

      - name: Build the released Zarf package with its SBOM
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          set -euo pipefail
          uds zarf tools yq -i '.metadata.version = strenv(RELEASE_VERSION)' zarf.yaml
          uds zarf package create . --flavor upstream --architecture "${ARCH}" \
            --confirm --no-progress --features values=true \
            --set DOMAIN=uds.dev --set TAK_IMAGE_TAG=5.7-RELEASE-14

      # Keyless: Fulcio issues a short-lived certificate for this workflow's
      # identity and the signing event goes to the Rekor transparency log.
      # The SBOM is a file in the package, so the signature covers it.
      - name: Sign the package keylessly
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          set -euo pipefail
          package="zarf-package-takserver-${ARCH}-${RELEASE_VERSION}-upstream.tar.zst"
          test -s "${package}"
          uds zarf package sign "${package}" --keyless --confirm

      - name: Publish the baseline package
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          set -euo pipefail
          package="zarf-package-takserver-${ARCH}-${RELEASE_VERSION}-upstream.tar.zst"
          test -s "${package}"
          uds zarf package publish "${package}" \
            oci://ghcr.io/jonathanagustin/uds-takserver --features values=true
          reference="oci://ghcr.io/jonathanagustin/uds-takserver/takserver:${RELEASE_VERSION}-upstream"
          # inspect highlights the YAML with ANSI escape codes even when piped,
          # and yq rejects those control characters, so strip them first.
          uds zarf package inspect definition "${reference}" --architecture "${ARCH}" \
            | sed 's/\x1b\[[0-9;]*[A-Za-z]//g' > "${RUNNER_TEMP}/released-zarf.yaml"
          published_version="$(uds zarf tools yq -r '.metadata.version' "${RUNNER_TEMP}/released-zarf.yaml")"
          test "${published_version}" = "${RELEASE_VERSION}"
          # The published package has to verify against this workflow's
          # identity. A release run has a tag ref and a re-run has a branch ref.
          uds zarf package verify "${reference}" --architecture "${ARCH}" \
            --certificate-identity-regexp '^https://github\.com/jonathanagustin/(uds-k3d-takserver|uds-takserver)/\.github/workflows/release\.yaml@refs/(tags/v[0-9]+\.[0-9]+\.[0-9]+|heads/main)$' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          echo "Published upstream ${ARCH} Zarf package (includes SBOM):" >> "${GITHUB_STEP_SUMMARY}"
          echo "oci://ghcr.io/jonathanagustin/uds-takserver/takserver:${RELEASE_VERSION}-upstream" >> "${GITHUB_STEP_SUMMARY}"

  # Build provenance for the published package index, signed through
  # Sigstore with this workflow's identity. The attestation is stored with
  # the package in GHCR and in the repository's attestations, and the bundle
  # is added to the GitHub release. It runs after both architectures are in
  # the index. A draft becomes public only after verification. Verify with:
  #   gh attestation verify oci://ghcr.io/jonathanagustin/uds-takserver/takserver:<version>-upstream \
  #     --owner jonathanagustin
  # @lulaStart 16058a8d-cbfb-5553-b1aa-6b2ab45ebe17
  provenance:
    needs: [metadata, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      # The helper comes from the invoking publisher workflow, not an old tag.
      - name: Checkout trusted release publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Install UDS CLI
        uses: defenseunicorns/setup-uds@d6add59d4c2ca789ed7c92741e91bd340b4e950b # v1.0.2
        with:
          # renovate: datasource=github-tags depName=defenseunicorns/uds-cli versioning=semver
          version: v0.41.0

      # Writes the Docker credentials that both the digest lookup and the
      # attestation push read.
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read the published index digest
        id: index
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          name="ghcr.io/jonathanagustin/uds-takserver/takserver"
          digest="$(uds zarf tools registry digest "${name}:${version}-upstream")"
          [[ "${digest}" =~ ^sha256:[a-f0-9]{64}$ ]]
          {
            echo "name=${name}"
            echo "digest=${digest}"
            echo "bundle=takserver-${version}-upstream.provenance.sigstore.json"
            echo "intoto=takserver-${version}-upstream.intoto.jsonl"
          } >> "${GITHUB_OUTPUT}"

      - name: Attest build provenance
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.index.outputs.name }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      # The bundle's DSSE envelope, the signed in-toto statement, on one line.
      # That is the *.intoto.jsonl layout the SLSA GitHub generator writes,
      # and the file name Scorecard's Signed-Releases check reads as
      # provenance. The bundle keeps the certificate and the transparency log
      # entry that verification needs.
      - name: Add the provenance to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
          BUNDLE_NAME: ${{ steps.index.outputs.bundle }}
          INTOTO_NAME: ${{ steps.index.outputs.intoto }}
        shell: bash
        run: |
          set -euo pipefail
          cp "${BUNDLE_PATH}" "${RUNNER_TEMP}/${BUNDLE_NAME}"
          jq -ce 'select(.dsseEnvelope.payloadType == "application/vnd.in-toto+json") | .dsseEnvelope' \
            "${BUNDLE_PATH}" > "${RUNNER_TEMP}/${INTOTO_NAME}"
          jq -e '.payload | @base64d | fromjson | .predicateType == "https://slsa.dev/provenance/v1"' \
            "${RUNNER_TEMP}/${INTOTO_NAME}"
          gh release upload "${RELEASE_TAG}" "${RUNNER_TEMP}/${BUNDLE_NAME}" "${RUNNER_TEMP}/${INTOTO_NAME}" \
            --clobber --repo "${GITHUB_REPOSITORY}"

      # Check the attestation the way the README tells users to, against
      # the registry copy and this workflow as the signer.
      - name: Verify the provenance
        env:
          GH_TOKEN: ${{ github.token }}
          SUBJECT: ${{ steps.index.outputs.name }}@${{ steps.index.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          gh attestation verify "oci://${SUBJECT}" \
            --owner "${GITHUB_REPOSITORY_OWNER}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release.yaml"
      - name: Prepare checked application release binding
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
          RELEASE_ID: ${{ inputs.release_id }}
          RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
          CHECKED_SOURCE_SHA: ${{ needs.metadata.outputs.source-sha }}
          INDEX_DIGEST: ${{ steps.index.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/test-infra/release-binding.py prepare \
            --digest "${INDEX_DIGEST}" --metadata "${RUNNER_TEMP}/release-binding-metadata.json" \
            --index "${RUNNER_TEMP}/release-binding-index.json" > "${RUNNER_TEMP}/release-binding-predicate.json"

      - name: Attest application release binding
        id: binding
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.index.outputs.name }}
          subject-digest: ${{ steps.index.outputs.digest }}
          predicate-type: https://github.com/jonathanagustin/uds-takserver/attestations/release-binding/v1
          predicate-path: ${{ runner.temp }}/release-binding-predicate.json
          push-to-registry: true
          create-storage-record: false

      - name: Verify application release binding independently
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
          RELEASE_ID: ${{ inputs.release_id }}
          RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
          CHECKED_SOURCE_SHA: ${{ needs.metadata.outputs.source-sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/test-infra/release-binding.py verify-live \
            --metadata "${RUNNER_TEMP}/release-binding-metadata.json" \
            --index "${RUNNER_TEMP}/release-binding-index.json"

      - name: Store verified supplementary binding bundle
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
          BUNDLE_PATH: ${{ steps.binding.outputs.bundle-path }}
        shell: bash
        run: |
          set -euo pipefail
          bundle="${RUNNER_TEMP}/takserver-${RELEASE_TAG#v}-upstream.release-binding.sigstore.json"
          cp "${BUNDLE_PATH}" "${bundle}"
          gh release upload "${RELEASE_TAG}" "${bundle}" --clobber --repo "${GITHUB_REPOSITORY}"

      - name: Publish only the verified draft release
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
          RELEASE_ID: ${{ inputs.release_id }}
          RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
        run: python3 .github/test-infra/release-readiness.py
        # @lulaEnd 16058a8d-cbfb-5553-b1aa-6b2ab45ebe17
