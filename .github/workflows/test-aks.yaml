name: AKS Test

# Manual only, and off unless enabled is set. Cloud credentials are not configured.
on:
  workflow_dispatch:
    inputs:
      enabled:
        description: Create nothing. This only initializes OpenTofu for the AKS scaffold.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test-aks:
    if: ${{ inputs.enabled }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          # renovate: datasource=github-releases depName=opentofu/opentofu versioning=semver
          tofu_version: v1.13.2
          tofu_wrapper: false

      - name: Validate the AKS scaffold
        shell: bash
        run: |
          set -euo pipefail
          tofu -chdir=.github/test-infra/azure/aks init -backend=false
          tofu -chdir=.github/test-infra/azure/aks validate
