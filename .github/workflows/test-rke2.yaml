name: RKE2 Test

# Manual only, and off unless enabled is set. Cloud credentials are not configured.
on:
  workflow_dispatch:
    inputs:
      enabled:
        description: Create nothing. This only initializes OpenTofu for the RKE2 scaffold.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test-rke2:
    if: ${{ inputs.enabled }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          # renovate: datasource=github-releases depName=opentofu/opentofu versioning=semver
          tofu_version: v1.13.2
          tofu_wrapper: false

      - name: Validate the RKE2 scaffold
        shell: bash
        run: |
          set -euo pipefail
          tofu -chdir=.github/test-infra/aws/rke2 init -backend=false
          tofu -chdir=.github/test-infra/aws/rke2 validate
