name: Test

on:
  pull_request:
    types: [milestoned, opened, reopened, synchronize]
    # Doc-only changes skip this workflow. Changes under
    # .github/container-and-chart run it, so a rebuilt image is deployed and
    # tested before it merges.
    paths-ignore:
      - "**.md"
      - "**.jpg"
      - "**.png"
      - "**.gif"
      - "**.svg"
      - "docs/**"
      - "adr/**"
      - ".gitignore"
      - "LICENSE"
      - "renovate.json"
      - ".release-please-manifest.json"
      - "release-please-config.json"
      - "CODEOWNERS"
      - "SECURITY.md"

  # A run on main is the only one that saves the Zarf cache. A cache saved by a
  # pull request is scoped to that pull request and no other one can restore it.
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "**.jpg"
      - "**.png"
      - "**.gif"
      - "**.svg"
      - "docs/**"
      - "adr/**"
      - ".gitignore"
      - "LICENSE"
      - "renovate.json"
      - ".release-please-manifest.json"
      - "release-please-config.json"
      - "CODEOWNERS"
      - "SECURITY.md"

permissions:
  contents: read
  packages: read
  pull-requests: read
  id-token: write

concurrency:
  group: test-${{ github.ref }}
  # A cancelled run on main would skip its cache save.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      # wait-for-tak-images.sh builds from the upstream/takserver submodule
      # when no container run is publishing the tags.
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Only the TAK and CloudTAK sources. upstream/atak-civ is large and
      # only the ATAK workflows need it.
      - name: Check out the submodules
        run: git submodule update --init --depth 1 upstream/takserver upstream/cloudtak

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether Docker inputs changed
        id: docker
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set +e
          ./.github/scripts/docker-inputs-changed.sh
          code=$?
          set -e
          if [ "${code}" -eq 0 ]; then
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          elif [ "${code}" -eq 1 ]; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          else
            echo "docker-inputs-changed.sh failed (${code})." >&2
            exit 1
          fi

      - name: Wait for the six TAK images
        if: steps.docker.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_IF_MISSING: "true"
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: ./.github/scripts/wait-for-tak-images.sh

      - name: Confirm the published TAK images
        if: steps.docker.outputs.changed != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHECK_ONCE: "true"
          BUILD_IF_MISSING: "false"
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: ./.github/scripts/wait-for-tak-images.sh

  # CloudTAK builds on a native runner per architecture, like the TAK images.
  # Each job pushes v13.111.3-<key>-<arch>, keyed by the submodule pin and
  # the .github/container-and-chart/cloudtak tree, only when no image with
  # those inputs exists yet. cloudtak-index joins them under v13.111.3-<key>.
  # v13.111.3 itself moves only on main (see build.sh).
  cloudtak-image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    name: cloudtak-image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      # build.sh fetches only upstream/cloudtak, shallow.
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the CloudTAK image if its inputs changed
        env:
          PUSH_IMAGES: "true"
          ARCH: ${{ matrix.arch }}
        run: ./.github/container-and-chart/cloudtak/build.sh --if-changed

  # pin-image-tags.sh points the package at v13.111.3-<key>. Zarf pulls the
  # entry for the package architecture.
  cloudtak-index:
    needs: cloudtak-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Write the multi-arch CloudTAK index
        run: ./.github/container-and-chart/cloudtak/build.sh --merge

  # Each job pushes 15-3.4-<key>-<arch>, keyed by the
  # .github/container-and-chart/postgis tree, only when no image with that
  # tree exists yet. postgis-index joins them under 15-3.4-<key>. 15-3.4, the
  # tag zarf.yaml and the charts name, moves only on main.
  postgis-image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    name: postgis-image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the PostGIS image if its inputs changed
        env:
          PUSH_IMAGES: "true"
          ARCH: ${{ matrix.arch }}
        run: ./.github/container-and-chart/postgis/build.sh --if-changed

  postgis-index:
    needs: postgis-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Write the multi-arch PostGIS index
        run: ./.github/container-and-chart/postgis/build.sh --merge

  check-flavor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: test-flavor
        uses: defenseunicorns/uds-common/.github/actions/test-flavor@320e247b590fbdcf25a1f01e9b00db88bdd8a448 # v1.32.1
        id: test-flavor
    outputs:
      upgrade-flavors: ${{ steps.test-flavor.outputs.upgrade-flavors }}

  # Install and upgrade do not need each other, so they run at the same time.
  # Upgrade must resolve a released baseline; the first-release bootstrap is reported explicitly.
  # The install path runs once per architecture on a native runner. The
  # slim core checkpoint and core-base are published for amd64 and arm64.
  # Upgrade stays on amd64 until a released arm64 package exists.
  validate-install:
    needs: [check-flavor, images, cloudtak-index, postgis-index]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ${{ vars.TEST_RUNNER || 'ubuntu-latest' }}
          - arch: arm64
            runner: ubuntu-24.04-arm
    name: validate-install (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    permissions:
      actions: write
      contents: read
      packages: read
      pull-requests: read
      id-token: write
    env:
      TEST_TYPE: install
      TEST_FLAVOR: upstream
    steps: &validate-steps
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Check upgrade test contracts
        if: env.TEST_TYPE == 'upgrade'
        run: python3 -B -m unittest discover -s tests -p 'test_upgrade_*.py' -v

      - name: Resolve the last released upgrade baseline
        id: baseline
        if: env.TEST_TYPE == 'upgrade'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tests/upgrade-baseline.py --output "${RUNNER_TEMP}/tak-upgrade-baseline.json"

      - name: Require the PR images
        if: (env.TEST_TYPE == 'install' || steps.baseline.outputs.available == 'true') && (env.TEST_TYPE == 'upgrade')
        env:
          IMAGE_RESULT: ${{ needs.images.result }}
        run: test "${IMAGE_RESULT}" = success

      - name: Install Docker Compose
        if: (env.TEST_TYPE == 'install' || steps.baseline.outputs.available == 'true')
        uses: docker/setup-compose-action@54042514f505b273907334ae2b9cdbb9a0213c1a # v2.4.0
        with:
          version: v5.6.0

      - name: Install UDS CLI
        if: (env.TEST_TYPE == 'install' || steps.baseline.outputs.available == 'true')
        uses: defenseunicorns/setup-uds@d6add59d4c2ca789ed7c92741e91bd340b4e950b # v1.0.2
        with:
          version: v0.39.0

      - name: Trim the runner
        if: (env.TEST_TYPE == 'install' || steps.baseline.outputs.available == 'true') && (vars.TEST_RUNNER == '' || vars.TEST_RUNNER == 'ubuntu-latest' || runner.arch == 'ARM64')
        run: ./.github/scripts/trim-runner.sh

      # Restore only. Install and upgrade run together, and a second save of
      # the same key fails the job. Only a run on main saves, after the deploy.
      - name: Restore the Zarf cache
        if: (env.TEST_TYPE == 'install' || steps.baseline.outputs.available == 'true')
        id: zarf-cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .cache/zarf-cache
          key: zarf-cache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('zarf.yaml', 'common/zarf.yaml', 'values/**/*.yaml', 'bundle/**/*.yaml') }}
          restore-keys: |
            zarf-cache-${{ runner.os }}-${{ runner.arch }}-

      - name: Point Zarf at the restored cache
        if: (env.TEST_TYPE == 'install' || steps.baseline.outputs.available == 'true')
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/.cache/zarf-cache"
          rm -rf "${HOME}/.zarf-cache"
          ln -s "${GITHUB_WORKSPACE}/.cache/zarf-cache" "${HOME}/.zarf-cache"

      - name: Environment setup
        if: (env.TEST_TYPE == 'install' || steps.baseline.outputs.available == 'true')
        run: |
          echo "MARU_AUTH=\"{\"raw.githubusercontent.com\": \"${{ secrets.GITHUB_TOKEN }}\"}\"" >> "$GITHUB_ENV"
          uds run actions:setup-environment \
          --set REGISTRY1_USERNAME="${{ secrets.IRON_BANK_ROBOT_USERNAME }}" \
          --set REGISTRY1_PASSWORD="${{ secrets.IRON_BANK_ROBOT_PASSWORD }}" \
          --set GH_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
          --set RAPIDFORT_USERNAME="${{ secrets.RAPIDFORT_USERNAME }}" \
          --set RAPIDFORT_PASSWORD="${{ secrets.RAPIDFORT_PASSWORD }}" \
          --set CHAINGUARD_IDENTITY="${{ secrets.CHAINGUARD_IDENTITY }}"
        shell: bash

      # Another branch can build different TAK, CloudTAK or PostGIS inputs
      # while this job runs. The keyed tags hold only this commit's build.
      - name: Use this commit's TAK, CloudTAK and PostGIS images
        if: (env.TEST_TYPE == 'install' || steps.baseline.outputs.available == 'true')
        run: ./.github/scripts/pin-image-tags.sh

      - name: Test
        if: (env.TEST_TYPE == 'install' || steps.baseline.outputs.available == 'true') && (env.TEST_TYPE == 'install')
        run: uds run actions:test-deploy --set FLAVOR="${{ env.TEST_FLAVOR }}" --set TYPE="${{ env.TEST_TYPE }}" --set OPTIONS="" --set LICENSE_KEY="${{ secrets.LICENSE_KEY }}"
        shell: bash
        # A normal run takes about 25 minutes. Without this a hang runs into the
        # 180 minute job limit, which also cancels the log and dump steps below.
        timeout-minutes: 90

      - name: Upgrade from the released package and check retained state
        if: (env.TEST_TYPE == 'install' || steps.baseline.outputs.available == 'true') && (env.TEST_TYPE == 'upgrade')
        run: bash tests/upgrade.sh "${RUNNER_TEMP}/tak-upgrade-baseline.json"
        timeout-minutes: 90

      - name: Debug Output
        if: (env.TEST_TYPE == 'install' || steps.baseline.outputs.available == 'true') && (always())
        run: uds run actions:debug-output
        shell: bash

      # debug-output has events but no container logs. A CloudTAK container
      # that restarts during the chart install shows up here.
      - name: CloudTAK pod details
        if: failure()
        shell: bash
        run: |
          k() { uds zarf tools kubectl "$@"; }
          if ! k get namespace cloudtak >/dev/null 2>&1; then
            echo "namespace cloudtak does not exist"
            exit 0
          fi
          k get pods -n cloudtak -o wide || true
          k describe pods -n cloudtak || true
          for pod in $(k get pods -n cloudtak -o name); do
            for c in $(k get "${pod}" -n cloudtak -o jsonpath='{.spec.containers[*].name}'); do
              echo "::group::${pod} ${c}"
              k logs "${pod}" -n cloudtak -c "${c}" --tail=200 || true
              echo "--- previous"
              k logs "${pod}" -n cloudtak -c "${c}" --previous --tail=200 || true
              echo "::endgroup::"
            done
          done

      - name: Save the Zarf cache
        if: (env.TEST_TYPE == 'install' || steps.baseline.outputs.available == 'true') && (success() && github.event_name == 'push' && env.TEST_TYPE == 'install' && steps.zarf-cache.outputs.cache-hit != 'true')
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .cache/zarf-cache
          key: zarf-cache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('zarf.yaml', 'common/zarf.yaml', 'values/**/*.yaml', 'bundle/**/*.yaml') }}

      - name: Node memory
        if: (env.TEST_TYPE == 'install' || steps.baseline.outputs.available == 'true') && (failure())
        run: ./.github/scripts/dump-memory.sh

      - name: Save logs
        if: (env.TEST_TYPE == 'install' || steps.baseline.outputs.available == 'true') && (always())
        run: uds run actions:save-logs
        shell: bash
        timeout-minutes: 2

      - name: Generate unique suffix
        id: uniq
        if: (env.TEST_TYPE == 'install' || steps.baseline.outputs.available == 'true') && (always())
        shell: bash
        run: |
          # shellcheck disable=SC3028
          echo "suffix=${RANDOM}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: (env.TEST_TYPE == 'install' || steps.baseline.outputs.available == 'true') && (always())
        timeout-minutes: 2
        with:
          name: debug-log-${{ env.TEST_TYPE }}-${{ env.TEST_FLAVOR }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ runner.arch }}-${{ steps.uniq.outputs.suffix }}
          path: |
            /tmp/zarf-*.log
            /tmp/uds-*.log
            /tmp/maru-*.log
            /tmp/debug-*.log
            /tmp/uds-containerd-logs
            /tmp/k3d-uds-*.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: (env.TEST_TYPE == 'install' || steps.baseline.outputs.available == 'true') && (always())
        with:
          name: playwright-report-${{ env.TEST_TYPE }}-${{ env.TEST_FLAVOR }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ runner.arch }}-${{ steps.uniq.outputs.suffix }}
          path: |
            tests/.playwright/reports
            tests/.playwright/screenshots
          retention-days: 30
          if-no-files-found: ignore

  validate-upgrade:
    needs: [images, cloudtak-index, postgis-index]
    # Run baseline discovery even when image preparation fails, never a silent skip.
    if: ${{ !cancelled() }}
    runs-on: ${{ vars.TEST_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 180
    permissions:
      actions: write
      contents: read
      packages: read
      pull-requests: read
      id-token: write
    env:
      TEST_TYPE: upgrade
      TEST_FLAVOR: upstream
    steps: *validate-steps

  verify-test:
    runs-on: ubuntu-latest
    needs: [validate-install, validate-upgrade]
    if: always()
    steps:
      - name: Check validate result
        run: |
          echo "install result: ${{ needs.validate-install.result }}"
          echo "upgrade result: ${{ needs.validate-upgrade.result }}"

          if [ "${{ needs.validate-install.result }}" != "success" ]; then
            echo "Install failed."
            exit 1
          fi

          if [ "${{ needs.validate-upgrade.result }}" != "success" ]; then
            echo "Upgrade failed."
            exit 1
          fi

          echo "All tests passed successfully!"
