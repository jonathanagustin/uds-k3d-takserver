name: Test

on:
  workflow_dispatch:
    inputs:
      trust_bundle:
        description: Install private gateway PKI and verify live CA rotation and SSO
        type: boolean
        default: false
      diagnostic_case:
        description: Select focused runtime evidence (not full acceptance)
        type: choice
        default: none
        options: [none, upgrade-amd64, pg15-amd64, pg15-both, airgap-amd64]
  pull_request:
    types: [opened, reopened, synchronize]
    # Anything not listed is relevant and starts the install and upgrade
    # matrices, including charts, Pepr, network policies, values, bundles,
    # tasks, image builds, dependency pins, and the scripts those jobs run.
    # The list is .github/scripts/runtime-paths.sh. A chart SVG is not docs.
    paths-ignore: &ci-ignore
      - "docs/**"
      - "adr/**"
      - "docs-site/**"
      - "assets/**"
      - "atak/**"
      - "bench/**"
      - "demo/**"
      - "upstream/atak-civ"
      - "takx/**"
      - "upstream/takx"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
      - ".github/test-infra/**"
      - ".github/actionlint.yaml"
      - ".github/workflows/docs.yaml"
      - ".github/workflows/lint.yaml"
      - ".github/workflows/commitlint.yaml"
      - ".github/workflows/codeql.yaml"
      - ".github/workflows/dependency-review.yaml"
      - ".github/workflows/scorecard.yaml"
      - ".github/workflows/scorecard-analysis.yaml"
      - ".github/workflows/release-please.yaml"
      - ".github/workflows/release.yaml"
      - ".github/workflows/charts.yaml"
      - ".github/scripts/publish-charts.py"
      - ".github/workflows/cosign.yaml"
      - ".github/workflows/demo.yaml"
      - ".github/workflows/benchmark.yaml"
      - ".github/workflows/full-core.yaml"
      - ".github/workflows/unit-tests.yaml"
      - ".github/workflows/mutation.yaml"
      - ".github/workflows/ui-reel.yaml"
      - ".github/workflows/atak.yaml"
      - ".github/workflows/atak-vm.yaml"
      - ".github/workflows/atak-e2e.yaml"
      - ".github/workflows/mirror-checkpoint.yaml"
      - ".github/workflows/migrate-packages.yaml"
      - ".github/scripts/migrate-ghcr.py"
      - ".github/workflows/test-aks.yaml"
      - ".github/workflows/test-eks.yaml"
      - ".github/workflows/test-rke2.yaml"
      - ".github/workflows/scan.yaml"
      - ".github/scripts/full-core-paths.sh"
      - ".github/scripts/runtime-paths.sh"
      - ".github/scripts/install-reuse-shadow.py"
      - ".github/scripts/ci-concurrency.sh"
      - ".gitignore"
      - ".gitleaks.toml"
      - ".hadolint.yaml"
      - ".yamllint"
      - ".license_config.yaml"
      - ".codespellrc"
      - ".adr-dir"
      - "LICENSE"
      - "CODEOWNERS"
      - "README.md"
      - "SECURITY.md"
      - "CONTRIBUTING.md"
      - "CHANGELOG.md"
      - "renovate.json"
      - ".release-please-manifest.json"
      - "release-please-config.json"
      - "commitlint.config.js"
      - "hk.pkl"
      - "tests/demo/**"
      - "tests/test_*"
      - "tests/playwright.demo.config.ts"
      - "pepr/capabilities/*.test.ts"
      - "pepr/mutation/**"
      - "pepr/scripts/coverage-summary.mjs"

  # The same install runs again after a relevant pull request merges.
  push:
    branches: [main]
    paths-ignore: *ci-ignore

permissions:
  contents: read
  packages: read
  pull-requests: read
  id-token: write

concurrency:
  # A newer pull request push or main push cancels the older run of this
  # workflow on that ref. Schedule and workflow_dispatch each get their own
  # run id: they are not cancelled, and they do not wait behind a push.
  # Release and Demo Video are not in this group. A finished run is kept.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.run_id || 'gate' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  image-keys:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      cloudtak: ${{ steps.keys.outputs.cloudtak }}
      postgis: ${{ steps.keys.outputs.postgis }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve immutable image keys
        id: keys
        run: |
          echo "cloudtak=$(./.github/container-and-chart/cloudtak/build.sh --tag)" >> "$GITHUB_OUTPUT"
          echo "postgis=$(./.github/container-and-chart/postgis/build.sh --tag)" >> "$GITHUB_OUTPUT"

  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      # wait-for-tak-images.sh builds from the upstream/takserver submodule
      # when no container run is publishing the tags.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Only the TAK and CloudTAK sources. upstream/atak-civ is large and
      # only the ATAK workflows need it.
      - name: Check out the submodules
        run: git submodule update --init --depth 1 upstream/takserver upstream/cloudtak

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether Docker inputs changed
        id: docker
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set +e
          ./.github/scripts/docker-inputs-changed.sh
          code=$?
          set -e
          if [ "${code}" -eq 0 ]; then
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          elif [ "${code}" -eq 1 ]; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          else
            echo "docker-inputs-changed.sh failed (${code})." >&2
            exit 1
          fi

      - name: Wait for the six TAK images
        if: steps.docker.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_IF_MISSING: "true"
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: ./.github/scripts/wait-for-tak-images.sh

      - name: Confirm the published TAK images
        if: steps.docker.outputs.changed != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHECK_ONCE: "true"
          BUILD_IF_MISSING: "false"
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: ./.github/scripts/wait-for-tak-images.sh

  # CloudTAK builds on a native runner per architecture, like the TAK images.
  # Each job pushes <version>-<key>-<arch>, keyed by the submodule pin and
  # the .github/container-and-chart/cloudtak tree, only when no image with
  # those inputs exists yet. cloudtak-index joins them under <version>-<key>.
  # <version> itself moves only on main (see build.sh).
  cloudtak-image:
    needs: image-keys
    # Shared by Test and the dedicated image workflow. Recheck the tag only
    # after this key's previous producer has finished. FIFO retains waiters.
    concurrency:
      group: image-cloudtak-${{ needs.image-keys.outputs.cloudtak }}-${{ matrix.arch }}
      queue: max
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    name: cloudtak-image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      # build.sh fetches only upstream/cloudtak, shallow.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the CloudTAK image if its inputs changed
        env:
          PUSHED_REFS: ${{ runner.temp }}/pushed-refs.txt
          PUSH_IMAGES: "true"
          ARCH: ${{ matrix.arch }}
        run: ./.github/container-and-chart/cloudtak/build.sh --if-changed

      - name: Attest the pushed images
        uses: ./.github/actions/attest-images
        with:
          refs-file: ${{ runner.temp }}/pushed-refs.txt

  # pin-image-tags.sh points the package at <version>-<key>. Zarf pulls the
  # entry for the package architecture.
  cloudtak-index:
    # Shared by Test and the dedicated image workflow. Recheck the tag only
    # after this key's previous producer has finished. FIFO retains waiters.
    concurrency:
      group: image-cloudtak-${{ needs.image-keys.outputs.cloudtak }}-index
      queue: max
      cancel-in-progress: false
    timeout-minutes: 15
    needs: [image-keys, cloudtak-image]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Write the multi-arch CloudTAK index
        env:
          PUSHED_REFS: ${{ runner.temp }}/pushed-refs.txt
        run: ./.github/container-and-chart/cloudtak/build.sh --merge

      - name: Attest the pushed images
        uses: ./.github/actions/attest-images
        with:
          refs-file: ${{ runner.temp }}/pushed-refs.txt
          include-platforms: "false"

  # Each job pushes 18-3.6-<key>-<arch>, keyed by the
  # .github/container-and-chart/postgis tree, only when no image with that
  # tree exists yet. postgis-index joins them under 18-3.6-<key>. 18-3.6, the
  # tag zarf.yaml and the charts name, moves only on main.
  postgis-image:
    needs: image-keys
    # Shared by Test and the dedicated image workflow. Recheck the tag only
    # after this key's previous producer has finished. FIFO retains waiters.
    concurrency:
      group: image-postgis-${{ needs.image-keys.outputs.postgis }}-${{ matrix.arch }}
      queue: max
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    name: postgis-image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the PostGIS image if its inputs changed
        env:
          PUSHED_REFS: ${{ runner.temp }}/pushed-refs.txt
          PUSH_IMAGES: "true"
          ARCH: ${{ matrix.arch }}
        run: ./.github/container-and-chart/postgis/build.sh --if-changed

      - name: Check a PostgreSQL 15 database upgrades
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          tag="$(./.github/container-and-chart/postgis/build.sh --tag)"
          ./.github/container-and-chart/postgis/smoke.sh \
            "ghcr.io/jonathanagustin/uds-takserver/postgis:${tag}-${ARCH}"

      - name: Attest the pushed images
        uses: ./.github/actions/attest-images
        with:
          refs-file: ${{ runner.temp }}/pushed-refs.txt

  postgis-index:
    # Shared by Test and the dedicated image workflow. Recheck the tag only
    # after this key's previous producer has finished. FIFO retains waiters.
    concurrency:
      group: image-postgis-${{ needs.image-keys.outputs.postgis }}-index
      queue: max
      cancel-in-progress: false
    timeout-minutes: 15
    needs: [image-keys, postgis-image]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Write the multi-arch PostGIS index
        env:
          PUSHED_REFS: ${{ runner.temp }}/pushed-refs.txt
        run: ./.github/container-and-chart/postgis/build.sh --merge

      - name: Attest the pushed images
        uses: ./.github/actions/attest-images
        with:
          refs-file: ${{ runner.temp }}/pushed-refs.txt
          include-platforms: "false"

  check-flavor:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Plan validation mode
        id: validation-mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          TRUST_BUNDLE: ${{ inputs.trust_bundle && 'true' || 'false' }}
          DIAGNOSTIC_CASE: ${{ inputs.diagnostic_case || 'none' }}
          # Temporary older-kernel comparison for #300; keep the override.
          TEST_RUNNER: ${{ vars.TEST_RUNNER || 'ubuntu-22.04' }}
        run: python3 .github/scripts/test-validation-mode.py plan

      - name: test-flavor
        uses: defenseunicorns/uds-common/.github/actions/test-flavor@9cb4ebfd9f9a5efd1dbc454bf3aae843d0b57b9f # v1.32.2
        id: test-flavor
    outputs:
      upgrade-flavors: ${{ steps.test-flavor.outputs.upgrade-flavors }}
      install-matrix: ${{ steps.validation-mode.outputs.install-matrix }}
      upgrade-matrix: ${{ steps.validation-mode.outputs.upgrade-matrix }}
      pg15-matrix: ${{ steps.validation-mode.outputs.pg15-matrix }}
      diagnostic-case: ${{ steps.validation-mode.outputs.diagnostic-case }}

  # Install and upgrade do not need each other, so they run at the same time.
  # Upgrade must resolve a released baseline; the first-release bootstrap is reported explicitly.
  # The install and upgrade paths run once per architecture on a native
  # runner. The slim core checkpoints (1.15.0 and 1.16.0), core-base, and
  # every released takserver package from 0.6.0 on are published for amd64
  # and arm64.
  validate-install:
    needs: [check-flavor, images, cloudtak-index, postgis-index]
    if: ${{ needs.check-flavor.outputs.diagnostic-case == 'none' || needs.check-flavor.outputs.diagnostic-case == 'airgap-amd64' }}
    strategy:
      fail-fast: false
      # A trust-only manual trial needs both native installs, not another
      # airgap acceptance. A focused airgap diagnostic selects only that AMD
      # offline row. All ordinary events retain the three-entry matrix.
      matrix: ${{ fromJSON(needs.check-flavor.outputs.install-matrix) }}
    name: validate-install (${{ matrix.arch }}${{ matrix.airgap && ', airgap' || '' }})
    runs-on: ${{ matrix.runner }}
    # A healthy install finishes in about 20 minutes. This job limit is what
    # stops a step whose own timeout does not, such as actions/upload-artifact.
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && inputs.trust_bundle && 120 || 60 }}
    permissions:
      actions: read
      contents: read
      packages: read
      pull-requests: read
      id-token: write
      attestations: write
    env:
      TEST_TYPE: install
      AIRGAP_TEST: ${{ matrix.airgap && 'true' || 'false' }}
      # Pull the Package workflow's build (same key) instead of creating it.
      # Fork pull requests cannot publish one, so they create at once.
      DEV_PACKAGE_WAIT_SECONDS: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && '600' || '0' }}
      DEV_PACKAGE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      GH_TOKEN: ${{ github.token }}
      TEST_FLAVOR: upstream
    steps: &validate-steps
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up test Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          check-latest: false

      - name: Verify test Python before cluster work
        run: python3 -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version; print(sys.version)'

      # Capture the real synthetic/branch checkout before image pinning edits files.
      # Forks, trust and focused diagnostics omit this optional evidence.
      - name: Capture install receipt source
        if: env.TEST_TYPE == 'install' && needs.check-flavor.outputs.diagnostic-case == 'none' && !(github.event_name == 'workflow_dispatch' && inputs.trust_bundle) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        timeout-minutes: 1
        continue-on-error: true
        env:
          RECEIPT_DIAGNOSTIC: ${{ needs.check-flavor.outputs.diagnostic-case }}
        run: timeout --kill-after=2s 20s python3 -B .github/scripts/collect-install-receipt.py capture

      - name: Record the runner image
        run: echo "::notice::runner arch=$(uname -m) kernel=$(uname -r) ImageOS=${ImageOS:-unknown} ImageVersion=${ImageVersion:-unknown}"

      # ubuntu-26.04 runners boot with the kernel's inotify limits (128
      # instances) because the image's /etc/sysctl.conf is not applied
      # (actions/runner-images#15108). The k3d node shares those limits, and
      # once they run out istio-cni-node cannot restart ("couldn't initialize
      # inotify: too many open files"), so new pods get no network. These are
      # the values the image means to set.
      - name: Raise inotify limits
        run: |
          sudo sysctl -w fs.inotify.max_user_instances=1280 fs.inotify.max_user_watches=655360

      - name: Check upgrade test contracts
        if: env.TEST_TYPE == 'upgrade'
        run: python3 -B -m unittest discover -s tests -p 'test_upgrade_*.py' -v

      - name: Resolve the last released upgrade baseline
        id: baseline
        if: env.TEST_TYPE == 'upgrade'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tests/upgrade-baseline.py --output "${RUNNER_TEMP}/tak-upgrade-baseline.json"

      - name: Require the PR images
        if: (env.TEST_TYPE == 'install' || steps.baseline.outputs.available == 'true') && (env.TEST_TYPE == 'upgrade')
        env:
          IMAGE_RESULT: ${{ needs.images.result }}
        run: test "${IMAGE_RESULT}" = success

      # Toolchain deletes do not need Docker. On the runner that still had
      # them (run 39686333898) Android alone took 136s of the 244s amd64
      # trim, so this starts while Compose and the UDS CLI install.
      - name: Start trimming the runner
        if: (env.TEST_TYPE == 'install' || steps.baseline.outputs.available == 'true') && (vars.TEST_RUNNER == '' || vars.TEST_RUNNER == 'ubuntu-22.04' || vars.TEST_RUNNER == 'ubuntu-24.04' || vars.TEST_RUNNER == 'ubuntu-26.04' || runner.arch == 'ARM64')
        run: ./.github/scripts/trim-runner.sh start
        env:
          TRIM_SKIP_ABOVE_GB: "60"

      - name: Install Docker Compose
        if: (env.TEST_TYPE == 'install' || steps.baseline.outputs.available == 'true')
        uses: docker/setup-compose-action@54042514f505b273907334ae2b9cdbb9a0213c1a # v2.4.0
        with:
          version: v5.7.0

      - name: Install UDS CLI
        if: (env.TEST_TYPE == 'install' || steps.baseline.outputs.available == 'true')
        uses: defenseunicorns/setup-uds@d6add59d4c2ca789ed7c92741e91bd340b4e950b # v1.0.2
        with:
          # renovate: datasource=github-tags depName=defenseunicorns/uds-cli versioning=semver
          version: v0.41.0

      - name: Trim the runner
        if: (env.TEST_TYPE == 'install' || steps.baseline.outputs.available == 'true') && (vars.TEST_RUNNER == '' || vars.TEST_RUNNER == 'ubuntu-22.04' || vars.TEST_RUNNER == 'ubuntu-24.04' || vars.TEST_RUNNER == 'ubuntu-26.04' || runner.arch == 'ARM64')
        run: ./.github/scripts/trim-runner.sh finish
        env:
          # The test uses about 30 GB (see "Disk use after the test"), so a
          # runner with this much free needs no deletes. Run 40174810574 had
          # 86 GB free on amd64 and 108 GB free on arm64, so this skipped.
          TRIM_SKIP_ABOVE_GB: "60"

      # No Actions cache for ~/.zarf-cache. On 2026-10-25 the entries were
      # 4.28 GB (amd64) and 4.11 GB (arm64), and a second arm64 key put the
      # repo at 14.6 GB of the 10 GB limit, so the arm64 prefix missed
      # (run 40174810574). The amd64 hit took 32s to unpack. The miss saved
      # the same images in about 9s. The ATAK e2e job keeps the 5.5 GB slim
      # checkpoint in the Actions cache, which needs the room.
      - name: Environment setup
        if: (env.TEST_TYPE == 'install' || steps.baseline.outputs.available == 'true')
        run: |
          echo "MARU_AUTH=\"{\"raw.githubusercontent.com\": \"${{ secrets.GITHUB_TOKEN }}\"}\"" >> "$GITHUB_ENV"
          uds run actions:setup-environment \
          --set REGISTRY1_USERNAME="${{ secrets.IRON_BANK_ROBOT_USERNAME }}" \
          --set REGISTRY1_PASSWORD="${{ secrets.IRON_BANK_ROBOT_PASSWORD }}" \
          --set GH_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
          --set RAPIDFORT_USERNAME="${{ secrets.RAPIDFORT_USERNAME }}" \
          --set RAPIDFORT_PASSWORD="${{ secrets.RAPIDFORT_PASSWORD }}" \
          --set CHAINGUARD_IDENTITY="${{ secrets.CHAINGUARD_IDENTITY }}"
        shell: bash

      # Another branch can build different TAK, CloudTAK or PostGIS inputs
      # while this job runs. The keyed tags hold only this commit's build.
      - name: Use this commit's TAK, CloudTAK and PostGIS images
        if: (env.TEST_TYPE == 'install' || steps.baseline.outputs.available == 'true')
        run: ./.github/scripts/pin-image-tags.sh

      - name: Capture pinned install inputs
        if: env.TEST_TYPE == 'install' && env.INSTALL_RECEIPT_METADATA == 'true'
        continue-on-error: true
        timeout-minutes: 1
        env:
          RECEIPT_DIAGNOSTIC: ${{ needs.check-flavor.outputs.diagnostic-case }}
        run: timeout --kill-after=2s 40s python3 -B .github/scripts/collect-install-receipt.py pinned

      - name: Prepare private gateway baseline
        id: trust-fixture
        if: github.event_name == 'workflow_dispatch' && inputs.trust_bundle && env.TEST_TYPE == 'install' && env.AIRGAP_TEST != 'true'
        timeout-minutes: 2
        run: uds zarf tools yq -o=json '.' bundle/uds-config.yaml | python3 tests/prepare-trust-fixture.py prepare --parent "${RUNNER_TEMP}"

      - name: Install with the private gateway CA
        if: github.event_name == 'workflow_dispatch' && inputs.trust_bundle && env.TEST_TYPE == 'install' && env.AIRGAP_TEST != 'true'
        timeout-minutes: 40
        env:
          PRIVATE_CONFIG: ${{ steps.trust-fixture.outputs.config }}
          SSL_CERT_FILE: ${{ steps.trust-fixture.outputs.host-ca }}
          CURL_CA_BUNDLE: ${{ steps.trust-fixture.outputs.host-ca }}
          REQUESTS_CA_BUNDLE: ${{ steps.trust-fixture.outputs.host-ca }}
          NODE_EXTRA_CA_CERTS: ${{ steps.trust-fixture.outputs.ca }}
        run: uds run test-install --set FLAVOR="${{ env.TEST_FLAVOR }}" --set TEST_BUNDLE_CONFIG="${PRIVATE_CONFIG}" --no-progress

      - name: Test
        id: install-execution
        if: (env.TEST_TYPE == 'install' || steps.baseline.outputs.available == 'true') && (env.TEST_TYPE == 'install') && env.AIRGAP_TEST != 'true' && !(github.event_name == 'workflow_dispatch' && inputs.trust_bundle)
        run: uds run actions:test-deploy --set FLAVOR="${{ env.TEST_FLAVOR }}" --set TYPE="${{ env.TEST_TYPE }}" --set OPTIONS="" --set LICENSE_KEY="${{ secrets.LICENSE_KEY }}"
        shell: bash
        # A normal install test takes about 20 minutes. This fires before the
        # job limit so the log and dump steps below still run.
        timeout-minutes: 40

      - name: Install and test without node internet egress
        id: airgap-execution
        if: env.TEST_TYPE == 'install' && env.AIRGAP_TEST == 'true'
        run: uds run test-airgap --set FLAVOR=upstream --no-progress
        timeout-minutes: 50

      # A killed shell cannot run its EXIT trap. The runner's Docker access
      # is unaffected, so this retries namespace-scoped cleanup on cancellation.
      - name: Restore airgap node egress
        id: airgap-restore
        if: always() && env.AIRGAP_TEST == 'true'
        run: python3 .github/scripts/node-airgap.py restore --state "${RUNNER_TEMP}/tak-airgap-state.json"
        timeout-minutes: 2

      - name: Verify both current agent replicas after focused airgap
        if: github.event_name == 'workflow_dispatch' && needs.check-flavor.outputs.diagnostic-case == 'airgap-amd64' && steps.airgap-execution.outcome == 'success' && steps.airgap-restore.outcome == 'success'
        timeout-minutes: 2
        run: python3 tests/upgrade-agent-gate/live-health.py --require-two-replicas

      - name: Verify CA bundle rotation and live SSO
        if: github.event_name == 'workflow_dispatch' && inputs.trust_bundle && env.TEST_TYPE == 'install' && env.AIRGAP_TEST != 'true'
        timeout-minutes: 65
        env:
          SSL_CERT_FILE: ${{ steps.trust-fixture.outputs.host-ca }}
          CURL_CA_BUNDLE: ${{ steps.trust-fixture.outputs.host-ca }}
          REQUESTS_CA_BUNDLE: ${{ steps.trust-fixture.outputs.host-ca }}
          NODE_EXTRA_CA_CERTS: ${{ steps.trust-fixture.outputs.ca }}
        run: python3 -B tests/trust-bundle-live.py --ui

      - name: Upgrade from the released package and check retained state
        if: (env.TEST_TYPE == 'install' || steps.baseline.outputs.available == 'true') && (env.TEST_TYPE == 'upgrade')
        run: bash tests/upgrade.sh "${RUNNER_TEMP}/tak-upgrade-baseline.json"
        # A normal upgrade takes about 30 minutes. This fires before the job
        # limit so the log and dump steps below still run.
        timeout-minutes: 55

      # Probe before any diagnostics that call Docker or Kubernetes. A routing
      # timeout skips those calls; local sanitized logs are still printed.
      - name: Check for the runner network wedge
        id: runner-wedge
        if: failure()
        # The script stops itself at 20 seconds and exits 0. This limit only
        # covers that wrapper. A hang here is not the install failure.
        timeout-minutes: 2
        run: ./.github/scripts/runner-wedge-probe.sh || true

      - name: Capture agent availability after failed install
        if: failure() && env.TEST_TYPE == 'install' && steps.runner-wedge.outputs.network-stalled != 'true'
        timeout-minutes: 2
        continue-on-error: true
        run: ./tests/upgrade-agent-diagnostics.sh install

      # The trim step deletes toolchains to keep disk headroom. This is the other
      # half of that number: how much of the disk the test used by its end.
      # A wedged Docker daemon after a failed cluster start can make
      # "docker system df" hang, so bound it.
      - name: Disk use after the test
        if: always() && steps.runner-wedge.outputs.network-stalled != 'true'
        timeout-minutes: 2
        shell: bash
        run: |
          df -h /
          sudo timeout 60 docker system df || true

      - name: Debug Output
        if: (env.TEST_TYPE == 'install' || steps.baseline.outputs.available == 'true') && (always()) && steps.runner-wedge.outputs.network-stalled != 'true'
        run: uds run actions:debug-output
        timeout-minutes: 3
        shell: bash

      # debug-output has events but no container logs. A CloudTAK container
      # that restarts during the chart install shows up here.

      - name: CloudTAK pod details
        if: failure() && steps.runner-wedge.outputs.network-stalled != 'true'
        timeout-minutes: 3
        shell: bash
        run: |
          k() { timeout 30 uds zarf tools kubectl "$@"; }
          if ! k get namespace cloudtak >/dev/null 2>&1; then
            echo "namespace cloudtak does not exist"
            exit 0
          fi
          k get pods -n cloudtak -o wide || true
          k describe pods -n cloudtak | .github/scripts/redact-then-filter.sh || echo "omitted unsanitizable pod description"
          for pod in $(k get pods -n cloudtak -o name); do
            for c in $(k get "${pod}" -n cloudtak -o jsonpath='{.spec.containers[*].name}'); do
              echo "::group::${pod} ${c}"
              k logs "${pod}" -n cloudtak -c "${c}" 2>/dev/null | .github/scripts/redact-then-filter.sh --tail 200 || echo "omitted unsanitizable container log"
              echo "--- previous"
              k logs "${pod}" -n cloudtak -c "${c}" --previous 2>/dev/null | .github/scripts/redact-then-filter.sh --tail 200 || echo "omitted unsanitizable container log"
              echo "::endgroup::"
            done
          done

      - name: Node memory
        if: (env.TEST_TYPE == 'install' || steps.baseline.outputs.available == 'true') && (failure()) && steps.runner-wedge.outputs.network-stalled != 'true'
        run: ./.github/scripts/dump-memory.sh
        # A dead API server can hang kubectl; later always() steps still run.
        timeout-minutes: 5

      - name: Save logs
        if: (env.TEST_TYPE == 'install' || steps.baseline.outputs.available == 'true') && (always()) && steps.runner-wedge.outputs.network-stalled != 'true'
        run: uds run actions:save-logs
        shell: bash
        timeout-minutes: 2

      - name: Stage sanitized logs
        id: sanitize
        if: (env.TEST_TYPE == 'install' || steps.baseline.outputs.available == 'true') && !cancelled()
        # Copies into a new directory and redacts there. ok=true only if that
        # script exits 0. A timeout or cancel leaves ok unset, so the uploads
        # below do not run and the raw /tmp logs are not published.
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          dest="${RUNNER_TEMP}/sanitized-logs"
          ./.github/scripts/stage-sanitized-logs.sh "${dest}" \
            /tmp/zarf-*.log /tmp/uds-*.log /tmp/maru-*.log /tmp/debug-*.log \
            /tmp/uds-containerd-logs /tmp/k3d-uds-*.log
          echo "ok=true" >> "${GITHUB_OUTPUT}"
          echo "dir=${dest}" >> "${GITHUB_OUTPUT}"

      - name: Print sanitized logs
        if: (env.TEST_TYPE == 'install' || steps.baseline.outputs.available == 'true') && !cancelled() && steps.sanitize.outputs.ok == 'true'
        timeout-minutes: 3
        shell: bash
        run: ./.github/scripts/print-logs.sh "${{ steps.sanitize.outputs.dir }}/payload"

      # Evidence production/upload is best effort and cannot change app acceptance.
      - name: Collect optional install receipt
        id: install-receipt
        if: success() && env.TEST_TYPE == 'install' && needs.check-flavor.outputs.diagnostic-case == 'none' && !(github.event_name == 'workflow_dispatch' && inputs.trust_bundle) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && steps.sanitize.outputs.ok == 'true'
        timeout-minutes: 3
        continue-on-error: true
        env:
          RECEIPT_DIAGNOSTIC: ${{ needs.check-flavor.outputs.diagnostic-case }}
          INSTALL_OUTCOME: ${{ steps.install-execution.outcome }}
          AIRGAP_OUTCOME: ${{ steps.airgap-execution.outcome }}
          AIRGAP_RESTORE_OUTCOME: ${{ steps.airgap-restore.outcome }}
          SANITIZE_OK: ${{ steps.sanitize.outputs.ok }}
        run: timeout --kill-after=2s 150s python3 -B .github/scripts/collect-install-receipt.py collect

      - name: Authenticate optional install receipt
        id: attest-install-receipt
        if: success() && env.TEST_TYPE == 'install' && steps.install-receipt.outputs.ready == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.install-receipt.outputs.path }}

      - name: Upload authenticated install receipt
        if: success() && env.TEST_TYPE == 'install' && steps.install-receipt.outputs.ready == 'true' && steps.attest-install-receipt.outcome == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: install-receipt-${{ runner.arch }}-${{ env.AIRGAP_TEST == 'true' && 'airgap' || 'online' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.install-receipt.outputs.path }}
          if-no-files-found: ignore
          retention-days: 14

      - name: Generate unique suffix
        id: uniq
        if: (env.TEST_TYPE == 'install' || steps.baseline.outputs.available == 'true') && !cancelled() && steps.sanitize.outputs.ok == 'true'
        shell: bash
        run: |
          # shellcheck disable=SC3028
          echo "suffix=${RANDOM}" >> "$GITHUB_OUTPUT"

      # A failed install or upgrade must not start this upload.
      # actions/upload-artifact v7.0.2 can ignore timeout-minutes. The job
      # limit then cancels the job, and that job's log is not kept. The
      # print step already wrote the sanitized logs. success() lets the
      # failed job finish. A sanitizer that did not finish still cannot upload.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success() && (env.TEST_TYPE == 'install' || steps.baseline.outputs.available == 'true') && !cancelled() && steps.sanitize.outputs.ok == 'true'
        timeout-minutes: 5
        with:
          name: debug-log-${{ env.TEST_TYPE }}-${{ env.TEST_FLAVOR }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ runner.arch }}-${{ steps.uniq.outputs.suffix }}
          path: ${{ steps.sanitize.outputs.dir }}/payload/tmp
          if-no-files-found: ignore

      - name: Remove private gateway fixture files
        if: always() && steps.trust-fixture.outputs.directory != ''
        timeout-minutes: 1
        env:
          PRIVATE_FIXTURE: ${{ steps.trust-fixture.outputs.directory }}
        run: python3 tests/prepare-trust-fixture.py cleanup --parent "${RUNNER_TEMP}" --directory "${PRIVATE_FIXTURE}"

  validate-upgrade:
    needs: [check-flavor, images, cloudtak-index, postgis-index]
    # Preserve baseline discovery after image-prep failures for normal runs.
    # Explicit manual modes omit only the unselected validation work.
    if: ${{ !cancelled() && needs.check-flavor.result == 'success' && needs.check-flavor.outputs.diagnostic-case != 'pg15-amd64' && needs.check-flavor.outputs.diagnostic-case != 'pg15-both' && needs.check-flavor.outputs.diagnostic-case != 'airgap-amd64' && !(github.event_name == 'workflow_dispatch' && inputs.trust_bundle) }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.check-flavor.outputs.upgrade-matrix) }}
    name: validate-upgrade (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    # A healthy upgrade finishes in about 30 minutes. This job limit is what
    # stops a step whose own timeout does not, such as actions/upload-artifact.
    timeout-minutes: 75
    permissions:
      actions: read
      contents: read
      packages: read
      pull-requests: read
      id-token: write
    env:
      TEST_TYPE: upgrade
      # Pull the Package workflow's build (same key) instead of creating it.
      # Fork pull requests cannot publish one, so they create at once.
      DEV_PACKAGE_WAIT_SECONDS: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && '600' || '0' }}
      DEV_PACKAGE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      GH_TOKEN: ${{ github.token }}
      TEST_FLAVOR: upstream
    steps: *validate-steps

  # The newest release is already on PostgreSQL 18, so validate-upgrade no
  # longer runs the in-place upgrade from 15. This job pins release 0.6.0,
  # the last one on PostgreSQL 15 / PostGIS 3.4. It runs on pushes to main,
  # and on a pull request that has the upgrade-pg15 label when a commit is
  # pushed, so it adds no time to other pull requests.
  validate-upgrade-pg15:
    needs: [check-flavor, images, cloudtak-index, postgis-index]
    if: ${{ !cancelled() && needs.check-flavor.result == 'success' && (needs.check-flavor.outputs.diagnostic-case == 'pg15-amd64' || needs.check-flavor.outputs.diagnostic-case == 'pg15-both' || (needs.check-flavor.outputs.diagnostic-case == 'none' && (github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'upgrade-pg15')))) }}
    # Release 0.6.0 published an arm64 package too, so this runs on both.
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.check-flavor.outputs.pg15-matrix) }}
    name: validate-upgrade-pg15 (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    permissions:
      actions: read
      contents: read
      packages: read
      pull-requests: read
      id-token: write
    env:
      TEST_TYPE: upgrade
      UPGRADE_BASELINE_TAG: v0.6.0
      DEV_PACKAGE_WAIT_SECONDS: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && '600' || '0' }}
      DEV_PACKAGE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      GH_TOKEN: ${{ github.token }}
      TEST_FLAVOR: upstream
    steps: *validate-steps

  verify-test:
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    needs: [validate-install, validate-upgrade, validate-upgrade-pg15]
    # always() would run after a concurrency cancel and fail this job, and
    # that failed check is what keeps the superseded head red. A cancelled
    # run skips this job instead. A real install or upgrade failure still fails.
    if: ${{ always() && !cancelled() && needs.validate-install.result != 'cancelled' && needs.validate-upgrade.result != 'cancelled' && needs.validate-upgrade-pg15.result != 'cancelled' }}
    permissions:
      contents: read
    steps:
      - name: Checkout validation helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check validate result
        env:
          EVENT_NAME: ${{ github.event_name }}
          TRUST_BUNDLE: ${{ inputs.trust_bundle && 'true' || 'false' }}
          DIAGNOSTIC_CASE: ${{ inputs.diagnostic_case || 'none' }}
          INSTALL_RESULT: ${{ needs.validate-install.result }}
          UPGRADE_RESULT: ${{ needs.validate-upgrade.result }}
          PG15_RESULT: ${{ needs.validate-upgrade-pg15.result }}
          PG15_REQUIRED: ${{ github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'upgrade-pg15') }}
        run: python3 .github/scripts/test-validation-mode.py verify
