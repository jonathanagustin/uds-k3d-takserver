name: UI reel preview

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-reel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the media tools when missing
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
      - name: Render from locked historical footage
        run: |
          python3 -m unittest discover -s demo/ui-reel -p test_render.py
          python3 demo/ui-reel/render.py
      - name: Attest the edited video and source manifest
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            demo/out/ui-reel/*.mp4
            demo/out/ui-reel/edit-manifest.json
      - name: Retain the provenance bundle
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: cp "${BUNDLE_PATH}" demo/out/ui-reel/attestation.sigstore.json
      - name: Upload the review artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-reel-preview
          path: demo/out/ui-reel/
          if-no-files-found: error
          retention-days: 14
