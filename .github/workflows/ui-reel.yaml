name: UI reel preview

on:
  workflow_dispatch:
    inputs:
      export_scenes:
        description: "Also export three historical UI scene clips as a separate review artifact"
        type: boolean
        default: false
      release_tag:
        description: "Existing stable release tag (pair with source_run_id); empty renders only"
        type: string
        default: ""
      source_run_id:
        description: "Successful main UI reel run to publish without rerendering"
        type: string
        default: ""

      scene_source_run_id:
        description: "Publish reviewed historical scene artifact from this main run (no rendering)"
        type: string
        default: ""
      scene_source_attempt:
        description: "Exact scene producing attempt; requires committed full-frame privacy review"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  mode:
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    outputs:
      mode: ${{ steps.validate.outputs.mode }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate main-only render or paired publish inputs
        id: validate
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          EXPORT_SCENES: ${{ inputs.export_scenes }}
          SCENE_SOURCE_RUN_ID: ${{ inputs.scene_source_run_id }}
          SCENE_SOURCE_ATTEMPT: ${{ inputs.scene_source_attempt }}
        run: |
          if [[ "${EXPORT_SCENES}" == true && ( -n "${RELEASE_TAG}" || -n "${SOURCE_RUN_ID}" ) ]]; then
            echo "Scene exports are review-only and cannot be combined with publication"
            exit 1
          fi
          if [[ -n "${SCENE_SOURCE_RUN_ID}" || -n "${SCENE_SOURCE_ATTEMPT}" ]]; then
            python3 demo/ui-reel/publish_scenes.py --mode-only
          else
            python3 demo/ui-reel/publish.py --mode-only
          fi

  render:
    needs: mode
    if: github.ref == 'refs/heads/main' && needs.mode.outputs.mode == 'render'
    concurrency:
      group: ui-reel-render-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the media tools when missing
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
      - name: Render from locked historical footage
        env:
          EXPORT_SCENES: ${{ inputs.export_scenes }}
        run: |
          python3 -m unittest discover -s demo/ui-reel -p test_render.py
          args=()
          if [[ "${EXPORT_SCENES}" == true ]]; then args+=(--export-scenes); fi
          python3 demo/ui-reel/render.py "${args[@]}"
      - name: Attest the edited video and source manifest
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            demo/out/ui-reel/*.mp4
            demo/out/ui-reel/edit-manifest.json
      - name: Retain the provenance bundle
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: cp "${BUNDLE_PATH}" demo/out/ui-reel/attestation.sigstore.json
      - name: Upload the review artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-reel-preview
          path: demo/out/ui-reel/
          if-no-files-found: error
          retention-days: 14

      - name: Attest the historical scene clips and individual manifests
        if: inputs.export_scenes
        id: attest-scenes
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            demo/out/ui-reel-scenes/*.mp4
            demo/out/ui-reel-scenes/*.json
      - name: Retain the scene provenance bundle
        if: inputs.export_scenes
        env:
          BUNDLE_PATH: ${{ steps.attest-scenes.outputs.bundle-path }}
        run: cp "${BUNDLE_PATH}" demo/out/ui-reel-scenes/attestation.sigstore.json
      - name: Upload separate historical scene review artifact
        if: inputs.export_scenes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-scene-previews
          path: demo/out/ui-reel-scenes/
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: mode
    if: github.ref == 'refs/heads/main' && needs.mode.outputs.mode == 'publish'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    # Serialize all release edits, including retries; never cancel active uploads.
    concurrency:
      group: ui-reel-publish
      queue: max
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the verified GitHub CLI version
        env:
          GH_VERSION: 2.103.3
          GH_ARCHIVE_SHA256: 4c806978ffce1cec70853302a56d70ac6da4f19bae7adca4e1a8ab00633dd91d
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}"
          archive="gh_${GH_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --max-time 120 \
            "https://github.com/cli/cli/releases/download/v${GH_VERSION}/${archive}" -o "${archive}"
          echo "${GH_ARCHIVE_SHA256}  ${archive}" | sha256sum --check --status
          tar -xzf "${archive}"
          echo "${RUNNER_TEMP}/gh_${GH_VERSION}_linux_amd64/bin" >> "${GITHUB_PATH}"
      - name: Verify and publish the existing signed artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: python3 demo/ui-reel/publish.py

  publish-scenes:
    needs: mode
    if: github.ref == 'refs/heads/main' && needs.mode.outputs.mode == 'scenes'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    # Serialize all release edits, including retries; never cancel active uploads.
    concurrency:
      group: ui-scenes-publish
      queue: max
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the verified GitHub CLI version
        env:
          GH_VERSION: 2.103.3
          GH_ARCHIVE_SHA256: 4c806978ffce1cec70853302a56d70ac6da4f19bae7adca4e1a8ab00633dd91d
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}"
          archive="gh_${GH_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --max-time 120 \
            "https://github.com/cli/cli/releases/download/v${GH_VERSION}/${archive}" -o "${archive}"
          echo "${GH_ARCHIVE_SHA256}  ${archive}" | sha256sum --check --status
          tar -xzf "${archive}"
          echo "${RUNNER_TEMP}/gh_${GH_VERSION}_linux_amd64/bin" >> "${GITHUB_PATH}"
      - name: Ensure media inspection tools
        run: |
          if ! command -v ffprobe >/dev/null; then
            sudo timeout 120 apt-get update -o Acquire::Retries=0 -o Acquire::http::Timeout=10
            sudo timeout 120 apt-get install -y --no-install-recommends ffmpeg
          fi
      - name: Verify and publish the existing signed artifact
        env:
          GH_TOKEN: ${{ github.token }}
          SCENE_SOURCE_RUN_ID: ${{ inputs.scene_source_run_id }}
          SCENE_SOURCE_ATTEMPT: ${{ inputs.scene_source_attempt }}
        run: python3 demo/ui-reel/publish_scenes.py
