name: Unit tests

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main

permissions:
  contents: read

# Keep only the latest validation for each pull request or branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Offline unit tests with coverage. The Pepr tests also run in
  # pepr/build.sh when the package is created, and the Python tests in the
  # Test workflow; this job measures them and writes the numbers to the job
  # summary.
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node, Java, uv, and Helm
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: node java uv helm
          cache: true

      - name: Pepr module tests with coverage
        working-directory: pepr
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          mkdir -p coverage
          npm run test:coverage
          {
            echo "### Pepr module coverage (node --test)"
            echo
            node scripts/coverage-summary.mjs coverage/lcov.info
            echo
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Python upgrade helper tests with coverage
        env:
          COVERAGE_VERSION: 7.10.7
        shell: bash
        run: |
          set -euo pipefail
          coverage() { uv tool run --from "coverage==${COVERAGE_VERSION}" coverage "$@"; }
          python3 -B -m unittest discover -s tests -p 'test_move_ca_key.py' -v
          python3 -B -m unittest discover -s tests -p 'test_issue_health_cert.py' -v
          python3 -B -m unittest discover -s tests -p 'test_nats_roundtrip.py' -v
          coverage run --branch --source=tests -m unittest discover -s tests -p 'test_upgrade_*.py' -v
          coverage report --include='tests/upgrade-*.py' --show-missing
          {
            echo "### Python upgrade helpers coverage (coverage.py, line and branch combined)"
            echo
            coverage report --include='tests/upgrade-*.py' --format=markdown
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: ATAK viewer uptime probe
        env:
          PYYAML_VERSION: 6.0.3
        run: uv run --no-project --with "pyyaml==${PYYAML_VERSION}" python -B -m unittest tests.test_atak_uptime -v

      - name: Loki query helper
        run: bash tests/test_query_loki.sh

      - name: Grafana alert recovery
        run: python3 -B -m unittest tests.test_grafana_alerts -v

      - name: Full Core path filter
        run: bash tests/test_full_core_paths.sh

      - name: Runtime path filter
        run: bash tests/test_runtime_paths.sh

      - name: CI concurrency groups
        run: bash tests/test_ci_concurrency.sh

      - name: Dump Secret restore helper
        run: bash tests/test_db_dump_secret.sh

      - name: CoreConfig cache listener
        run: python3 -B -m unittest tests.test_cacheconfig_patch -v

      - name: Certificate expiry metrics
        run: python3 -B -m unittest tests.test_certificate_metrics tests.test_grafana_alert_order -v

      - name: Config secret redaction
        run: |
          python3 -B -m unittest tests.test_redact_logs tests.test_summarize_coreconfig tests.test_log_upload_gate -v
          bash tests/test_stage_sanitized_logs.sh
          bash tests/test_redact_order.sh
          bash tests/test_api_smoke_diag.sh
          bash tests/test_node_agent_ready.sh
          node --test tests/test_tak_error_guard.mjs

      # The profile checks and bench/run.py read YAML.
      - name: Profiles, benchmark harness, and Full Core summary
        env:
          PYYAML_VERSION: 6.0.3
        run: uv run --no-project --with "pyyaml==${PYYAML_VERSION}" python -B -m unittest tests.test_profiles tests.test_bench tests.test_bench_capacity tests.test_full_core_top tests.test_basemap_probe tests.test_runner_wedge_probe tests.test_node_airgap tests.test_ca_propagation -v

  # Renders the package without a cluster and checks that the package values
  # default to the Zarf variables, so a DOMAIN change still moves the hosts.
  package-values:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node, uv, Helm, and UDS CLI
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: node uv helm aqua:defenseunicorns/uds-cli
          cache: true

      - name: Build the Pepr chart
        run: bash pepr/build.sh

      - name: Package values follow the variables
        env:
          PYYAML_VERSION: 6.0.3
        run: uv run --no-project --with "pyyaml==${PYYAML_VERSION}" python -B -m unittest tests.test_package_values tests.test_expose_annotations -v
