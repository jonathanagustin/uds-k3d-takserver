name: Unit tests

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main

permissions:
  contents: read

# Keep only the latest validation for each pull request or branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Offline unit tests with coverage. The Pepr tests also run in
  # pepr/build.sh when the package is created, and the Python tests in the
  # Test workflow; this job measures them and writes the numbers to the job
  # summary.
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node, Java, uv, and Helm
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: node java uv helm
          cache: true

      - name: Pepr module tests with coverage
        working-directory: pepr
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          mkdir -p coverage
          npm run test:coverage
          {
            echo "### Pepr module coverage (node --test)"
            echo
            node scripts/coverage-summary.mjs coverage/lcov.info
            echo
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Python upgrade helper tests with coverage
        env:
          COVERAGE_VERSION: 7.10.7
        shell: bash
        run: |
          set -euo pipefail
          coverage() { uv tool run --from "coverage==${COVERAGE_VERSION}" coverage "$@"; }
          python3 -B -m unittest discover -s tests -p 'test_move_ca_key.py' -v
          python3 -B -m unittest discover -s tests -p 'test_issue_health_cert.py' -v
          python3 -B -m unittest discover -s tests -p 'test_nats_roundtrip.py' -v
          python3 -B -m unittest tests.test_fit_runner -v
          coverage run --branch --source=tests -m unittest discover -s tests -p 'test_upgrade_*.py' -v
          coverage report --include='tests/upgrade-*.py,tests/upgrade-agent-gate/live-health.py' --show-missing
          {
            echo "### Python upgrade helpers coverage (coverage.py, line and branch combined)"
            echo
            coverage report --include='tests/upgrade-*.py,tests/upgrade-agent-gate/live-health.py' --format=markdown
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Trust bundle live-test restoration contracts
        run: python3 -B -m unittest tests.test_trust_bundle_live tests.test_validation_mode tests.test_trust_fixture -v

      - name: Install execution receipt producers
        run: python3 -B -m unittest tests.test_install_receipt tests.test_checkpoint_identity tests.test_install_artifact_inputs tests.test_collect_install_receipt tests.test_install_reuse_shadow -v

      - name: TakClient revocation endpoint contract
        run: python3 -B -m unittest tests.test_takclient_revocation -v

      - name: Android scenario offline guards
        run: python3 -B -m unittest tests.test_android_scenario -v

      - name: ATAK viewer uptime probe
        env:
          PYYAML_VERSION: 6.0.3
        run: uv run --no-project --with "pyyaml==${PYYAML_VERSION}" python -B -m unittest tests.test_atak_uptime -v

      - name: Loki query helper
        run: bash tests/test_query_loki.sh

      - name: Grafana alert recovery
        run: python3 -B -m unittest tests.test_grafana_alerts -v

      - name: Full Core path filter
        run: bash tests/test_full_core_paths.sh

      - name: Runtime path filter
        run: bash tests/test_runtime_paths.sh

      - name: Published documentation inventory contracts
        run: node --test docs-site/scripts/published-releases.test.mjs

      - name: Package rendering evidence and wiring
        env:
          PYYAML_VERSION: 6.0.3
        run: uv run --no-project --with "pyyaml==${PYYAML_VERSION}" python -B -m unittest discover -s .github/test-infra/package-render -p 'test_*.py' -v

      - name: CI concurrency groups
        run: bash tests/test_ci_concurrency.sh

      - name: Dump Secret restore helper
        run: bash tests/test_db_dump_secret.sh

      - name: Synthetic mission-package fixture and provenance guards
        run: python3 -B -m unittest discover -s takx/mission-package -p 'test_*.py' -v

      - name: CoreConfig cache listener
        run: python3 -B -m unittest tests.test_cacheconfig_patch -v

      - name: Certificate expiry metrics
        run: python3 -B -m unittest tests.test_certificate_metrics tests.test_grafana_alert_order -v

      - name: Config secret redaction
        env:
          PYYAML_VERSION: 6.0.3
          PILLOW_VERSION: 13.0.0
        run: |
          uv run --no-project --with "pyyaml==${PYYAML_VERSION}" --with "pillow==${PILLOW_VERSION}" python -B -m unittest tests.test_redact_logs tests.test_summarize_coreconfig tests.test_log_upload_gate tests.test_demo_failure_diagnostics tests.test_demo_recorder tests.test_demo_publication tests.test_demo_media tests.test_ci_apt tests.test_docs_browser -v
          bash tests/test_stage_sanitized_logs.sh
          bash tests/test_redact_order.sh
          bash tests/test_api_smoke_diag.sh
          bash tests/test_node_agent_ready.sh
          ( cd tests && npx --yes pnpm@12.18.0 install --frozen-lockfile && npx playwright install chromium )
          node --test tests/test_tak_error_guard.mjs tests/sso-fetch.test.mjs tests/sso-trust-class.test.mjs tests/map-zoom.test.mjs
          python3 -B -m unittest tests.test_cloudtak_sso_mount tests.test_playwright_collection -v

      # The profile checks and bench/run.py read YAML.
      - name: Profiles, benchmark harness, and Full Core summary
        env:
          PYYAML_VERSION: 6.0.3
        run: uv run --no-project --with "pyyaml==${PYYAML_VERSION}" python -B -m unittest tests.test_profiles tests.test_bench tests.test_bench_capacity tests.test_bench_sustained tests.test_jvm_metrics tests.test_full_core_top tests.test_basemap_probe tests.test_runner_wedge_probe tests.test_runner_wedge_kernel tests.test_upgrade_agent_diagnostics tests.test_upgrade_agent_api_snapshot tests.test_node_airgap tests.test_image_producers tests.test_dev_package_key tests.test_helm_oci tests.test_mirror_checkpoint tests.test_app_image_consumers tests.test_published_package_ref tests.test_repository_name tests.test_ca_propagation tests.test_pin_image_tags -v

      - name: UI reel publisher contracts
        env:
          PYYAML_VERSION: 6.0.3
        run: uv run --no-project --with "pyyaml==${PYYAML_VERSION}" python -B -m unittest discover -s demo/ui-reel -p 'test_publish*.py' -v

      - name: Optional native source and cache guards
        env:
          PYYAML_VERSION: 6.0.3
        run: |
          python3 -B -m unittest discover -s takx -p 'test_source_inputs.py' -v
          python3 -B -m unittest discover -s takx -p 'test_tls_guards.py' -v
          python3 -B -m unittest tests.test_ghcr_migration -v
          python3 -B -m unittest discover -s takx/gis-java -p 'test_build.py' -v
          python3 -B -m unittest discover -s takx/gis-java/data -p 'test_build.py' -v
          python3 -B -m unittest discover -s takx/kernel-java -p 'test_build.py' -v
          python3 -B -m unittest discover -s takx/kernel-native -p 'test_build.py' -v
          python3 -B -m unittest discover -s takx/kernel-client-interop -p 'test_build.py' -v
          python3 -B -m unittest discover -s takx/client-compiler -p 'test_build.py' -v
          python3 -B -m unittest discover -s takx/client-compiler -p 'test_platform_producer.py' -v
          python3 -B -m unittest discover -s takx/sdk-package -p 'test_build.py' -v
          python3 -B -m unittest discover -s takx/sdk-package -p 'test_resource_inputs.py' -v
          python3 -B -m unittest discover -s takx/sdk-package -p 'test_source_families.py' -v
          python3 -B -m unittest discover -s takx/kernel-regressions -p 'test_build.py' -v
          python3 -B -m unittest discover -s takx/sdk-package -p 'test_composition.py' -v
          python3 -B -m unittest discover -s takx/sdk-package -p 'test_native_source_*.py' -v
          python3 -B -m unittest discover -s takx/native-deps -p 'test_build.py' -v
          python3 -B -m unittest discover -s takx/native-las -p 'test_build.py' -v
          python3 -B -m unittest discover -s takx/native-assimp -p 'test_build.py' -v
          python3 -B -m unittest discover -s takx/kernel-spatial-db -p 'test_*.py' -v
          python3 -B -m unittest discover -s takx/kernel-scene -p 'test_*.py' -v
          python3 -B -m unittest discover -s takx/native-mdbtools -p 'test_*.py' -v
          python3 -B -m unittest discover -s takx/native-gles -p 'test_*.py' -v
          python3 -B -m unittest discover -s takx/native-gdal-jni -p 'test_*.py' -v
          python3 -B -m unittest discover -s takx/native-crypto -p 'test_*.py' -v
          python3 -B -m unittest discover -s takx/native-cesium -p 'test_*.py' -v
          python3 -B -m unittest discover -s takx/native-kml -p 'test_*.py' -v
          python3 -B -m unittest discover -s takx/native-curl -p 'test_*.py' -v
          python3 -B -m unittest discover -s takx/native-commoncommo -p 'test_*.py' -v
          python3 -B -m unittest discover -s takx/cot-conformance -p 'test_*.py' -v
          uv run --no-project --with "pyyaml==${PYYAML_VERSION}" python -B -m unittest discover -s takx/registry-cache -p 'test_*.py' -v
          python3 -B -m unittest discover -s takx/sqlite-jdbc -p 'test_*.py' -v
          python3 -B -m unittest discover -s takx/native-sqlcipher -p 'test_build.py' -v
          python3 -B -m unittest discover -s takx/native-geos -p 'test_build.py' -v
          python3 -B -m unittest discover -s takx/native-proj -p 'test_build.py' -v
          python3 -B -m unittest discover -s takx/worldwind-java -p 'test_build.py' -v
          python3 -B -m unittest discover -s takx/worldwind-consumers -p 'test_stage.py' -v
          python3 -B -m unittest discover -s takx/ui-java -p 'test_build.py' -v

  # Renders the package without a cluster and checks that the package values
  # default to the Zarf variables, so a DOMAIN change still moves the hosts.
  package-values:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # PR merge parents and the usual push predecessor; missing objects render.
          fetch-depth: 2

      - name: Decide package rendering from verified Git evidence
        id: package_render
        continue-on-error: true
        run: python3 -B .github/test-infra/package-render/decide.py

      - name: Install Node, uv, Helm, and UDS CLI
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: node uv helm aqua:defenseunicorns/uds-cli
          cache: true

      - name: Native upgrade admission gate contracts
        run: python3 -B -m unittest tests.test_agent_gate -v

      - name: Package policy and safety contracts
        env:
          PYYAML_VERSION: 6.0.3
        run: uv run --no-project --with "pyyaml==${PYYAML_VERSION}" python -B -m unittest tests.test_workflow_permissions tests.test_scorecard_permissions tests.test_package_values.RenderFailureTests tests.test_trust_bundle tests.test_expose_annotations tests.test_workload_identities tests.test_filesystem_backup_owner tests.test_velero_handoff tests.test_ephemeral_cluster tests.test_velero_transfer tests.test_velero_trial tests.test_staged_migrations tests.test_upgrade_agent_watch tests.test_identity_rollout_driver tests.test_package_identity_driver tests.test_identity_phase_evidence tests.test_identity_public_evidence tests.test_identity_retained_state tests.test_identity_render_inputs tests.test_identity_failure_evidence -v

      - name: Build the Pepr chart
        if: steps.package_render.outcome != 'success' || steps.package_render.outputs.render != 'false'
        run: bash pepr/build.sh

      - name: Package values follow the variables
        if: steps.package_render.outcome != 'success' || steps.package_render.outputs.render != 'false'
        env:
          PYYAML_VERSION: 6.0.3
        run: uv run --no-project --with "pyyaml==${PYYAML_VERSION}" python -B -m unittest tests.test_package_values.PackageValuesTests -v
      - name: Encrypted staged diagnostic guards
        run: python3 -B -m unittest discover -s .github/test-infra -p test_staged_encrypted_diagnostic.py -v
      - name: Draft release readiness guards
        env:
          PYYAML_VERSION: 6.0.3
        run: uv run --no-project --with "pyyaml==${PYYAML_VERSION}" python -B -m unittest discover -s .github/test-infra -p 'test_release_*.py' -v
