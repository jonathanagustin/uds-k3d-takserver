# yaml-language-server: $schema=https://raw.githubusercontent.com/defenseunicorns/uds-cli/refs/heads/main/uds.schema.json
# core-monitoring on a cluster that already has k3d-core-slim-dev and Identity.
# This directory is only the bundle, so `uds create atak/ci/monitoring` reads
# this file. The ATAK e2e job deploys it before the device package so the
# Prometheus Probe CRD exists when the viewer expose is created. The viewer
# check is tests/atak-uptime.sh.
kind: UDSBundle
metadata:
  name: atak-monitoring
  description: UDS Core monitoring for the ATAK viewer uptime probe
  version: dev

packages:
  - name: core-monitoring
    repository: ghcr.io/defenseunicorns/packages/uds/core-monitoring
    ref: 1.15.2-upstream
    keylessVerification:
      certificateIdentityRegexp: "^https://github\\.com/defenseunicorns/uds-core/\\.github/workflows/publish\\.yaml@refs/tags/v[0-9]+\\.[0-9]+\\.[0-9]+$"
      certificateOIDCIssuer: https://token.actions.githubusercontent.com
