#
# ATAK test device: the Android-x86 VM, the browser viewer and the UDS Package
# that limits their traffic. amd64 with /dev/kvm only. Images are set by the
# e2e script (VM_IMAGE, VIEWER_IMAGE) with envsubst.
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: atak-device
  namespace: atak
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        app.kubernetes.io/name: atak-device
    spec:
      domain:
        cpu:
          cores: 2
        memory:
          guest: 3Gi
        firmware:
          kernelBoot:
            container:
              image: ${VM_IMAGE}
              imagePullPolicy: IfNotPresent
              kernelPath: /boot/kernel
              initrdPath: /boot/initrd.img
            kernelArgs: "root=/dev/ram0 SRC=/android androidboot.selinux=permissive console=ttyS0 androidboot.console=ttyS0 loglevel=6 DEBUG=0 VIRT_WIFI=0 video=720x1280"
        devices:
          logSerialConsole: true
          disks:
            - name: android
              disk:
                bus: virtio
          interfaces:
            - name: default
              model: e1000
              masquerade: {}
              ports:
                - {name: adb, port: 5555}
      networks:
        - name: default
          pod: {}
      volumes:
        - name: android
          containerDisk:
            image: ${VM_IMAGE}
            imagePullPolicy: IfNotPresent
            path: /disk/android.qcow2
---
apiVersion: v1
kind: Service
metadata:
  name: atak-device-adb
  namespace: atak
spec:
  selector:
    app.kubernetes.io/name: atak-device
  ports:
    - name: adb
      port: 5555
      targetPort: 5555
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atak-viewer
  namespace: atak
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: atak-viewer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: atak-viewer
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: viewer
          image: ${VIEWER_IMAGE}
          imagePullPolicy: IfNotPresent
          env:
            - name: DEVICE
              value: atak-device-adb.atak.svc.cluster.local:5555
          ports:
            - name: http
              containerPort: 8000
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: atak-viewer
  namespace: atak
spec:
  selector:
    app.kubernetes.io/name: atak-viewer
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: uds.dev/v1alpha1
kind: Package
metadata:
  name: atak
  namespace: atak
spec:
  sso:
    - name: ATAK test device viewer
      clientId: uds-atak-viewer
      redirectUris:
        - "https://atak.${DOMAIN}/login"
      enableAuthserviceSelector:
        app.kubernetes.io/name: atak-viewer
      groups:
        anyOf:
          - "/UDS Core/Admin"
  network:
    serviceMesh:
      mode: ambient
    expose:
      - description: Phone view of the ATAK test device
        service: atak-viewer
        selector:
          app.kubernetes.io/name: atak-viewer
        gateway: tenant
        host: atak
        port: 8000
    allow:
      # The device reaches TAK only through the passthrough gateway on the
      # standard TAK ports (enrollment and streaming). DNS is allowed by
      # the operator.
      - direction: Egress
        selector:
          app.kubernetes.io/name: atak-device
        remoteNamespace: istio-passthrough-gateway
        remoteSelector:
          app: passthrough-ingressgateway
        port: 8446
        description: Device to TAK enrollment
      - direction: Egress
        selector:
          app.kubernetes.io/name: atak-device
        remoteNamespace: istio-passthrough-gateway
        remoteSelector:
          app: passthrough-ingressgateway
        port: 8089
        description: Device to TAK streaming
      # Only the viewer and the driver Job may open adb on the device.
      - direction: Ingress
        selector:
          app.kubernetes.io/name: atak-device
        remoteSelector:
          app.kubernetes.io/name: atak-viewer
        port: 5555
        description: Viewer to device adb
      - direction: Egress
        selector:
          app.kubernetes.io/name: atak-viewer
        remoteSelector:
          app.kubernetes.io/name: atak-device
        port: 5555
        description: Viewer to device adb
      - direction: Ingress
        selector:
          app.kubernetes.io/name: atak-device
        remoteSelector:
          app.kubernetes.io/name: atak-driver
        port: 5555
        description: Driver to device adb
      - direction: Egress
        selector:
          app.kubernetes.io/name: atak-driver
        remoteSelector:
          app.kubernetes.io/name: atak-device
        port: 5555
        description: Driver to device adb
