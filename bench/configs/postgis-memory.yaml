name: postgis-memory
description: Raise the CloudTAK PostGIS memory request and limit. The chart has no shared_buffers value, so this sweep does not invent a Postgres GUC.
clients: [10, 50, 200]
duration_s: 60
restart: true
env: []
resources:
  - workload: statefulset/cloudtak-postgis
    namespace: cloudtak
    container: postgis
    memory_request: 512Mi
    memory_limit: 1Gi
