name: small
description: >
  Memory requests and limits from values/profiles/small.yaml and
  small-cloudtak.yaml. Plugin memory is 320Mi / 512Mi here because the
  chart ignores a plugins memory value; the post-helm patch on the package
  is still 128Mi / 384Mi. CPU stays at whatever the install set. Steady
  working set is run 40174810574. Not a front until this record is compared.
clients: [10, 50, 200]
duration_s: 60
restart: true
env: []
resources:
  - workload: deployment/takserver-api
    namespace: takserver
    container: takserver-api
    memory_request: 1Gi
    memory_limit: 1536Mi
  - workload: deployment/takserver-messaging
    namespace: takserver
    container: takserver-messaging
    memory_request: 1Gi
    memory_limit: 1536Mi
  - workload: deployment/takserver-config
    namespace: takserver
    container: takserver-config
    memory_request: 1Gi
    memory_limit: 1280Mi
  - workload: deployment/takserver-plugins
    namespace: takserver
    container: takserver-plugins
    memory_request: 320Mi
    memory_limit: 512Mi
  - workload: statefulset/takserver-postgresql
    namespace: takserver
    container: postgresql
    memory_request: 128Mi
    memory_limit: 512Mi
  - workload: statefulset/takserver-ignite
    namespace: takserver
    container: ignite
    memory_request: 512Mi
    memory_limit: 1536Mi
  - workload: deployment/cloudtak
    namespace: cloudtak
    container: cloudtak
    memory_request: 256Mi
    memory_limit: 768Mi
  - workload: deployment/cloudtak
    namespace: cloudtak
    container: sso
    memory_request: 128Mi
    memory_limit: 512Mi
  - workload: deployment/cloudtak
    namespace: cloudtak
    container: bootstrap
    memory_request: 48Mi
    memory_limit: 128Mi
  - workload: statefulset/cloudtak-postgis
    namespace: cloudtak
    container: postgis
    memory_request: 128Mi
    memory_limit: 512Mi
