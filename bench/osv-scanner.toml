# OSV-Scanner (and the OpenSSF Scorecard Vulnerabilities check) read this file.
# Each entry needs a reason and an expiry, so it comes back for review.
#
# protobuf 3.20.3 in load-test-requirements.txt. The TAK Server load tester
# (src/testing/load_test/requirements.txt, 5.7-RELEASE-14) pins
# protobuf>=3.20,<4.0, and its generated *_pb2.py files use the pre-3.20
# protoc layout. On protobuf 4.25, 5.29 and 6.33 they fail at import with
# "Descriptors cannot be created directly" unless the pure-Python
# implementation is forced, which would slow the sweep and change what the
# benchmark measures. protobuf only runs in the benchmark workflow's runner
# venv (benchmark.yaml), against the test deployment on that runner. It is
# not in the Zarf package or in any image. Remove these entries when the
# upstream tester moves to protobuf 4 or later.

[[IgnoredVulns]]
# Also CVE-2026-0994 and GHSA-7gcm-g887-7qv7 (JSON recursion depth bypass).
id = "PYSEC-2026-1805"
ignoreUntil = 2027-01-23
reason = "protobuf 3.20.x is the newest the upstream TAK Server load tester allows (protobuf<4.0, old-style generated code). Only runs in the benchmark workflow's runner venv, never in the Zarf package or an image, and the tester does not parse untrusted JSON."

[[IgnoredVulns]]
# Also CVE-2025-4565 and GHSA-8qvm-5x2c-j2w7 (recursion in pure-Python parsing).
id = "PYSEC-2026-1806"
ignoreUntil = 2027-01-23
reason = "protobuf 3.20.x is the newest the upstream TAK Server load tester allows (protobuf<4.0, old-style generated code). Only runs in the benchmark workflow's runner venv, never in the Zarf package or an image, and the tester parses only the TAK Server test deployment's own messages."
