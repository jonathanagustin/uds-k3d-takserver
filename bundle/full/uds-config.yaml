# Full-core deploy only. Slim keeps bundle/uds-config.yaml, where
# FILESYSTEM_BACKUP stays at the package default false.
# pin-image-tags.sh rewrites TAK_IMAGE_TAG here before the package is created.
variables:
  takserver:
    DOMAIN: uds.dev
    TAK_IMAGE_TAG: 5.7-RELEASE-14
    FILESYSTEM_BACKUP: "true"
