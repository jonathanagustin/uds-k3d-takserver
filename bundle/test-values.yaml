# Applied by bundle/uds-bundle.yaml and bundle/full/uds-bundle.yaml.
# CI runners are 4 CPU and 16 GB on amd64 and arm64 (about 15984Mi).
# Memory requests sit just above the steady working set from tests/usage.sh at the
# end of install on run 40174810574, kubelet Summary API, higher arch:
# api 911Mi, messaging 888Mi, config 750Mi, Ignite 488Mi, Postgres 59Mi.
# A 2 vCPU, 8 GB node is smaller than that working set once slim core is
# added. The upstream developer example requests 1 CPU and 8Gi for
# messaging and the API.
#
# CPU requests stay small so the pods can schedule.
# The image adds -Xms512m -Xmx512m on the api, messaging, and config
# commands. MaxRAMPercentage alone followed host RAM. On OpenJDK 17.0.16 the
# cgroup limit is visible and MaxHeapSize is still the host figure, so -Xmx
# is the bound that fits. Ignite warns below a 512MB heap. UserManager stays
# at 128m. A local Ignite start with -Xmx512m used 226MiB and reported a
# 512MB heap.
# The messaging Deployment copies the API memory limit. A 1Gi cgroup was
# OOM-killed about 15s after UserManager started (512m heap, 128MB off-heap,
# plus that second JVM). 1536Mi holds those. Config does not run UserManager.
# Its request is 1Gi against the 750Mi steady set on that run.
#
# The plugins Deployment reads only the CPU request and then copies the API
# CPU limit. It does not read a plugins memory value. The post-helm patch
# reads takserver.plugins.resources memory from the Helm release. Steady
# use on the same run was 263Mi amd64 and 260Mi arm64: request 320Mi,
# limit 512Mi.
takserver:
  config:
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 1Gi
      limits:
        # A 500m limit made the JVM start-up take most of a rollout bound on
        # the 2 CPU runner. The processes start one after another, so they
        # can burst into CPU the others are not using.
        cpu: "1"
        # Steady 750Mi. 1280Mi is that set plus about half again.
        memory: 1280Mi
  messaging:
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 1Gi
      limits:
        cpu: 500m
        # The messaging template ignores this and copies the API limit.
        memory: 1536Mi
  api:
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 1Gi
      limits:
        # Messaging and plugins copy this CPU limit.
        cpu: "1"
        # Also the messaging container's memory limit. See the note above.
        memory: 1536Mi
  plugins:
    replicas: 1
    resources:
      requests:
        cpu: 25m
        memory: 320Mi
      limits:
        cpu: 250m
        memory: 512Mi
postgresql:
  primary:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    persistence:
      size: 1Gi
ignite:
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 512Mi
    limits:
      # The API lost its Ignite client connection (IgniteClientDisconnected-
      # Exception) when the server restarted at the 500m limit.
      cpu: "1"
      memory: 1536Mi
