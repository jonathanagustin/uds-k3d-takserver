# yaml-language-server: $schema=https://raw.githubusercontent.com/defenseunicorns/uds-cli/refs/heads/main/uds.schema.json
# Deploy this onto a cluster that already has k3d-core-slim-dev.
# The slim bundle does not select istio-passthrough-gateway. core-base is
# listed here so the test deploy upgrades that package and turns the gateway on.
# Pepr and Istiod are pinned to the checkpoint requests. The chart defaults
# are 200m and 500m, and those larger pods cannot schedule on a 2 CPU node.
# `uds run test-install` and `uds run default` install the slim cluster first.
kind: UDSBundle
metadata:
  name: takserver-dev
  description: TAK Server layered onto a k3d-core-slim-dev cluster
  version: dev

packages:
  # Same UDS Core version as the k3d-core-slim-dev checkpoint in
  # .github/scripts/deploy-slim-core.sh.
  - name: core-base
    repository: ghcr.io/defenseunicorns/packages/uds/core-base
    ref: 1.15.2-upstream
    optionalComponents:
      - istio-passthrough-gateway
      # QUIC is UDP. Istio has no UDP ingress, so the test bundle selects
      # Envoy Gateway. The controller request is pinned below. The proxy pod
      # is created only while a UDP listener exists (quic.enabled on the
      # config chart). Envoy Gateway 1.9.2 sizes that proxy at 100m CPU and
      # 512Mi, plus a 10m/32Mi shutdown manager. Those are not chart values.
      # Together with this controller pin, the extra request is about 160m
      # CPU and 800Mi, next to Istiod at 100m and the passthrough gateway
      # at 50m. The public CI runners have 4 CPU and 16 GB. A 2 CPU node
      # still has room beside the test-values TAK requests.
      - envoy-gateway
      - envoy-default-gateway
    keylessVerification:
      certificateIdentityRegexp: "^https://github\\.com/defenseunicorns/uds-core/\\.github/workflows/publish\\.yaml@refs/tags/v[0-9]+\\.[0-9]+\\.[0-9]+$"
      certificateOIDCIssuer: https://token.actions.githubusercontent.com
    # Match k3d-core-slim-dev so the upgrade does not enlarge Pepr or Istiod.
    # Istiod replaces its one pod in place. A surge pod requests 500m and
    # never schedules beside the checkpoint.
    overrides:
      pepr-uds-core:
        module:
          values:
            - path: watcher.resources.requests.cpu
              value: 100m
            - path: watcher.resources.requests.memory
              value: 64Mi
            - path: admission.resources.requests.cpu
              value: 100m
            - path: admission.resources.requests.memory
              value: 64Mi
      istio-controlplane:
        istiod:
          values:
            - path: resources.requests.cpu
              value: 100m
            - path: resources.requests.memory
              value: 1024Mi
            - path: rollingMaxSurge
              value: "0%"
            - path: rollingMaxUnavailable
              value: "100%"
      istio-passthrough-gateway:
        gateway:
          values:
            - path: resources.requests.cpu
              value: 50m
            # Upstream defaults plus the standard TAK ports. The gateway
            # chart's NetworkPolicy opens each listed port.
            # charts/takserver/templates/standard-ports.yaml routes 8446 and 8089.
            - path: service.ports
              value:
                - name: status-port
                  port: 15021
                  protocol: TCP
                  targetPort: 15021
                - name: http2
                  port: 80
                  protocol: TCP
                  targetPort: 80
                - name: https
                  port: 443
                  protocol: TCP
                  targetPort: 443
                - name: tls-tak-cert
                  port: 8446
                  protocol: TCP
                  targetPort: 8446
                - name: tls-tak-stream
                  port: 8089
                  protocol: TCP
                  targetPort: 8089
            - path: autoscaling.enabled
              value: false
      envoy-gateway:
        envoy-gateway:
          values:
            # Upstream chart default is 100m CPU, 256Mi request, 1024Mi limit.
            - path: deployment.envoyGateway.resources.requests.cpu
              value: 50m
            - path: deployment.envoyGateway.resources.requests.memory
              value: 256Mi
            - path: deployment.envoyGateway.resources.limits.memory
              value: 512Mi

  - name: takserver
    path: ../
    ref: dev
    # CloudTAK, the browser map client at map.<domain>.
    optionalComponents:
      - cloudtak
    overrides:
      takserver:
        # Our config chart, not the upstream chart. test-values.yaml is
        # shared with other bundles, so the QUIC switch stays here, next to
        # the Envoy Gateway components above.
        uds-takserver-config:
          values:
            - path: quic.enabled
              value: true
        takserver:
          valuesFiles:
            - test-values.yaml
