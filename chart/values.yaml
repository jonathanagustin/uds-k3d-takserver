# Inputs for chart/templates/uds-package.yaml.
# Service names and pod labels match a render of the upstream chart
# with release name takserver.

domain: "###ZARF_VAR_DOMAIN###"

api:
  service: takserver-api-service
  selector:
    app: takserver-api
  # Upstream ingress tak-api-https-ingress sends this host to port 8446.
  https:
    host: takserver
    port: 8446
  # Upstream ingress tak-api-cert-https-ingress sends this host to port 8443.
  cert:
    host: takserver-api
    port: 8443
  # Browser UI. The stock Service does not publish 8447; this chart does.
  web:
    service: takserver-web
    host: takserver
    port: 8447
    # The tenant gateway re-encrypts to 8447 and verifies TAK's certificate.
    # Off makes 8447 a plaintext connector behind the gateway, which TAK flags
    # as a non-secure port. See adr/0006-re-encrypt-gateway-traffic-to-tak.md.
    backendTLS:
      enabled: true
      # Namespace of the UDS Core tenant gateway. The CA Secret goes there.
      gatewayNamespace: istio-tenant-gateway
      caSecretName: takserver-web-ca
      # Key in ConfigMap cert-migration, mounted under certs/files.
      keystore: takserver-web.jks

# CloudTAK, the browser map client in the cloudtak component. These values
# only render the Ingress rules that let it reach TAK.
cloudtak:
  enabled: true
  namespace: cloudtak
  selector:
    app: cloudtak

messaging:
  service: takserver-messaging-service
  selector:
    app: takserver-messaging
  # Upstream ingress tak-messaging-tls-ingress sends this host to port 8089.
  streaming:
    host: takserver-stream
    port: 8089

# Standard TAK ports (8446 enrollment, 8089 streaming) on the passthrough
# gateway for any of these hosts, so a client uses one host for both. The
# 443 SNI routes above stay as they are. takserver-stream is listed because
# the in-cluster DNS rewrite sends it to the passthrough gateway, while
# takserver resolves to the tenant gateway (web UI) inside the cluster.
standardPorts:
  enabled: true
  certPort: 8446
  streamPort: 8089
  hosts:
    - takserver
    - takserver-stream

ignite:
  selector:
    app: takserver-ignite

# Pods that call the Kubernetes API to discover Ignite. The upstream chart
# sets serviceAccountName takserver-ignite on the Ignite StatefulSet and on
# the API, messaging, config, and plugins Deployments. Each of those clients
# uses TcpDiscoveryKubernetesIpFinder.
kubeApi:
  selectors:
    - app: takserver-ignite
    - app: takserver-api
    - app: takserver-messaging
    - app: takserver-config
    - app: takserver-plugins

# Pod-to-pod flows inside the namespace. Each entry allows the listed
# clients to reach the server pods on the listed ports, as an Egress rule on
# each client and an Ingress rule on the server. Nothing else inside the
# namespace is allowed, apart from the Ignite rules above. tests/flows.py
# (task test:flows) lists the connections the pods really open and fails on
# one that no rule covers. See adr/0007-per-workload-network-rules.md.
#
# Observed in CI with the old namespace-wide rule (tests/flows.py):
# API, messaging, and plugins hold connections to Postgres 5432 and NATS
# 4222. The config pod holds neither, so it is not a client of either.
intraNamespace:
  flows:
    # CoreConfig repository connection, plus the API and messaging readiness
    # probes. The upstream db-setup Job runs SchemaManager once and exits, so
    # a snapshot does not see it. Its pods carry the Job name label.
    - name: postgres
      server:
        app.kubernetes.io/name: postgresql
        app.kubernetes.io/component: primary
      ports: [5432]
      clients:
        - app: takserver-api
        - app: takserver-messaging
        - app: takserver-plugins
        - batch.kubernetes.io/job-name: takserver-db-setup
    # CoreConfig cluster natsURL.
    - name: nats
      server:
        app.kubernetes.io/name: nats
        app.kubernetes.io/component: nats
      ports: [4222]
      clients:
        - app: takserver-api
        - app: takserver-messaging
        - app: takserver-plugins
    # Ignite server nodes join each other on discovery and communication.
    # CI runs one Ignite replica, so this flow is not observed there. It is
    # needed when ignite.replicaCount is more than 1.
    - name: ignite-peers
      server:
        app: takserver-ignite
      ports: [47100, 47500]
      clients:
        - app: takserver-ignite
  # The TAK processes are Ignite client nodes. They also connect to each
  # other on the communication port (Ignite service calls go to the node that
  # hosts the service). CI saw api->config, api->messaging, messaging->config,
  # plugins->api, plugins->config, and plugins->messaging. The side that opens
  # the connection is whichever node sends first, so every pair is allowed
  # both ways on this port only.
  igniteClientPeers:
    port: 47100
    selectors:
      - app: takserver-api
      - app: takserver-messaging
      - app: takserver-config
      - app: takserver-plugins

sso:
  # Registers Keycloak client uds-takserver and Secret takserver-sso.
  # An init container envsubsts TAK_OIDC_CLIENT_SECRET into CoreConfig.
  # Authservice is not used. TAK's own authorization-code flow is.
  enabled: true
  clientId: uds-takserver
  secretName: takserver-sso
  # Keycloak full group path. TAK grants ROLE_ADMIN when the groups claim
  # contains this value. It does not match groupprefix /tak/, so it is not
  # also a TAK group. /TAK/..._READ and _WRITE are the mapped groups.
  adminGroup: "/UDS Core/Admin"

additionalNetworkAllow: []

# Subject fields for the deploy-time CA. The Job skips generation when
# ConfigMap cert-migration already exists.
certs:
  image: "ghcr.io/jonathanagustin/uds-k3d-takserver/takserver-config:###ZARF_VAR_TAK_IMAGE_TAG###"
  caName: uds-tak-ca
  state: VA
  city: Arlington
  organization: TAK
  organizationalUnit: UDS
