# Daily logical dump of the CloudTAK database into Secret cloudtak-db-dump.
# Rendered only when backup.dump.enabled is true. See adr/0016-logical-db-dump.md.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudtak-db-dump
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cloudtak-db-dump
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["cloudtak-db-dump"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cloudtak-db-dump
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cloudtak-db-dump
subjects:
  - kind: ServiceAccount
    name: cloudtak-db-dump
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cloudtak-db-dump
spec:
  schedule: {{ .Values.backup.dump.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app: cloudtak-db-dump
        spec:
          serviceAccountName: cloudtak-db-dump
          restartPolicy: Never
          automountServiceAccountToken: true
          securityContext:
            fsGroup: 999
          initContainers:
            - name: dump
              image: {{ .Values.postgis.image | quote }}
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  export TMPDIR=/dump
                  pg_dump -h cloudtak-postgis -p 5432 -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" --no-owner --no-acl > /dump/dump.sql
                  chmod 644 /dump/dump.sql
                  bytes="$(wc -c < /dump/dump.sql | tr -d ' ')"
                  if [ "${bytes}" -gt 700000 ]; then
                    echo "cloudtak-db-dump is ${bytes} bytes; a Secret holds about 1Mi" >&2
                    exit 1
                  fi
              env:
                - name: POSTGRES_DB
                  value: {{ .Values.postgis.database | quote }}
                - name: POSTGRES_USER
                  value: {{ .Values.postgis.username | quote }}
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: cloudtak
                      key: POSTGRES_PASSWORD
              securityContext:
                {{- include "cloudtak.containerSecurity" . | nindent 16 }}
                runAsNonRoot: true
                runAsUser: 999
                runAsGroup: 999
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              volumeMounts:
                - name: dump
                  mountPath: /dump
          containers:
            - name: publish
              image: {{ .Values.backup.dump.publishImage | quote }}
              imagePullPolicy: IfNotPresent
              command: ["/bin/bash", "-c"]
              args:
                - |
                  set -euo pipefail
                  ns="$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)"
                  token="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
                  ca="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
                  payload="$(base64 -w 0 /dump/dump.sql)"
                  api="https://kubernetes.default.svc/api/v1/namespaces/${ns}/secrets"
                  body="$(printf '{"apiVersion":"v1","kind":"Secret","metadata":{"name":"%s","labels":{"app.kubernetes.io/part-of":"tak-backup"}},"type":"Opaque","data":{"dump.sql":"%s"}}' "${SECRET_NAME}" "${payload}")"
                  code="$(curl --silent --show-error --cacert "${ca}" --max-time 60 -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer ${token}" -H 'Content-Type: application/json' --data "${body}" "${api}")"
                  if [[ "${code}" == "409" ]]; then
                    code="$(curl --silent --show-error --cacert "${ca}" --max-time 60 -o /dev/null -w '%{http_code}' -X PUT -H "Authorization: Bearer ${token}" -H 'Content-Type: application/json' --data "${body}" "${api}/${SECRET_NAME}")"
                  fi
                  if [[ "${code}" != "200" && "${code}" != "201" ]]; then
                    echo "writing Secret ${SECRET_NAME} returned HTTP ${code}" >&2
                    exit 1
                  fi
              env:
                - name: SECRET_NAME
                  value: cloudtak-db-dump
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              volumeMounts:
                - name: dump
                  mountPath: /dump
                  readOnly: true
          volumes:
            - name: dump
              emptyDir: {}
{{- end }}
