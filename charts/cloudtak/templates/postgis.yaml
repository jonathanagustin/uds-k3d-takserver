# CloudTAK's own database. CloudTAK needs PostGIS. It does not share the TAK
# database or its credentials.
apiVersion: v1
kind: Service
metadata:
  name: cloudtak-postgis
spec:
  selector:
    app: cloudtak-postgis
  ports:
    - name: tcp-postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cloudtak-postgis
spec:
  serviceName: cloudtak-postgis
  replicas: 1
  selector:
    matchLabels:
      app: cloudtak-postgis
  template:
    metadata:
      labels:
        app: cloudtak-postgis
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgis
          image: {{ .Values.postgis.image }}
          ports:
            - containerPort: 5432
              name: tcp-postgres
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgis.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgis.username | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cloudtak
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          # pg_upgrade runs in the entrypoint before postgres listens. Liveness
          # waits until this probe succeeds, so a 15 to 18 upgrade is not killed.
          startupProbe:
            exec:
              command: ["sh", "-c", "pg_isready -h 127.0.0.1 -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -h 127.0.0.1 -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 5432
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources.postgis | nindent 12 }}
          securityContext:
            {{- include "cloudtak.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.postgis.storage }}
