domain: "###ZARF_VAR_DOMAIN###"

# Browser host on the tenant gateway: https://<host>.<domain>/
host: map

# UDS Core uptime check on https://<host>.<domain>/login. Same switch as UDS
# Core's Keycloak and Grafana charts.
uptime:
  enabled: true

image:
  repository: ghcr.io/jonathanagustin/uds-k3d-takserver/cloudtak
  tag: v13.112.3 # cloudtak-version

# Logical pg_dump of the CloudTAK database into Secret cloudtak-db-dump.
# Off unless a bundle sets backup.dump.enabled. See adr/0016-logical-db-dump.md.
backup:
  dump:
    enabled: false
    schedule: "20 2 * * *"
    # Writes the Secret. The PostGIS image has pg_dump and no curl.
    publishImage: "ghcr.io/jonathanagustin/uds-k3d-takserver/takserver-config:###ZARF_VAR_TAK_IMAGE_TAG###"
  # Same string switch as the TAK chart. See adr/0021-velero-node-agent.md.
  filesystem:
    enabled: "###ZARF_VAR_FILESYSTEM_BACKUP###"

postgis:
  # The image the TAK chart already uses. One image covers both databases.
  # Built in this repository for amd64 and arm64. The entrypoint upgrades a
  # PostgreSQL 15 data directory (adr/0018-upgrade-postgres-in-place.md).
  image: ghcr.io/jonathanagustin/uds-k3d-takserver/postgis:18-3.6
  storage: 2Gi
  # StorageClass for the data volume. Empty leaves storageClassName unset, so
  # the cluster default class is used, as before. The package sets it from
  # CLOUDTAK_STORAGE_CLASS. A StatefulSet volume claim template cannot change
  # later, so set it only on a new install.
  storageClass: ""
  database: cloudtak
  username: cloudtak

# Keycloak sign-in. CloudTAK hides its password form and the map goes
# straight to the UDS Keycloak login. See docs/cloudtak.md.
sso:
  clientId: uds-cloudtak
  # Same realm limits as the TAK client. See charts/takserver/values.yaml.
  sessionIdleTimeout: "600"
  sessionMaxLifespan: "36000"
  # Secret the UDS operator writes with the client secret.
  secretName: cloudtak-sso
  realm: uds
  # Button text on CloudTAK's login page (/login?sso=off).
  name: UDS SSO
  # Keycloak login gate (Package sso groups.anyOf). A user must be a direct
  # member of one of these groups. The TAK Server web UI client stays
  # /UDS Core/Admin only (charts/takserver/values.yaml sso.adminGroup).
  # /CloudTAK/Users is the non-admin group. UDS Core does not create it: an
  # operator creates it in Keycloak, and a listed group that does not exist
  # is skipped. It is outside /TAK/, so TAK does not also map it to a TAK
  # group. Members still need a /TAK/<group>_READ or _WRITE group to see TAK
  # data. A bundle replaces the whole list with variable CLOUDTAK_SSO_GROUPS.
  # See docs/cloudtak.md#who-can-sign-in.
  groups:
    - "/UDS Core/Admin"
    - "/CloudTAK/Users"
  # Members of this Keycloak group become CloudTAK system administrators.
  # Empty turns that off.
  adminGroup: "/UDS Core/Admin"

# Extra Package CR network.allow entries, appended after the rules above.
# Each entry needs a unique description. See docs/cloudtak.md#network-rules.
additionalNetworkAllow: []

# Where TAK lives. The takserver component renders the matching Ingress
# rules in its own Package CR.
tak:
  namespace: takserver
  apiService: takserver-api-service
  apiSelector:
    app: takserver-api
  webService: takserver-web
  webPort: 8447
  messagingService: takserver-messaging-service
  messagingSelector:
    app: takserver-messaging
  # Secret the takserver-oidc watcher copies into cloudtak: ca.pem and
  # admin.pem from ConfigMap cert-migration, admin.key from Secret
  # takserver-certs, and CAPASS from Secret takserver-keystore.
  adminSecret: cloudtak-tak-admin

# TAK file user behind CloudTAK's admin connection, and its TAK groups.
# The bootstrap container creates it. People do not sign in with it: with
# Keycloak sign-in on, CloudTAK refuses password logins. The password is
# generated on first install and kept in Secret cloudtak.
account:
  username: cloudtak-admin
  groups: Operators

# Default basemap for new users. nginx in the CloudTAK pod proxies and
# caches the tiles for signed-in users, and the Package allows egress to the
# url's host on its port only. See docs/cloudtak.md#basemap.
basemap:
  # false removes the basemap record, the proxy, and the egress rule. Use it
  # where the cluster has no route to the tile host.
  enabled: true
  name: OpenStreetMap
  # Tile URL template with {z}, {x}, and {y}. Point it at a tile server
  # inside the network for an air-gapped install.
  url: "https://tile.openstreetmap.org/{z}/{x}/{y}.png"
  # Shown on the map. HTML is allowed.
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors'
  minzoom: 0
  maxzoom: 19
  # Make it CloudTAK's default basemap (map::basemap). Users who signed in
  # before it existed keep the basemap they had and can pick it in the
  # basemap menu.
  default: true
  # Sent to the tile host on every request. The OpenStreetMap tile policy
  # asks a caching proxy for a User-Agent that names the service and a way
  # to contact its operator: set contact to an email address or URL for
  # this deployment. userAgent replaces the whole string.
  contact: ""
  userAgent: ""
  # Disk cache in the pod's /tmp.
  cacheSize: 256m
  # Tiles a second per signed-in session after a burst.
  rate: 20
  burst: 200
  # Port of the egress rule. Defaults to the url's port, else 443 for https
  # and 80 for http.
  port: null
  # Replaces the generated remoteHost rule, for a tile server inside the
  # cluster. Fields of a UDS Package allow entry, for example:
  #   egress:
  #     remoteNamespace: tiles
  #     remoteSelector: {app: tileserver}
  #     port: 8080
  # The rule always applies to the cloudtak pod only.
  egress: {}

# Steady working set from tests/usage.sh at the end of install, run
# 40174810574, higher of amd64 and arm64. Requests sit near that set.
# Limits are the set plus headroom. The SSO limit stays 512Mi: the sample
# was 67Mi, and an earlier note had this container near 270Mi.
resources:
  cloudtak:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi
  sso:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  bootstrap:
    requests:
      cpu: 10m
      memory: 48Mi
    limits:
      cpu: 200m
      memory: 128Mi
  postgis:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
