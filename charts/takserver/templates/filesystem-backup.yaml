# Velero node-agent and the host-access exemption it needs.
# Off unless FILESYSTEM_BACKUP=true. See adr/0017-velero-node-agent.md.
apiVersion: uds.dev/v1alpha1
kind: Exemption
metadata:
  name: velero-node-agent
  namespace: uds-policy-exemptions
spec:
  exemptions:
    - policies:
        - DisallowPrivileged
        - RequireNonRootUser
        - DropAllCapabilities
        - RestrictCapabilities
        - RestrictHostPathWrite
        - RestrictVolumeTypes
        - DisallowHostNamespaces
        - RestrictSELinuxType
      matcher:
        namespace: {{ .Values.backup.filesystem.namespace | quote }}
        name: "^node-agent-.*"
        kind: pod
      title: "Velero node-agent"
      description: "File-system backup mounts pod volumes from the node kubelet directory. The agent is privileged and runs as root. The matcher is that DaemonSet."
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-agent
  namespace: {{ .Values.backup.filesystem.namespace }}
  labels:
    app.kubernetes.io/name: velero
spec:
  selector:
    matchLabels:
      name: node-agent
  template:
    metadata:
      labels:
        name: node-agent
        app.kubernetes.io/name: velero
    spec:
      serviceAccountName: {{ .Values.backup.filesystem.serviceAccount }}
      automountServiceAccountToken: true
      tolerations:
        - operator: Exists
      containers:
        - name: node-agent
          image: {{ .Values.backup.filesystem.image | quote }}
          imagePullPolicy: IfNotPresent
          command:
            - /velero
          args:
            - node-agent
            - server
          env:
            - name: VELERO_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: VELERO_SCRATCH_DIR
              value: /scratch
            - name: AWS_SHARED_CREDENTIALS_FILE
              value: /credentials/cloud
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /credentials/cloud
            - name: AZURE_CREDENTIALS_FILE
              value: /credentials/cloud
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: cloud-credentials
              mountPath: /credentials
              readOnly: true
            - name: host-pods
              mountPath: /host_pods
              mountPropagation: HostToContainer
            - name: host-plugins
              mountPath: /host_plugins
              mountPropagation: HostToContainer
            - name: scratch
              mountPath: /scratch
      volumes:
        - name: cloud-credentials
          secret:
            secretName: {{ .Values.backup.filesystem.credentialSecret }}
        - name: host-pods
          hostPath:
            path: /var/lib/kubelet/pods
        - name: host-plugins
          hostPath:
            path: /var/lib/kubelet/plugins
        - name: scratch
          emptyDir: {}
{{- end }}
