apiVersion: uds.dev/v1alpha1
kind: Package
metadata:
  name: takserver
  namespace: {{ .Release.Namespace }}
spec:
  {{- if .Capabilities.APIVersions.Has "monitoring.coreos.com/v1" }}
  # The JMX exporter javaagent in the API and messaging pods listens on
  # plaintext 9100. The admission module names that container port metrics. Absent when the monitoring API is not installed.
  monitor:
    - description: tak-api
      kind: PodMonitor
      selector:
        {{- toYaml .Values.api.selector | nindent 8 }}
      portName: metrics
      targetPort: 9100
      path: /metrics
    {{- if include "takserver.healthEnabled" . }}
    - description: tak-certificates
      kind: PodMonitor
      selector:
        app: tak-health
      portName: http
      targetPort: {{ .Values.health.port }}
      path: /metrics
    {{- end }}
    - description: tak-messaging
      kind: PodMonitor
      selector:
        {{- toYaml .Values.messaging.selector | nindent 8 }}
      portName: metrics
      targetPort: 9100
      path: /metrics
  {{- end }}
  # Operator-managed CA bundle. The upstream chart has no value that mounts it.
  caBundle:
    configMap:
      name: uds-trust-bundle
      key: ca-bundle.pem
  {{- if .Values.sso.enabled }}
  sso:
    - name: TAK Server Login
      description: "Keycloak client for TAK native OIDC on the tenant gateway."
      protocol: openid-connect
      clientId: {{ .Values.sso.clientId | quote }}
      enabled: true
      standardFlowEnabled: true
      publicClient: false
      fullScopeAllowed: false
      # TAK does not send PKCE. Do not set pkce.code.challenge.method.
      attributes:
        use.refresh.tokens: "true"
        client.session.idle.timeout: {{ .Values.sso.sessionIdleTimeout | quote }}
        client.session.max.lifespan: {{ .Values.sso.sessionMaxLifespan | quote }}
        post.logout.redirect.uris: {{ include "takserver.redirectUri" . | quote }}
      defaultClientScopes:
        - openid
        - profile
        - email
      # Coarse Keycloak gate. TAK still maps /TAK/... and the admin claim.
      groups:
        anyOf:
          - {{ .Values.sso.adminGroup | quote }}
      secretConfig:
        name: {{ .Values.sso.secretName | quote }}
        labels:
          uds.dev/pod-reload: "true"
        annotations:
          uds.dev/pod-reload-selector: "uds.dev/oidc-reload=takserver"
        template:
          TAK_OIDC_CLIENT_SECRET: "clientField(secret)"
      redirectUris:
        # TAK OAuthApi sends this exact redirect_uri on /login/auth.
        - {{ include "takserver.redirectUri" . | quote }}
      # oidc-group-membership-mapper is on the UDS default mapper allowlist.
      # SECURITY_HARDENING_ADDITIONAL_PROTOCOL_MAPPERS stays empty.
      protocolMappers:
        - name: group-membership
          protocol: openid-connect
          protocolMapper: oidc-group-membership-mapper
          config:
            claim.name: groups
            full.path: "true"
            access.token.claim: "true"
            id.token.claim: "true"
            userinfo.token.claim: "false"
  {{- end }}
  network:
    # Ambient labels the namespace istio.io/dataplane-mode=ambient and does
    # not inject istio-proxy. There is no waypoint. Passthrough TLS on 8443,
    # 8446, and 8089 has to reach TAK, and Authservice is not enabled.
    serviceMesh:
      mode: ambient
    # The passthrough entries below (8443, 8446, 8089) have no uptime check.
    # The operator's Blackbox module only does an HTTPS GET that must trust
    # the server certificate. TAK serves its own deploy-time CA there, 8443
    # and 8089 also require a client certificate, and 8089 is not HTTP. They
    # are for TAK clients, not browsers, so UDS Portal does not list them.
    # The tak-health entry covers them instead: its pod connects as a TAK
    # client and serves a plain HTTP answer per port for the uptime check.
    expose:
      {{- if .Values.sso.enabled }}
      - description: tak-web-http
        service: {{ .Values.api.web.service | quote }}
        selector:
          {{- toYaml .Values.api.selector | nindent 10 }}
        gateway: tenant
        host: {{ .Values.api.web.host | quote }}
        port: {{ .Values.api.web.port }}
        annotations:
          {{- toYaml (mergeOverwrite (dict "uds.dev/title" "TAK Server") .Values.exposeAnnotations) | nindent 10 }}
        # The operator turns each path into a Blackbox probe of
        # https://<host>.<domain><path>. TAK's own controller serves /login
        # with 200 and no redirect, so a pass means TAK answered, not
        # Keycloak. Same reason UDS Core probes Grafana on /healthz. "/" also
        # passes, but only after a redirect. tests/uptime-probes.sh checks
        # that /login stays at zero redirects.
        {{- if .Values.uptime.enabled }}
        uptime:
          checks:
            paths:
              - /login
        {{- end }}
      {{- end }}
      {{- if include "takserver.healthEnabled" . }}
      # Client-port health. Each path reports one TAK client port: /stream
      # 8089, /api 8443, /enroll 8446. Hidden from the Portal.
      - description: tak-health
        service: tak-health
        selector:
          app: tak-health
        gateway: {{ .Values.health.gateway }}
        host: {{ .Values.health.host | quote }}
        port: {{ .Values.health.port }}
        annotations:
          uds.dev/visible: "false"
        uptime:
          checks:
            paths:
              - /stream
              - /api
              - /enroll
      {{- end }}
      - description: tak-api-https
        service: {{ .Values.api.service | quote }}
        selector:
          {{- toYaml .Values.api.selector | nindent 10 }}
        annotations:
          uds.dev/visible: "false"
        gateway: passthrough
        host: {{ .Values.api.https.host | quote }}
        port: {{ .Values.api.https.port }}
      - description: tak-api-cert
        service: {{ .Values.api.service | quote }}
        selector:
          {{- toYaml .Values.api.selector | nindent 10 }}
        annotations:
          uds.dev/visible: "false"
        gateway: passthrough
        host: {{ .Values.api.cert.host | quote }}
        port: {{ .Values.api.cert.port }}
      - description: tak-messaging-streaming
        service: {{ .Values.messaging.service | quote }}
        selector:
          {{- toYaml .Values.messaging.selector | nindent 10 }}
        annotations:
          uds.dev/visible: "false"
        gateway: passthrough
        host: {{ .Values.messaging.streaming.host | quote }}
        port: {{ .Values.messaging.streaming.port }}
      {{- if .Values.quic.enabled }}
      # UDP has no host. Envoy Gateway routes by port. Istio AuthorizationPolicy
      # does not cover it. TAK requires the client certificate itself. The UDS
      # operator writes the UDPRoute and the one ingress NetworkPolicy, from
      # the Envoy default gateway proxy to the messaging pods on this port.
      - description: tak-messaging-quic
        service: takserver-messaging-quic
        selector:
          {{- toYaml .Values.messaging.selector | nindent 10 }}
        protocol: UDP
        port: {{ .Values.quic.port }}
      {{- end }}
    allow:
      {{- if include "takserver.healthEnabled" . }}
      # tak-health reaches TAK the way a client does, through the
      # passthrough gateway.
      {{- range $port := list 443 8446 8089 }}
      - direction: Egress
        selector:
          app: tak-health
        remoteNamespace: istio-passthrough-gateway
        remoteSelector:
          app: passthrough-ingressgateway
        port: {{ $port }}
        description: "Egress {{ $port }} from tak-health to the passthrough gateway"
      {{- end }}
      {{- end }}
      # Explicit pod-to-pod flows from values intraNamespace.flows. There is
      # no namespace-wide allow rule.
      {{- range $flow := .Values.intraNamespace.flows }}
      {{- range $client := $flow.clients }}
      {{- $clientName := (values $client | first) }}
      {{- range $port := $flow.ports }}
      - direction: Egress
        selector:
          {{- toYaml $client | nindent 10 }}
        remoteSelector:
          {{- toYaml $flow.server | nindent 10 }}
        port: {{ $port }}
        description: "Egress {{ $port }} from {{ $clientName }} to {{ $flow.name }}"
      - direction: Ingress
        selector:
          {{- toYaml $flow.server | nindent 10 }}
        remoteSelector:
          {{- toYaml $client | nindent 10 }}
        {{- include "takserver.remoteServiceAccount" (list $ $clientName) | nindent 8 }}
        port: {{ $port }}
        description: "Ingress {{ $port }} to {{ $flow.name }} from {{ $clientName }}"
      {{- end }}
      {{- end }}
      {{- end }}

      # Ignite client nodes talk to each other on the communication port.
      {{- $peers := .Values.intraNamespace.igniteClientPeers }}
      {{- range $a := $peers.selectors }}
      {{- range $b := $peers.selectors }}
      {{- if ne (toYaml $a) (toYaml $b) }}
      - direction: Egress
        selector:
          {{- toYaml $a | nindent 10 }}
        remoteSelector:
          {{- toYaml $b | nindent 10 }}
        port: {{ $peers.port }}
        description: "Egress {{ $peers.port }} from {{ values $a | first }} to {{ values $b | first }}"
      - direction: Ingress
        selector:
          {{- toYaml $b | nindent 10 }}
        remoteSelector:
          {{- toYaml $a | nindent 10 }}
        {{- include "takserver.remoteServiceAccount" (list $ (values $a | first)) | nindent 8 }}
        port: {{ $peers.port }}
        description: "Ingress {{ $peers.port }} to {{ values $b | first }} from {{ values $a | first }}"
      {{- end }}
      {{- end }}
      {{- end }}

      # Ignite and the TAK clients discover the Ignite Service through the
      # Kubernetes API. The chart gives those pods the takserver-ignite
      # ServiceAccount. A rule limited to the Ignite pod label drops the
      # clients' API calls during the TLS handshake.
      {{- range .Values.kubeApi.selectors }}
      - direction: Egress
        selector:
          {{- toYaml . | nindent 10 }}
        remoteGenerated: KubeAPI
        description: "Ignite Kubernetes discovery for {{ .app }}"
      {{- end }}
      {{- if .Values.backup.dump.enabled }}
      # The logical dump CronJob. It is off unless a bundle sets
      # backup.dump.enabled, so a slim install has neither the pod nor these
      # rules. See adr/0016-logical-db-dump.md.
      - direction: Egress
        selector:
          app: tak-db-dump
        remoteSelector:
          app.kubernetes.io/name: postgresql
          app.kubernetes.io/component: primary
        port: 5432
        description: "Egress 5432 from the logical dump to Postgres"
      - direction: Ingress
        selector:
          app.kubernetes.io/name: postgresql
          app.kubernetes.io/component: primary
        remoteSelector:
          app: tak-db-dump
        remoteServiceAccount: tak-db-dump
        port: 5432
        description: "Ingress 5432 to Postgres from the logical dump"
      - direction: Egress
        selector:
          app: tak-db-dump
        remoteGenerated: KubeAPI
        description: "Logical dump writes Secret tak-db-dump"
      {{- end }}

      # Ignite discovery (47500), communication (47100), and the thin client
      # (10800) are bidirectional. A missing return path stalls until
      # igniteConnectionTimeoutSeconds, which defaults to 300.
      {{- $ignitePorts := list 47100 47500 10800 }}
      {{- range $sel := .Values.kubeApi.selectors }}
      {{- if ne $sel.app "takserver-ignite" }}
      {{- range $port := $ignitePorts }}
      - direction: Ingress
        selector:
          app: {{ $sel.app }}
        remoteSelector:
          app: takserver-ignite
        {{- include "takserver.remoteServiceAccount" (list $ "takserver-ignite") | nindent 8 }}
        port: {{ $port }}
        description: "Ingress {{ $port }} to {{ $sel.app }} from Ignite"
      - direction: Egress
        selector:
          app: {{ $sel.app }}
        remoteSelector:
          app: takserver-ignite
        port: {{ $port }}
        description: "Egress {{ $port }} from {{ $sel.app }} to Ignite"
      - direction: Ingress
        selector:
          app: takserver-ignite
        remoteSelector:
          app: {{ $sel.app }}
        {{- include "takserver.remoteServiceAccount" (list $ $sel.app) | nindent 8 }}
        port: {{ $port }}
        description: "Ingress {{ $port }} to Ignite from {{ $sel.app }}"
      - direction: Egress
        selector:
          app: takserver-ignite
        remoteSelector:
          app: {{ $sel.app }}
        port: {{ $port }}
        description: "Egress {{ $port }} from Ignite to {{ $sel.app }}"
      {{- end }}
      {{- end }}
      {{- end }}

      {{- if .Values.sso.enabled }}
      # sso.<domain> is 127.0.0.1 in public DNS. The in-cluster DNS rewrite
      # (zarf.yaml) answers the tenant gateway ClusterIP, which is this selector.
      # Istio gateway chart 1.31 with release tenant-ingressgateway labels
      # pods app=tenant-ingressgateway and istio=tenant-ingressgateway.
      # Messaging needs it too: on 8089 a certificate enrolled with a bearer
      # token is checked by validating that token against the Keycloak keys.
      {{- range $component := list .Values.api .Values.messaging }}
      - direction: Egress
        remoteNamespace: istio-tenant-gateway
        remoteSelector:
          app: tenant-ingressgateway
          istio: tenant-ingressgateway
        selector:
          {{- toYaml $component.selector | nindent 10 }}
        port: 443
        description: "Keycloak discovery, token, and JWKS for {{ index $component.selector "app" }}"
      {{- end }}
      {{- end }}

      {{- with .Values.cloudtak }}
      {{- if .enabled }}
      # CloudTAK in namespace {{ .namespace }}. Its Package CR has the
      # matching Egress rules. See docs/cloudtak.md.
      {{- range $port := list 8443 (int $.Values.api.web.port) }}
      - direction: Ingress
        selector:
          {{- toYaml $.Values.api.selector | nindent 10 }}
        remoteNamespace: {{ $.Values.cloudtak.namespace | quote }}
        remoteSelector:
          {{- toYaml $.Values.cloudtak.selector | nindent 10 }}
        remoteServiceAccount: {{ $.Values.cloudtak.serviceAccount | quote }}
        port: {{ $port }}
        description: "Ingress {{ $port }} to TAK API from CloudTAK"
      {{- end }}
      - direction: Ingress
        selector:
          {{- toYaml $.Values.messaging.selector | nindent 10 }}
        remoteNamespace: {{ .namespace | quote }}
        remoteSelector:
          {{- toYaml .selector | nindent 10 }}
        remoteServiceAccount: {{ .serviceAccount | quote }}
        port: {{ $.Values.messaging.streaming.port }}
        description: "Ingress {{ $.Values.messaging.streaming.port }} to TAK messaging from CloudTAK"
      {{- end }}
      {{- end }}

      # The takserver-oidc watcher registers TakClient callsigns as TAK file
      # users through the admin API (ADR 22).
      - direction: Ingress
        selector:
          {{- toYaml .Values.api.selector | nindent 10 }}
        remoteNamespace: pepr-system
        remoteSelector:
          app: pepr-c72fcf944a4f43bbb386d22371aa640f-watcher
        remoteServiceAccount: pepr-c72fcf944a4f43bbb386d22371aa640f-watcher
        port: 8443
        description: "Ingress 8443 to TAK API from the TakClient watcher"

      {{- with .Values.additionalNetworkAllow }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
