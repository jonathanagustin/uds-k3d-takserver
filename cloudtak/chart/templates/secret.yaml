# Generated on first install and kept on upgrade. Nothing here is in git.
{{- $existing := lookup "v1" "Secret" .Release.Namespace "cloudtak" }}
{{- $data := dict }}
{{- if $existing }}
{{- $data = $existing.data }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: cloudtak
type: Opaque
data:
  # Signs CloudTAK session tokens.
  SIGNING_SECRET: {{ get $data "SIGNING_SECRET" | default (randAlphaNum 48 | b64enc) }}
  POSTGRES_PASSWORD: {{ get $data "POSTGRES_PASSWORD" | default (randAlphaNum 32 | b64enc) }}
  # TAK requires 15+ characters with upper, lower, digit, and one of -_!@#...
  CLOUDTAK_PASSWORD: {{ get $data "CLOUDTAK_PASSWORD" | default (printf "%s-Aa1" (randAlphaNum 28) | b64enc) }}
