apiVersion: uds.dev/v1alpha1
kind: Package
metadata:
  name: cloudtak
  namespace: {{ .Release.Namespace }}
spec:
  sso:
    # Authservice client. Keycloak signs the user in before any CloudTAK
    # page or API call reaches the pod. CloudTAK does not read the token.
    - name: CloudTAK
      description: "Keycloak gate for the CloudTAK map on the tenant gateway."
      clientId: {{ .Values.sso.clientId | quote }}
      redirectUris:
        # Authservice owns this path. It is not a CloudTAK route, and
        # CloudTAK's own /login page stays reachable.
        - "{{ include "cloudtak.url" . }}/oauth2/callback"
      enableAuthserviceSelector:
        app: cloudtak
      groups:
        anyOf:
          {{- toYaml .Values.sso.groups | nindent 10 }}
  network:
    serviceMesh:
      mode: ambient
    expose:
      - description: cloudtak-map
        service: cloudtak
        selector:
          app: cloudtak
        gateway: tenant
        host: {{ .Values.host | quote }}
        port: 5000
    allow:
      - direction: Egress
        selector:
          app: cloudtak
        remoteSelector:
          app: cloudtak-postgis
        port: 5432
        description: "Egress 5432 from cloudtak to its PostGIS"
      - direction: Ingress
        selector:
          app: cloudtak-postgis
        remoteSelector:
          app: cloudtak
        port: 5432
        description: "Ingress 5432 to PostGIS from cloudtak"
      # TAK on 8443 (admin certificate API), 8447 (password sign-in and
      # certificate enrollment), and 8089 (CoT streaming). The takserver
      # Package CR has the matching Ingress rules.
      {{- range $port := list 8443 (int .Values.tak.webPort) }}
      - direction: Egress
        selector:
          app: cloudtak
        remoteNamespace: {{ $.Values.tak.namespace | quote }}
        remoteSelector:
          {{- toYaml $.Values.tak.apiSelector | nindent 10 }}
        port: {{ $port }}
        description: "Egress {{ $port }} from cloudtak to TAK API"
      {{- end }}
      - direction: Egress
        selector:
          app: cloudtak
        remoteNamespace: {{ .Values.tak.namespace | quote }}
        remoteSelector:
          {{- toYaml .Values.tak.messagingSelector | nindent 10 }}
        port: 8089
        description: "Egress 8089 from cloudtak to TAK messaging"
