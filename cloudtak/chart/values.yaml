domain: "###ZARF_VAR_DOMAIN###"

# Browser host on the tenant gateway: https://<host>.<domain>/
host: map

image:
  repository: ghcr.io/jonathanagustin/uds-k3d-takserver/cloudtak
  tag: v13.111.3 # cloudtak-version

postgis:
  # The image the TAK chart already uses. One image covers both databases.
  image: docker.io/postgis/postgis:15-3.4
  storage: 2Gi
  database: cloudtak
  username: cloudtak

# Keycloak in front of CloudTAK, through UDS Authservice. CloudTAK has no
# OIDC login of its own, so a user still signs in to CloudTAK with a TAK
# account after Keycloak. See docs/cloudtak.md.
sso:
  clientId: uds-cloudtak
  # Same coarse gate as the TAK client.
  groups:
    - "/UDS Core/Admin"

# Where TAK lives. The takserver component renders the matching Ingress
# rules in its own Package CR.
tak:
  namespace: takserver
  apiService: takserver-api-service
  apiSelector:
    app: takserver-api
  webService: takserver-web
  webPort: 8447
  messagingService: takserver-messaging-service
  messagingSelector:
    app: takserver-messaging
  # Secret the cloudtak component's onDeploy action copies from ConfigMap
  # cert-migration: ca.pem, admin.pem, admin.key.
  adminSecret: cloudtak-tak-admin

# TAK file user CloudTAK signs in with, and the TAK groups it gets. The
# bootstrap container creates it and makes it the CloudTAK system admin.
# The password is generated on first install and kept in Secret cloudtak.
account:
  username: cloudtak-admin
  groups: Operators

resources:
  cloudtak:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      memory: 1Gi
  bootstrap:
    requests:
      cpu: 10m
      memory: 48Mi
    limits:
      memory: 128Mi
  postgis:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
