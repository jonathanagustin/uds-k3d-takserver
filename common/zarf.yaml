# yaml-language-server: $schema=https://raw.githubusercontent.com/zarf-dev/zarf/main/zarf.schema.json
kind: ZarfPackageConfig
metadata:
  name: takserver-common
  description: Shared TAK Server charts imported by the root package

components:
  - name: takserver
    required: true
    charts:
      # Installed first. It creates the Secret and ConfigMaps the upstream
      # chart mounts. Zarf installs charts before manifests, so those objects
      # live in this chart rather than a manifest.
      - name: uds-takserver-config
        namespace: takserver
        version: 0.6.0 # x-release-please-version
        localPath: ../charts/takserver
        values:
          - sourcePath: .global.domain
            targetPath: .domain
      # Admission module. Installed before the upstream chart so that every
      # TAK pod is created with the init container that renders the OIDC client
      # secret into CoreConfig.xml. The chart is built by pepr/build.sh when the
      # package is created. Zarf waits for its Deployment to be ready.
      - name: takserver-oidc
        namespace: pepr-system
        version: 0.1.0
        localPath: ../pepr/dist/c72fcf944a4f43bbb386d22371aa640f-chart
        templatedValuesFiles:
          - ../values/pepr-values.yaml
      # Upstream chart. Not vendored. `version` is the git tag Zarf clones.
      # releaseName stays takserver so the Bitnami Postgres Service is
      # takserver-postgresql, which is the host the chart's own example uses.
      - name: takserver
        namespace: takserver
        releaseName: takserver
        url: https://github.com/TAK-Product-Center/Server.git
        gitPath: src/takserver-cluster/deployments/helm
        version: 5.7-RELEASE-14
        valuesFiles:
          - ../values/common-values.yaml
        values:
          - sourcePath: .tak.imageTag
            targetPath: .takserver.config.image.tag
          - sourcePath: .tak.imageTag
            targetPath: .takserver.messaging.image.tag
          - sourcePath: .tak.imageTag
            targetPath: .takserver.api.image.tag
          - sourcePath: .tak.imageTag
            targetPath: .takserver.plugins.image.tag
          - sourcePath: .tak.imageTag
            targetPath: .takserver.takserverDatabaseSetup.image.tag
          - sourcePath: .tak.imageTag
            targetPath: .ignite.image.tag
