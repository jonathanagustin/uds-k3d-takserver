id: AC-17
title: Remote Access
family: AC
description: Package evidence notes for Remote Access. Consult the authoritative NIST control and the deployment
  assessment for full requirements.
implementation_status: Partially Implemented
control_implementation_narrative: The standard client routes forward enrollment and streaming through the passthrough
  gateway to TAK. They preserve application TLS. Device administration, remote-access approvals, endpoint custody,
  and organizational monitoring are outside this package.
assessment_procedures: 'Review the marked source against the deployed version. Relevant automated checks: tests/api-smoke.sh,
  tests/sso.spec.ts. Re-run deployment checks in the target environment and record outcomes before assessment.'
test_results: Not assessed. Linked tests are existing evidence procedures; this control set does not claim a fresh
  live assessment or independent approval.
