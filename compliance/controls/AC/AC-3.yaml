control_implementation_narrative: The TAK Keycloak client restricts browser sign-in to the configured admin group.
  TAK separately uses certificate/file-user groups for data authorization. This covers package gates; organization-wide
  account policy and all upstream endpoint authorization require assessment.
assessment_procedures: 'Review the marked source against the deployed version. Relevant automated checks: tests/sso-denied.spec.ts,
  tests/api-smoke.sh. Re-run deployment checks in the target environment and record outcomes before assessment.'
test_results: Not assessed. Linked tests are existing evidence procedures; this control set does not claim a fresh
  live assessment or independent approval.
