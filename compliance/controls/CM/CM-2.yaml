id: CM-2
title: Baseline Configuration
family: CM
description: Package evidence notes for Baseline Configuration. Consult the authoritative NIST control and the deployment
  assessment for full requirements.
implementation_status: Partially Implemented
control_implementation_narrative: The common values overlay records the package baseline for TAK images, services,
  databases, resource limits, and integration settings. Git review and deployment tests track changes. Production
  secrets, tailored hardening, drift response, and a formally approved organizational baseline are outside this
  package-level record.
assessment_procedures: 'Review the marked source against the deployed version. Relevant automated checks: tests/test_package_values.py,
  tests/test_profiles.py, tasks/test.yaml. Re-run deployment checks in the target environment and record outcomes
  before assessment.'
test_results: Not assessed. Linked tests are existing evidence procedures; this control set does not claim a fresh
  live assessment or independent approval.
