id: SC-23
title: Session Authenticity
family: SC
description: Package evidence notes for Session Authenticity. Consult the authoritative NIST control and the deployment
  assessment for full requirements.
implementation_status: Partially Implemented
control_implementation_narrative: TakClient issuance binds a unique certificate serial and callsign to a client-authentication
  certificate signed by the TAK CA. TAK maps that identity to its file user/groups. Browser session lifecycle, every
  upstream session boundary, and revocation timing require separate assessment; current CRL changes restart TAK.
assessment_procedures: 'Review the marked source against the deployed version. Relevant automated checks: pepr/capabilities/takclient.test.ts,
  tests/api-smoke.sh. Re-run deployment checks in the target environment and record outcomes before assessment.'
test_results: Not assessed. Linked tests are existing evidence procedures; this control set does not claim a fresh
  live assessment or independent approval.
