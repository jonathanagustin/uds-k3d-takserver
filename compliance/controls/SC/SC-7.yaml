id: SC-7
title: Boundary Protection
family: SC
description: Package evidence notes for Boundary Protection. Consult the authoritative NIST control and the deployment
  assessment for full requirements.
implementation_status: Partially Implemented
control_implementation_narrative: A namespace-wide Istio DENY policy blocks plaintext port 8080, including the upstream
  actuator and Ignite REST listeners. Other boundaries rely on UDS Package network rules and the deployment network.
  This does not establish every organizational boundary control.
assessment_procedures: 'Review the marked source against the deployed version. Relevant automated checks: tasks/test.yaml,
  tests/flows.py. Re-run deployment checks in the target environment and record outcomes before assessment.'
test_results: Not assessed. Linked tests are existing evidence procedures; this control set does not claim a fresh
  live assessment or independent approval.
