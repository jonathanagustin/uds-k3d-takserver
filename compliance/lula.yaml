name: TAK package control evidence (draft)
version: 0.1.0
description: Proposed package evidence for selected NIST SP 800-53 Rev. 5 base controls. This is not an authoritative
  catalog, assessment, authorization, or certification.
source: https://csrc.nist.gov/publications/detail/sp/800-53/rev-5/final
families:
  - id: AC
    name: Access Control
  - id: IA
    name: Identification and Authentication
  - id: SC
    name: System and Communications Protection
  - id: AU
    name: Audit and Accountability
  - id: CM
    name: Configuration Management
  - id: SI
    name: System and Information Integrity
