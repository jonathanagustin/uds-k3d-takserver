[[IgnoredVulns]]
# minimatch ReDoS through globparts amplification. OSV lists 11.0.1 as the
# first fixed version, and nothing on the 10.x line has the fix. Pepr 2.0.5
# depends on eslint, and eslint, @eslint/config-array and
# @typescript-eslint/typescript-estree require minimatch ^10. Only the Pepr
# CLI's format and lint commands load eslint, on this repository's own
# source globs. The module bundle and the admission controller don't import
# it. Remove this entry when eslint and typescript-eslint accept minimatch 11.
id = "GHSA-g3hv-75wg-m249"
ignoreUntil = 2027-01-31
reason = "minimatch 10.2.6 comes in through Pepr's eslint dependency (eslint and typescript-eslint need ^10). Only the Pepr CLI format and lint commands load it, on this repository's own globs, and it is not in the module bundle. The fix is only in 11.0.1."
