# Full-core CI only. k3d's local-path class makes hostPath PVs, and Velero
# skips hostPath volumes in file-system backup. The same provisioner makes
# local PVs when the class carries defaultVolumeType: local.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-path-local
  annotations:
    defaultVolumeType: local
provisioner: rancher.io/local-path
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
