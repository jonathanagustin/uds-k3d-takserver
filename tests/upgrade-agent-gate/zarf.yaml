kind: ZarfPackageConfig
metadata:
  name: upgrade-agent-gate
  version: 0.0.0
  description: CI-only agent availability barrier around the released Core transition
components:
  - name: agent-ready
    required: true
    files:
      - source: live-health.py
        target: .cache/upgrade-agent-gate/live-health.py
    actions:
      onDeploy:
        before:
          - description: Wait for the restored Zarf agent deployment
            maxTotalSeconds: 300
            wait:
              cluster:
                kind: deployment
                name: agent-hook
                namespace: zarf
                condition: Available
          - description: Wait for a ready agent endpoint (not a notReadyAddress)
            maxTotalSeconds: 45
            wait:
              cluster:
                kind: endpoints
                name: agent-hook
                namespace: zarf
                condition: '{.subsets[0].addresses[0].targetRef.kind}=Pod'
          - description: Verify endpoint metadata advertises target port 8443
            maxTotalSeconds: 15
            wait:
              cluster:
                kind: endpoints
                name: agent-hook
                namespace: zarf
                condition: '{.subsets[0].ports[0].port}=8443'
        after:
          - description: Probe live agent HTTPS health through the Kubernetes API
            maxTotalSeconds: 40
            cmd: python3 .cache/upgrade-agent-gate/live-health.py
