# Values for the takserver-oidc module. The chart is generated by
# pepr/build.sh. Setting env replaces the chart's default list, so the two
# defaults are repeated here. The chart appends PEPR_WATCH_MODE itself.
admission:
  env:
    - name: PEPR_PRETTY_LOG
      value: "false"
    - name: LOG_LEVEL
      value: "info"
    # Image for the init container that renders the OIDC client secret. The
    # config image has bash and envsubst.
    - name: RENDER_IMAGE
      value: "ghcr.io/jonathanagustin/uds-k3d-takserver/takserver-config:{{ .Values.tak.imageTag }}"
    # Admission and the watcher both set the plugins memory, so both read
    # the same package values. Different values would undo each other.
    - name: PLUGINS_MEMORY_REQUEST
      value: "{{ .Values.tak.plugins.memoryRequest }}"
    - name: PLUGINS_MEMORY_LIMIT
      value: "{{ .Values.tak.plugins.memoryLimit }}"
  # Two replicas keep admission available through a rollout. The requests
  # are small so both fit beside TAK on a 2 CPU node, as for pepr-uds-core.
  resources:
    requests:
      cpu: "25m"
      memory: "48Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"

# The watcher runs the reconciles.
watcher:
  env:
    - name: PEPR_PRETTY_LOG
      value: "false"
    - name: LOG_LEVEL
      value: "info"
    - name: RENDER_IMAGE
      value: "ghcr.io/jonathanagustin/uds-k3d-takserver/takserver-config:{{ .Values.tak.imageTag }}"
    - name: IN_CLUSTER_DNS
      value: "{{ .Values.dns.inCluster }}"
    - name: DOMAIN
      value: "{{ .Values.global.domain }}"
    - name: PASSTHROUGH_HOSTS
      value: "{{ .Values.dns.passthroughHosts }}"
    - name: PLUGINS_MEMORY_REQUEST
      value: "{{ .Values.tak.plugins.memoryRequest }}"
    - name: PLUGINS_MEMORY_LIMIT
      value: "{{ .Values.tak.plugins.memoryLimit }}"
  # The watcher caches every object its reconciles watch. At 256Mi it was
  # OOM-killed during CI installs, so the limit is 512Mi.
  resources:
    requests:
      cpu: "25m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
