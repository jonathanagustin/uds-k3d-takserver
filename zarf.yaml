# yaml-language-server: $schema=https://raw.githubusercontent.com/zarf-dev/zarf/main/zarf.schema.json
kind: ZarfPackageConfig
metadata:
  name: takserver
  description: TAK Server and CloudTAK on UDS Core, packaged with Zarf for Kubernetes.
  version: dev
  # Read by UDS Portal and the package catalog. See
  # https://docs.defenseunicorns.com/core/concepts/configuration-and-packaging/package-metadata/
  annotations:
    dev.uds.title: TAK Server
    dev.uds.tagline: TAK Server with Keycloak SSO and CloudTAK maps
    dev.uds.categories: Command And Control, Situational Awareness
    dev.uds.keywords: TAK, TAK Server, CloudTAK, Cursor on Target, CoT, ATAK
    # base64 of assets/icon.svg. hk's icon check fails when they differ.
    dev.uds.icon: data:image/svg+xml;base64,

# Shipped in the package. Inspect with: uds zarf package inspect documentation
documentation:
  README: README.md
  configuration: docs/configuration.md
  sso: docs/sso.md
  networking: docs/networking.md
  justifications: docs/justifications.md
  data: docs/data.md
  cloudtak: docs/cloudtak.md
  profiles: docs/profiles.md
  ci: docs/ci.md
  building: docs/building.md
  benchmarks: docs/benchmarks.md
  atak-device: docs/atak-device.md

# Beta. Chart mappings read these. Each default is the placeholder of the
# matching variable below, so the variables still decide the result, from
# `--set` or a bundle's uds-config.yaml. A package value set at deploy
# overrides its variable. docs/configuration.md has the table.
values:
  files:
    - values/zarf-values.yaml
  schema: values/zarf-values.schema.json

variables:
  - name: DOMAIN
    description: Domain suffix for gateway hosts. k3d-core-slim-dev uses uds.dev. The global.domain package value defaults to this and overrides it when set.
    default: uds.dev
  - name: TAK_IMAGE_TAG
    description: Tag for images published at ghcr.io/jonathanagustin/uds-takserver. Building those images is separate from this package. The tak.imageTag package value defaults to this. The images list and certs.image read only this variable.
    default: 5.7-RELEASE-14
  - name: IN_CLUSTER_DNS
    description: On a uds-k3d cluster, the takserver-oidc watcher adds CoreDNS rewrites so DOMAIN hosts resolve to the right Istio gateway inside the cluster. Skipped when kube-system/coredns-custom does not exist. The dns.inCluster package value defaults to this.
    default: "true"
  - name: PASSTHROUGH_HOSTS
    description: Hosts under DOMAIN that the passthrough gateway serves by SNI. charts/takserver/values.yaml api.cert.host and messaging.streaming.host. The dns.passthroughHosts package value defaults to this.
    default: "takserver-api takserver-stream"
  - name: PLUGINS_MEMORY_REQUEST
    description: Memory request for the TAK plugins container. The takserver-oidc module sets it at admission and in the watcher, so the chart and the values profiles cannot. The tak.plugins.memoryRequest package value defaults to this.
    default: 320Mi
  - name: PLUGINS_MEMORY_LIMIT
    description: Memory limit for the TAK plugins container. The plugin heap is 128m. The tak.plugins.memoryLimit package value defaults to this.
    default: 512Mi
  - name: FILESYSTEM_BACKUP
    description: When true, annotate the database volumes for Velero file-system backup and run the node-agent. Default false. The logical dump stays the full-bundle path. See adr/0021-velero-node-agent.md.
    default: "false"
  - name: FILESYSTEM_BACKUP_OWNER
    description: "Experimental file-system node-agent owner: local (default) or core. Core requires a separately prepared bootstrap exemption, upstream chart overrides and verified ownership handoff; never switch an existing install directly. See adr/0021-velero-node-agent.md."
    default: local
  - name: POSTGRES_STORAGE_CLASS
    description: StorageClass for the TAK Postgres volume. Empty (the default) keeps the cluster default class, so existing installs are unchanged. Set it only on a new install; a StatefulSet volume claim template cannot change later. File-system backup needs a class whose volumes are not hostPath. See docs/data.md.
    default: ""
  - name: CLOUDTAK_STORAGE_CLASS
    description: StorageClass for the CloudTAK PostGIS volume. Empty (the default) keeps the cluster default class, so existing installs are unchanged. Set it only on a new install; a StatefulSet volume claim template cannot change later. File-system backup needs a class whose volumes are not hostPath. See docs/data.md.
    default: ""

components:
  - name: takserver
    required: true
    description: Deploy TAK Server and the UDS Package config chart
    only:
      flavor: upstream
    import:
      path: common
    charts:
      - name: takserver
        valuesFiles:
          - values/upstream-values.yaml
    # The watcher creates this ConfigMap once the four TAK Deployments are
    # Available. Admission shapes those Deployments, the Ignite config, and
    # the Ignite StatefulSet before the first pod, so a cold install does not
    # scale them down. A ConfigMap has no status, so Zarf treats it as healthy
    # once it exists.
    healthChecks:
      - apiVersion: v1
        kind: ConfigMap
        name: takserver-startup
        namespace: takserver
      - apiVersion: uds.dev/v1alpha1
        kind: Package
        name: takserver
        namespace: takserver
    actions:
      onCreate:
        before:
          - description: Build the OIDC render admission module
            dir: pepr
            cmd: ./build.sh

    # TAK images are built from the upstream source and published under this
    # repository. The tag is literal. Zarf 0.87 parses image refs before it
    # applies ###ZARF_VAR_*###, so a variable here is not a valid reference.
    # Helm values still use TAK_IMAGE_TAG. PostGIS and NATS are images the
    # upstream chart's dependencies render. The NATS toolbox is disabled in
    # values/common-values.yaml, so its image is not part of the package.
    images:
      - "ghcr.io/jonathanagustin/uds-takserver/takserver-api:5.7-RELEASE-14"
      - "ghcr.io/jonathanagustin/uds-takserver/takserver-messaging:5.7-RELEASE-14"
      - "ghcr.io/jonathanagustin/uds-takserver/takserver-config:5.7-RELEASE-14"
      - "ghcr.io/jonathanagustin/uds-takserver/takserver-plugins:5.7-RELEASE-14"
      - "ghcr.io/jonathanagustin/uds-takserver/takserver-database-setup:5.7-RELEASE-14"
      - "ghcr.io/jonathanagustin/uds-takserver/takserver-ignite:5.7-RELEASE-14"
      - "ghcr.io/jonathanagustin/uds-takserver/postgis:18-3.6"
      - "docker.io/library/nats:2.15.2-alpine"
      - "docker.io/natsio/nats-server-config-reloader:0.25.0"
      # Same tag UDS Core 1.16.0 runs. The manifest lists amd64 and arm64.
      # The DaemonSet renders only when FILESYSTEM_BACKUP is true.
      - "docker.io/velero/velero:v1.18.4"

  # Browser map client. Built from the upstream/cloudtak submodule by
  # .github/container-and-chart/cloudtak. See docs/cloudtak.md.
  - name: cloudtak
    required: false
    default: true
    description: Deploy CloudTAK, a browser map client connected to this TAK Server
    only:
      flavor: upstream
    charts:
      - name: uds-cloudtak
        namespace: cloudtak
        version: 0.1.0
        localPath: charts/cloudtak
        valuesFiles:
          - values/filesystem-backup-switch.yaml
        # Sets the PostGIS StorageClass only when CLOUDTAK_STORAGE_CLASS is
        # not empty. An empty object otherwise.
        templatedValuesFiles:
          - values/cloudtak-storage.yaml.tpl
        values:
          - sourcePath: .global.domain
            targetPath: .domain
    healthChecks:
      - apiVersion: uds.dev/v1alpha1
        kind: Package
        name: cloudtak
        namespace: cloudtak
      - apiVersion: apps/v1
        kind: Deployment
        name: cloudtak
        namespace: cloudtak
    images:
      - "ghcr.io/jonathanagustin/uds-takserver/cloudtak:v13.112.3" # cloudtak-version
      - "ghcr.io/jonathanagustin/uds-takserver/postgis:18-3.6"
