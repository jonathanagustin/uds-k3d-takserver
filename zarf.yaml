# yaml-language-server: $schema=https://raw.githubusercontent.com/zarf-dev/zarf/main/zarf.schema.json
kind: ZarfPackageConfig
metadata:
  name: takserver
  description: TAK Server packaged for a local UDS cluster
  version: dev
  # Read by UDS Portal and the package catalog. See
  # https://docs.defenseunicorns.com/core/concepts/configuration-and-packaging/package-metadata/
  annotations:
    dev.uds.title: TAK Server
    dev.uds.tagline: Team Awareness Kit server with Keycloak SSO and a CloudTAK browser map
    dev.uds.categories: Command And Control, Situational Awareness
    dev.uds.keywords: TAK, TAK Server, CloudTAK, Cursor on Target, CoT, ATAK
    # base64 of assets/icon.svg. hk's icon check fails when they differ.
    dev.uds.icon: data:image/svg+xml;base64,

# Shipped in the package. Inspect with: uds zarf package inspect documentation
documentation:
  README: README.md
  configuration: docs/configuration.md
  sso: docs/sso.md
  networking: docs/networking.md
  justifications: docs/justifications.md
  data: docs/data.md
  cloudtak: docs/cloudtak.md

# Beta. Chart mappings read these. The variables below stay for UDS CLI 0.40
# bundles, which set Zarf variables and cannot pass package values, and for
# the cert image string. docs/configuration.md lists which path wins.
values:
  files:
    - values/zarf-values.yaml
  schema: values/zarf-values.schema.json

variables:
  - name: DOMAIN
    description: Compatibility variable for UDS bundles. Helm domain comes from global.domain. This still fills cert and ATAK strings that package values cannot.
    default: uds.dev
  - name: TAK_IMAGE_TAG
    description: Compatibility variable. The images list cannot be templated, and charts/takserver certs.image is one string. Helm tag keys come from tak.imageTag. Keep the two equal.
    default: 5.7-RELEASE-14
  - name: IN_CLUSTER_DNS
    description: Compatibility variable. The watcher reads dns.inCluster. Left so uds-config.yaml and --set IN_CLUSTER_DNS= still name a real variable.
    default: "true"
  - name: PASSTHROUGH_HOSTS
    description: Compatibility variable. The watcher reads dns.passthroughHosts. Hosts under the domain that the passthrough gateway serves by SNI.
    default: "takserver-api takserver-stream"

components:
  - name: takserver
    required: true
    description: Deploy TAK Server and the UDS Package config chart
    only:
      flavor: upstream
    import:
      path: common
    charts:
      - name: takserver
        valuesFiles:
          - values/upstream-values.yaml
    # The watcher creates this ConfigMap only after the ordered Ignite
    # restart has finished and the four TAK Deployments are Available.
    # A ConfigMap has no status, so Zarf treats it as healthy once it exists.
    # Deployment checks alone can pass before that restart scales them down.
    healthChecks:
      - apiVersion: v1
        kind: ConfigMap
        name: takserver-startup
        namespace: takserver
      - apiVersion: uds.dev/v1alpha1
        kind: Package
        name: takserver
        namespace: takserver
    actions:
      onCreate:
        before:
          - description: Build the OIDC render admission module
            dir: pepr
            cmd: ./build.sh

    # TAK images are built from the upstream source and published under this
    # repository. The tag is literal. Zarf 0.87 parses image refs before it
    # applies ###ZARF_VAR_*###, so a variable here is not a valid reference.
    # Helm values still use TAK_IMAGE_TAG. PostGIS and NATS are images the
    # upstream chart's dependencies render. The NATS toolbox is disabled in
    # values/common-values.yaml, so its image is not part of the package.
    images:
      - "ghcr.io/jonathanagustin/uds-k3d-takserver/takserver-api:5.7-RELEASE-14"
      - "ghcr.io/jonathanagustin/uds-k3d-takserver/takserver-messaging:5.7-RELEASE-14"
      - "ghcr.io/jonathanagustin/uds-k3d-takserver/takserver-config:5.7-RELEASE-14"
      - "ghcr.io/jonathanagustin/uds-k3d-takserver/takserver-plugins:5.7-RELEASE-14"
      - "ghcr.io/jonathanagustin/uds-k3d-takserver/takserver-database-setup:5.7-RELEASE-14"
      - "ghcr.io/jonathanagustin/uds-k3d-takserver/takserver-ignite:5.7-RELEASE-14"
      - "ghcr.io/jonathanagustin/uds-k3d-takserver/postgis:15-3.4"
      - "docker.io/library/nats:2.9.21-alpine"
      - "docker.io/natsio/nats-server-config-reloader:0.11.0"

  # Browser map client. Built from the upstream/cloudtak submodule by
  # .github/container-and-chart/cloudtak. See docs/cloudtak.md.
  - name: cloudtak
    required: false
    default: true
    description: Deploy CloudTAK, a browser map client connected to this TAK Server
    only:
      flavor: upstream
    charts:
      - name: uds-cloudtak
        namespace: cloudtak
        version: 0.1.0
        localPath: charts/cloudtak
        values:
          - sourcePath: .global.domain
            targetPath: .domain
    healthChecks:
      - apiVersion: uds.dev/v1alpha1
        kind: Package
        name: cloudtak
        namespace: cloudtak
      - apiVersion: apps/v1
        kind: Deployment
        name: cloudtak
        namespace: cloudtak
    images:
      - "ghcr.io/jonathanagustin/uds-k3d-takserver/cloudtak:v13.112.3" # cloudtak-version
      - "ghcr.io/jonathanagustin/uds-k3d-takserver/postgis:15-3.4"
